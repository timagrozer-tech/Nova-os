<script>/* js/core/state.js */
/* Игровое состояние: создание, миграции версий, проверка целостности структуры */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U;

  SN.fresh = function (opt) {
    opt = opt || {};
    const seed = (opt.seed != null ? opt.seed : (Date.now() ^ 0x5f3759df)) | 0;
    return {
      v: SN.SAVE_VERSION, mode: 'classic', seed, rng: seed, created: Date.now(),
      hero: { name: opt.name || 'Саня', skin: 1, hair: 1, beard: 1 },
      time: 8 * 60,                    // минуты с полуночи первого дня
      district: 'old',
      money: 340, bank: 0, account: false,
      st: { health: 72, food: 55, energy: 75, hygiene: 40, mood: 50, warmth: 55, stress: 40 },
      rep: 10, xp: 0,
      sk: { physical: 8, social: 6, intellect: 6, finance: 0, cooking: 2, tech: 0, trade: 0, craft: 3, driving: 0, music: 0, english: 2, design: 0, marketing: 0, law: 0 },
      docs: { passport: false, oms: false, medbook: false, license: false, ip: false },
      docsPending: {},                 // { passport: day готовности }
      certs: [], study: {},            // study: { courseId: часов пройдено }
      job: null,                       // { id, rank, shifts, hired, last, missed }
      gigs: {},                        // счётчики подработок
      housing: 'street', rentPaid: 0, deposit: 0, rentDebt: 0,
      items: [], clothes: ['worn'], wear: 'worn', groceries: 0, fish: 0,
      biz: [],
      fin: { deposit: 0, loan: 0, loanStart: 0, loanDue: 0, funds: { index: 0, crypto: 0 }, ledger: [], history: [],
        mkt: { p: {}, h: {}, gold: 0, gh: [] }, port: {}, bonds: [], terms: [], gold: 0, broker: false, mort: [], ins: { health: false, property: false },
        card: 'basic', cb: 0, autosave: 0, agency: false, goodPays: 0, badPays: 0, news: [] },
      perks: [], passive: [], itemVal: {}, nwHist: [],
      npc: {}, partner: null,
      quests: {}, ach: {}, flags: {}, daily: {}, lastDone: {},
      c: { jobs: 0, gigs: 0, meals: 0, sleeps: 0, studyH: 0, earned: 0, spent: 0, actions: 0, nightsStreet: 0, events: 0, dates: 0, bizProfitDays: 0, fishCaught: 0, collapses: 0, passive: 0, autoDays: 0 },
      log: [{ d: 1, t: 'Вы начинаете жизнь с нуля: 340 ₽, поношенная куртка и никаких документов. Соццентр в Старом районе — хорошее начало.' }],
      ill: null, weather: null, prices: 1, priceDays: 0,
      today: { inc: 0, exp: 0 }, days: [],   // история итогов дней
      pending: [],                     // очередь событий с выбором
      news: [],
      settings: { motion: true, transport: 'auto', bigText: false, vibro: true, auto: { work: 'auto', study: '', events: 'auto', maxHours: 10, saveCash: true } }
    };
  };

  /* Миграции: каждая функция поднимает сохранение на одну версию */
  SN.migrations = {
    /* v1 — прототип s_nulya_demo.html (ключ s-nulya-life-demo-v1) */
    1: function (old) {
      const s = SN.fresh();
      const num = (x, d) => Number.isFinite(+x) ? +x : d;
      s.hero.name = String(old.name || 'Саня').slice(0, 24);
      s.time = (Math.max(1, num(old.day, 1)) - 1) * 1440 + U.clamp(num(old.hour, 8), 0, 23) * 60;
      s.money = Math.max(0, num(old.money, 340));
      s.bank = Math.max(0, num(old.bank, 0)); s.account = s.bank > 0;
      s.xp = Math.max(0, num(old.xp, 0));
      ['health', 'food', 'energy', 'hygiene', 'mood', 'warmth'].forEach(k => { if (old[k] != null) s.st[k] = U.clamp(num(old[k], 50)); });
      s.rep = U.clamp(num(old.reputation, 10));
      s.c.jobs = num(old.jobCount, 0); s.c.meals = num(old.foodCount, 0); s.c.sleeps = num(old.sleepCount, 0);
      // Образование прототипа (0–6) переводим в сертификаты осторожно: только базовые
      const edu = num(old.education, 0);
      if (edu >= 1) s.certs.push('pc');
      if (edu >= 2) { s.certs.push('school'); s.docs.passport = true; }
      const map = { 'Палатка': 'tent', 'Велосипед': 'bike', 'Подержанный автомобиль': 'car', 'Спорткар': 'sportcar' };
      (Array.isArray(old.owned) ? old.owned : []).forEach(n => {
        if (map[n]) s.items.push(map[n]);
        if (n === 'Комната') { s.housing = 'room'; s.docs.passport = true; s.rentPaid = 7; }
        if (n === 'Квартира-студия') { s.housing = 'studio'; s.docs.passport = true; }
        if (n === 'Загородный дом') { s.housing = 'house'; s.docs.passport = true; }
        const b = { 'Тележка с напитками': 'drinks', 'Киоск с едой': 'kiosk', 'Мастерская': 'workshop', 'Кофейня': 'coffee', 'Мини-маркет': 'market', 'Торговый центр': 'mall' }[n];
        if (b) { s.docs.ip = true; s.docs.passport = true; s.biz.push(SN.Sys.biz.make(b)); }
      });
      s.log.unshift({ d: 1, t: 'Сохранение прототипа перенесено в новую версию игры.' });
      s.v = 2;
      return s;
    },
    /* v2 → v3 (игра 0.3): новые поля добавит normalize, прогресс сохраняется полностью */
    2: function (s) { s.v = 3; return s; }
  };

  SN.migrate = function (data) {
    let s = data;
    if (!s || typeof s !== 'object') throw Error('not object');
    if (!s.v) s.v = 1;
    while (s.v < SN.SAVE_VERSION) {
      const m = SN.migrations[s.v];
      if (!m) throw Error('no migration ' + s.v);
      s = m(s);
    }
    return SN.normalize(s);
  };

  /* Нормализация: дополняет недостающие поля, обрезает мусор, проверяет типы.
     Защищает от повреждённых и подделанных JSON-файлов. */
  SN.normalize = function (s) {
    const base = SN.fresh({ seed: s.seed | 0 });
    const out = {};
    for (const k in base) {
      const b = base[k], v = s[k];
      if (v === undefined || v === null && b !== null) { out[k] = b; continue; }
      if (b === null) { out[k] = (v && typeof v === 'object') ? v : null; continue; }
      if (typeof b === 'number') out[k] = Number.isFinite(+v) ? +v : b;
      else if (typeof b === 'string') out[k] = String(v).slice(0, 64);
      else if (typeof b === 'boolean') out[k] = !!v;
      else if (Array.isArray(b)) out[k] = Array.isArray(v) ? v.slice(0, 400) : b;
      else if (typeof b === 'object') out[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? Object.assign({}, b, v) : b;
    }
    for (const k in base.st) out.st[k] = U.clamp(+out.st[k] || 0);
    for (const k in base.sk) out.sk[k] = U.clamp(+out.sk[k] || 0);
    out.hero.name = String(out.hero.name || 'Саня').replace(/[<>]/g, '').slice(0, 24) || 'Саня';
    out.rep = U.clamp(out.rep);
    out.money = Math.round(out.money * 100) / 100; out.bank = Math.max(0, out.bank);
    out.time = Math.max(0, Math.floor(out.time));
    const D = SN.D;
    out.items = out.items.filter(i => D.items[i]);
    out.clothes = out.clothes.filter(i => D.clothes[i]); if (!out.clothes.length) out.clothes = ['worn'];
    if (!D.clothes[out.wear] || !out.clothes.includes(out.wear)) out.wear = out.clothes[0];
    if (!D.housing[out.housing]) out.housing = 'street';
    if (!D.districts[out.district]) out.district = 'old';
    out.certs = out.certs.filter(c => typeof c === 'string' && D.certNames[c]);
    out.biz = out.biz.filter(b => b && D.bizById[b.id]).map(b => Object.assign(SN.Sys.biz.make(b.id), b));
    out.passive = out.passive.filter(p => p && D.passiveById && D.passiveById[p.id]);
    out.perks = out.perks.filter(p => D.perkById && D.perkById[p]);
    for (const k of ['mkt', 'ins']) out.fin[k] = Object.assign({}, base.fin[k], out.fin[k] || {});
    for (const k of ['port']) if (!out.fin[k] || typeof out.fin[k] !== 'object') out.fin[k] = {};
    for (const k of ['bonds', 'terms', 'mort', 'news', 'ledger', 'history']) if (!Array.isArray(out.fin[k])) out.fin[k] = [];
    out.settings.auto = Object.assign({}, base.settings.auto, out.settings.auto || {});
    if (out.job && !D.jobById[out.job.id]) out.job = null;
    out.log = out.log.slice(0, 120); out.fin.ledger = (out.fin.ledger || []).slice(0, 120);
    out.v = SN.SAVE_VERSION;
    return out;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/clock.js */
/* Часы и календарь. Время идёт только от действий игрока.
   advance() двигает время шагами ≤ 60 мин, на каждом шаге — пассивные изменения показателей,
   при переходе через полночь — детерминированная обработка дня (dayTick). */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D;
  const T = SN.T = {};

  T.day = s => Math.floor(s.time / 1440) + 1;
  T.hour = s => Math.floor((s.time % 1440) / 60);
  T.minute = s => s.time % 60;
  T.hourF = s => (s.time % 1440) / 60;
  T.clock = s => String(T.hour(s)).padStart(2, '0') + ':' + String(T.minute(s)).padStart(2, '0');
  T.dateOf = function (day) {
    let m = D.START_MONTH, d = day, y = 2026;
    while (d > D.monthLen[m]) { d -= D.monthLen[m]; m++; if (m > 11) { m = 0; y++; } }
    return { d, m, y, wd: (D.START_WEEKDAY + day - 1) % 7 };
  };
  T.month = s => T.dateOf(T.day(s)).m;
  T.season = s => D.seasonOf(T.month(s));
  T.weekend = s => T.dateOf(T.day(s)).wd >= 5;
  T.dateLabel = s => { const o = T.dateOf(T.day(s)); return D.weekdays[o.wd] + ', ' + o.d + ' ' + D.months[o.m]; };
  T.phase = s => { const h = T.hourF(s); return h < 5 ? 'night' : h < 8 ? 'dawn' : h < 17 ? 'day' : h < 21 ? 'evening' : 'night'; };
  /* Проверка окна работы заведения. Окно [a,b], b может быть > 24 (после полуночи) */
  T.isOpen = (s, open, hours, addMin) => {
    if (!open) return true;
    let h = ((s.time + (addMin || 0)) % 1440) / 60; const [a, b] = open;
    if (b > 24 && h < b - 24) h += 24;
    return h >= a && h + (hours || 0) <= Math.max(b, a + 0.01) + 0.001;
  };

  /* Погода на день: от месяца + случайность */
  T.rollWeather = function (s) {
    const m = T.month(s);
    const temp = Math.round(D.monthTemp[m] + U.gauss(s) * 4);
    const r = U.rand(s);
    let kind = 'clear';
    if (temp <= -12 && r < 0.25) kind = 'storm';
    else if (r < 0.32) kind = temp <= 0 ? 'snow' : 'rain';
    else if (r < 0.62) kind = 'cloudy';
    else if (temp >= 27) kind = 'heat';
    s.weather = { temp, kind, day: T.day(s) };
  };
  T.ensureWeather = s => { if (!s.weather || s.weather.day !== T.day(s)) T.rollWeather(s); };

  /* Главный механизм хода времени.
     ctx: { sleep:bool, indoor:bool, q:качество сна } */
  T.advance = function (s, minutes, ctx) {
    ctx = ctx || {};
    let left = Math.max(0, Math.round(minutes));
    const reports = [];
    while (left > 0) {
      const toMidnight = 1440 - (s.time % 1440);
      const step = Math.min(left, 60, toMidnight);
      SN.Sys.stats.tick(s, step / 60, ctx);
      s.time += step; left -= step;
      if (s.time % 1440 === 0) reports.push(T.dayTick(s));
      if (s.st.health <= 0 && !ctx.noCollapse) { SN.Sys.stats.collapse(s); left = 0; }
    }
    if (reports.length) SN.emit('newday', reports);
    return reports;
  };

  /* Обработка наступления нового дня. Порядок важен и фиксирован → детерминизм. */
  T.dayTick = function (s) {
    const prevDay = T.day(s) - 1;
    const rep = { day: prevDay, inc: s.today.inc, exp: s.today.exp, lines: [], biz: [] };
    s.days.unshift({ d: prevDay, inc: Math.round(s.today.inc), exp: Math.round(s.today.exp) });
    s.days = s.days.slice(0, 30);
    s.today = { inc: 0, exp: 0 };
    s.daily = {};
    T.rollWeather(s);
    if (s.priceDays > 0 && --s.priceDays === 0) { s.prices = 1; rep.lines.push('Цены в городе вернулись к обычным.'); }
    const sys = SN.Sys;
    sys.prop.daily(s, rep);
    sys.biz.daily(s, rep);
    sys.fin.daily(s, rep);
    sys.inv.daily(s, rep);
    sys.stats.daily(s, rep);
    sys.docs.daily(s, rep);
    sys.work.daily(s, rep);
    sys.social.daily(s, rep);
    sys.events.daily(s, rep);
    sys.quests.check(s);
    rep.lines.forEach(t => SN.Sys.log(s, t));
    return rep;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/save.js */
/* Сохранения: localStorage + контрольная сумма + резервная копия + импорт/экспорт JSON.
   Ничего не отправляется в сеть. */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U;
  const Save = SN.Save = {};
  Save.KEY = 's-nulya-save-v2';
  Save.BAK = 's-nulya-save-v2-backup';
  Save.LEGACY = 's-nulya-life-demo-v1';
  Save.MAX = 1024 * 1024;

  const store = () => { try { return G.localStorage; } catch (e) { return null; } };
  Save.pack = s => { const data = JSON.stringify(s); return JSON.stringify({ format: 's-nulya-save', v: s.v, game: SN.VERSION, at: Date.now(), hash: U.hash(data), data }); };
  Save.unpack = function (txt) {
    if (typeof txt !== 'string' || txt.length > Save.MAX) throw Error('size');
    const o = JSON.parse(txt);
    // Формат v2: обёртка с хешем
    if (o && o.format === 's-nulya-save') {
      if (typeof o.data !== 'string' || U.hash(o.data) !== o.hash) throw Error('hash');
      return SN.migrate(JSON.parse(o.data));
    }
    // Старый формат прототипа: голый объект
    if (o && Number.isFinite(o.day) && Number.isFinite(o.money)) return SN.migrate(Object.assign({ v: 1 }, o));
    throw Error('format');
  };

  Save.write = function (s) {
    const st = store(); if (!st) return false;
    try {
      const prev = st.getItem(Save.KEY);
      if (prev) st.setItem(Save.BAK, prev);
      st.setItem(Save.KEY, Save.pack(s));
      return true;
    } catch (e) { console.warn('save failed', e); return false; }
  };
  /* Загрузка: основное → резервное → прототип → новая игра */
  Save.read = function () {
    const st = store(); const res = { state: null, source: 'new', warn: '' };
    if (!st) return res;
    for (const [k, src] of [[Save.KEY, 'main'], [Save.BAK, 'backup']]) {
      const raw = st.getItem(k); if (!raw) continue;
      try { res.state = Save.unpack(raw); res.source = src; if (src === 'backup') res.warn = 'Основное сохранение повреждено — загружена резервная копия.'; return res; }
      catch (e) { res.warn = 'Сохранение повреждено (' + e.message + ').'; }
    }
    const legacy = st.getItem(Save.LEGACY);
    if (legacy) { try { res.state = Save.unpack(legacy); res.source = 'legacy'; res.warn = 'Прогресс из прототипа перенесён в новую версию.'; return res; } catch (e) { /* игнор */ } }
    return res;
  };
  Save.clear = () => { const st = store(); if (st) { st.removeItem(Save.KEY); st.removeItem(Save.BAK); } };
  Save.exportText = s => Save.pack(s);
  Save.importText = txt => Save.unpack(txt);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/systems/stats.js */
/* Характеристики и здоровье: пассивные изменения, сон, болезни, последствия низких показателей.
   Принцип: последствия объяснимы, но тупиков нет — при обмороке героя бесплатно выхаживает больница. */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T;
  const S = SN.Sys.stats = {};

  S.ILL = {
    cold:   { name: 'Простуда', icon: '🤧', days: 4, energy: 0.8, health: 0.25, mood: 0.4 },
    poison: { name: 'Отравление', icon: '🤢', days: 2, energy: 1.2, health: 0.6, mood: 0.6 },
    injury: { name: 'Травма спины', icon: '🩹', days: 5, energy: 0.6, health: 0.2, mood: 0.5, noHeavy: true },
    flu:    { name: 'Грипп', icon: '🤒', days: 6, energy: 1.3, health: 0.6, mood: 0.6 }
  };

  S.warmthBonus = s => (D.clothes[s.wear] || D.clothes.worn).warmth;
  S.look = s => {
    let l = (D.clothes[s.wear] || D.clothes.worn).look;
    if (s.st.hygiene < 25) l -= 2; else if (s.st.hygiene < 45) l -= 1;
    l += Math.min(2, s.items.reduce((a, i) => a + (D.items[i] && D.items[i].look || 0), 0));
    return Math.max(0, l);
  };

  /* Пассивный шаг времени (h — доля часа) */
  S.tick = function (s, h, ctx) {
    T.ensureWeather(s);
    const st = s.st, w = s.weather, sleep = !!ctx.sleep;
    st.food -= (sleep ? 1.0 : 2.0) * h * (SN.perk(s, 'ironstomach') ? 0.85 : 1);
    st.hygiene -= (sleep ? 0.3 : 0.85) * h;
    if (sleep) {
      const q = ctx.q || 0.5;
      const sick = s.ill ? 0.7 : 1;
      st.energy += 11.5 * q * sick * h * (SN.perk(s, 'athlete') ? 1.1 : 1);
      if (st.food > 20) st.health += 0.7 * q * h;
      st.stress -= 2.2 * q * h;
    } else {
      st.energy -= 0.9 * h * (SN.perk(s, 'nightowl') ? 0.8 : 1);
    }
    // Тепло: в помещении растёт, на улице зависит от погоды и одежды
    const sheltered = ctx.indoor || (sleep && ctx.warm);
    if (sheltered) st.warmth += (st.warmth < 85 ? 9 : 0) * h;
    else {
      let d = (w.temp - 12) / 4 + S.warmthBonus(s) * 0.7;
      if (w.kind === 'rain') d -= 1.5;
      if (w.kind === 'snow') d -= 1;
      if (w.kind === 'storm') d -= 3;
      if (sleep && ctx.tent) d += 3;
      if (sleep && s.flags.dog) d += 1.5;
      d = U.clamp(d, -7, 3);
      if (d > 0 && st.warmth >= 75) d = 0;
      if (d < 0 && SN.perk(s, 'hardy')) d *= 0.7;
      st.warmth += d * h;
    }
    // Настроение и стресс медленно возвращаются к базе
    st.mood += (50 + (D.housing[s.housing].mood || 0) - st.mood) * 0.04 * h;
    st.stress += (28 - st.stress) * 0.03 * h;
    // Последствия низких показателей
    if (st.food < 15) { st.health -= 1.2 * h; st.mood -= 1 * h; st.stress += 1 * h; }
    if (st.warmth < 20) { st.health -= 0.9 * h; st.mood -= 0.8 * h; }
    if (st.hygiene < 20) st.mood -= 0.4 * h;
    if (st.energy < 10 && !sleep) st.stress += 1 * h;
    if (st.stress > 80) st.health -= 0.4 * h;
    if (s.ill) { const I = S.ILL[s.ill.id]; st.energy -= I.energy * h; st.health -= I.health * h; st.mood -= I.mood * h; }
    for (const k in st) st[k] = U.clamp(st[k]);
  };

  S.apply = function (s, eff, mult) {
    if (!eff) return;
    mult = mult || 1;
    for (const k in eff) {
      if (k in s.st) s.st[k] = U.clamp(s.st[k] + eff[k] * mult);
      else if (k === 'rep') s.rep = U.clamp(s.rep + eff[k]);
    }
  };
  S.gain = function (s, g, mult, cap) {
    if (!g) return;
    const m = (mult || 1) * (s.st.mood < 25 ? 0.7 : s.st.mood > 70 ? 1.15 : 1) * (s.st.stress > 75 ? 0.75 : 1);
    for (const k in g) {
      const limit = cap && cap[k] != null ? cap[k] : 100;
      if (s.sk[k] == null || s.sk[k] >= limit) continue;
      const km = (k === 'physical' && SN.perk(s, 'athlete') ? 1.3 : 1) * ((k === 'tech' || k === 'design') && s.items.includes('macbook') ? 1.2 : 1) * (k === 'cooking' && s.items.includes('kitchen') ? 2 : 1);
      s.sk[k] = Math.min(limit, U.clamp(s.sk[k] + g[k] * m * km * (1 - s.sk[k] / 160)));
    }
  };

  /* Где можно спать прямо сейчас */
  S.sleepOptions = function (s) {
    const h = T.hour(s), opts = [];
    const home = D.housing[s.housing];
    if (s.housing !== 'street') opts.push({ id: 'home', name: 'Спать дома', icon: home.icon, q: home.sleep * (s.items.includes('furniture') ? 1.1 : 1) * (s.items.includes('smarthome') ? 1.05 : 1), warm: true, cost: 0, district: home.district });
    opts.push({ id: 'shelter', name: 'Ночлежка (бесплатно)', icon: '🏚️', q: 0.75, warm: true, cost: 0, district: 'old', open: h >= 19 || h < 2, note: 'Заселение с 19:00 до 02:00' });
    if (s.housing === 'street') opts.push({ id: 'hostelNight', name: 'Ночь в хостеле', icon: '🛏️', q: 0.85, warm: true, cost: Math.round(780 * s.prices), district: 'old' });
    opts.push({ id: 'street', name: s.items.includes('tent') ? 'В палатке' : 'На улице', icon: s.items.includes('tent') ? '⛺' : '🧥', q: s.items.includes('tent') ? 0.62 : 0.48, warm: false, tent: s.items.includes('tent'), cost: 0, district: s.district });
    return opts;
  };

  /* Сон: до 7 утра (если вечер/ночь) или 8 часов днём */
  S.sleep = function (s, optId) {
    const o = S.sleepOptions(s).find(x => x.id === optId);
    if (!o) return SN.fail('Здесь нельзя переночевать.');
    if (o.open === false) return SN.fail(o.note);
    if (o.cost && !SN.Sys.econ.canPay(s, o.cost)) return SN.fail('Не хватает ' + U.money(o.cost - SN.Sys.econ.available(s)) + ' на ночь в хостеле.');
    if (o.district && o.district !== s.district) { const r = SN.Sys.city.travel(s, o.district); if (!r.ok) return r; }
    if (o.cost) SN.Sys.econ.pay(s, o.cost, 'housing', 'Ночь в хостеле');
    const hNow = T.hourF(s);
    let hours = (hNow >= 18 || hNow < 4) ? ((31 - hNow) % 24) : 8;
    hours = U.clamp(hours, 6, 11);
    const cashBefore = s.money;
    T.advance(s, hours * 60, { sleep: true, q: o.q, warm: o.warm, tent: o.tent, indoor: o.warm });
    s.c.sleeps++;
    let msg = 'Вы проспали ' + U.hrs(hours) + '. Энергия ' + Math.round(s.st.energy) + '%.';
    if (optId === 'street') {
      s.c.nightsStreet++;
      const risk = o.tent ? 0.04 : 0.09;
      if (cashBefore > 600 && U.chance(s, risk)) {
        const lost = Math.min(15000, Math.round(s.money * 0.35));
        s.money -= lost;
        msg += ' Ночью из кармана вытащили ' + U.money(lost) + '. Деньги надёжнее хранить на банковском счёте.';
        SN.Sys.log(s, 'Ночная кража: −' + U.money(lost));
      }
    }
    if (optId === 'shelter') { s.st.stress = U.clamp(s.st.stress + 3); s.flags.shelterNights = (s.flags.shelterNights || 0) + 1; }
    SN.Sys.quests.check(s);
    SN.say(msg, 'good');
    return SN.okr(msg);
  };

  S.nap = function (s) {
    T.advance(s, 120, { sleep: true, q: 0.8, warm: s.housing !== 'street', indoor: s.housing !== 'street' });
    return SN.okr('Вы немного отдохнули.');
  };

  S.getIll = function (s, id) {
    if (s.ill) return;
    s.ill = { id, left: S.ILL[id].days };
    SN.Sys.log(s, 'Вы заболели: ' + S.ILL[id].name + '.');
    SN.say(S.ILL[id].icon + ' ' + S.ILL[id].name + ': энергия расходуется быстрее. Лечение — медпункт, аптека, поликлиника.', 'bad');
  };
  S.treat = function (s, power) {
    if (!s.ill) return '';
    s.ill.left -= power * 2;
    if (s.ill.left <= 0) { const n = S.ILL[s.ill.id].name; s.ill = null; return ' Вы вылечились: ' + n.toLowerCase() + ' прошла.'; }
    return ' Болезнь отступает.';
  };

  S.daily = function (s, rep) {
    if (s.ill && --s.ill.left <= 0) { rep.lines.push('Вы поправились: ' + S.ILL[s.ill.id].name.toLowerCase() + ' прошла.'); s.ill = null; }
    // Шанс простыть при холоде
    if (!s.ill && s.st.warmth < 30 && U.chance(s, SN.perk(s, 'hardy') ? 0.15 : 0.3)) S.getIll(s, s.weather.temp < -5 ? 'flu' : 'cold');
  };

  /* Обморок: не конец игры. Скорая, городская больница, сутки на восстановление. */
  S.collapse = function (s) {
    s.c.collapses++;
    s.st.health = 1;
    SN.T.advance(s, 20 * 60, { sleep: true, q: 0.9, warm: true, indoor: true, noCollapse: true });
    s.st.health = Math.max(s.st.health, 45); s.st.food = Math.max(s.st.food, 50);
    s.st.warmth = Math.max(s.st.warmth, 70); s.st.energy = Math.max(s.st.energy, 55);
    s.st.stress = U.clamp(s.st.stress + 10); s.rep = U.clamp(s.rep - 2);
    s.district = 'hospital';
    if (s.ill) s.ill.left = Math.min(s.ill.left, 1);
    const t = 'Вы потеряли сознание на улице. Скорая отвезла вас в городскую больницу — лечение бесплатное. Берегите здоровье: ешьте и грейтесь вовремя.';
    SN.Sys.log(s, t);
    SN.emit('modal', { kind: 'info', icon: '🚑', title: 'Больница', text: t });
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/systems/economy.js */
/* Экономика: кошелёк, карта, журнал операций, цены района, проверки требований,
   передвижение по городу и универсальный исполнитель действий. */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;

  Sys.log = (s, t) => { s.log.unshift({ d: T.day(s), h: T.clock(s), t }); s.log = s.log.slice(0, 120); };

  const E = Sys.econ = {};
  /* Доступно к оплате: наличные + карта (если открыт счёт) */
  E.available = s => s.money + (s.account ? s.bank : 0);
  E.canPay = (s, x) => E.available(s) >= x;
  E.ledger = (s, amt, cat, note) => {
    s.fin.ledger.unshift({ d: T.day(s), h: T.clock(s), a: Math.round(amt), c: cat, n: note });
    s.fin.ledger = s.fin.ledger.slice(0, 120);
  };
  E.pay = function (s, amt, cat, note) {
    amt = Math.round(amt);
    if (amt <= 0) return true;
    if (!E.canPay(s, amt)) return false;
    const cash = Math.min(s.money, amt);
    s.money -= cash; s.bank -= (amt - cash);
    s.today.exp += amt; s.c.spent += amt;
    if (Sys.inv) Sys.inv.cashbackOn(s, amt, cat);
    E.ledger(s, -amt, cat, note);
    return true;
  };
  /* toBank — зарплата на карту при официальном трудоустройстве */
  E.earn = function (s, amt, cat, note, toBank) {
    amt = Math.round(amt);
    if (amt <= 0) return;
    if (toBank && s.account) s.bank += amt; else s.money += amt;
    s.today.inc += amt; s.c.earned += amt;
    E.ledger(s, amt, cat, note);
    if (Sys.inv) Sys.inv.autosaveOn(s, amt, cat, toBank);
  };
  /* Цена с учётом района и городской инфляции */
  E.price = (s, base, district, fixed) => fixed ? base : Math.round(base * (D.districts[district] ? D.districts[district].priceMult : 1) * s.prices * (SN.perk(s, 'thrifty') ? 0.95 : 1) / 5) * 5;

  /* Проверка требований. Возвращает текст причины или '' */
  E.reqFail = function (s, r) {
    if (!r) return '';
    for (const d of r.docs || []) if (!s.docs[d]) return 'Нужен документ: ' + D.docNames[d];
    for (const c of r.certs || []) if (!s.certs.includes(c)) return 'Нужно обучение: ' + D.certNames[c];
    for (const k in r.skills || {}) if (s.sk[k] < r.skills[k]) return 'Нужен навык «' + D.skillNames[k] + '» ' + r.skills[k] + ' (сейчас ' + Math.floor(s.sk[k]) + ')';
    for (const i of r.items || []) if (!Sys.prop.has(s, i)) return 'Нужно: ' + D.items[i].name.toLowerCase();
    if (r.rep && s.rep < r.rep) return 'Нужна репутация ' + r.rep;
    if (r.look && Sys.stats.look(s) < r.look) return 'Нужен более опрятный вид (одежда/гигиена)';
    if (r.hygiene && s.st.hygiene < r.hygiene) return 'Слишком неопрятный вид — нужна гигиена ' + r.hygiene;
    if (r.flag && !s.flags[r.flag]) return 'Сейчас недоступно';
    if (r.any && !r.any.some(x => !E.reqFail(s, x))) return E.reqFail(s, r.any[0]);
    return '';
  };

  // ── Город и транспорт
  const C = Sys.city = {};
  C.modeAvailable = function (s, id) {
    const t = D.transport[id];
    if (t.item && !Sys.prop.has(s, t.item)) return false;
    if (t.doc && !s.docs[t.doc]) return false;
    if (t.open && !T.isOpen(s, t.open)) return false;
    return true;
  };
  /* Выбор транспорта: явная настройка игрока или «авто» — разумный выбор по деньгам */
  C.pickMode = function (s) {
    const pref = s.settings.transport;
    if (pref !== 'auto' && C.modeAvailable(s, pref) && E.canPay(s, D.transport[pref].cost)) return pref;
    const order = E.available(s) > 3000 ? ['moto', 'car', 'metro', 'scooter', 'bike', 'bus', 'walk'] : ['scooter', 'bike', 'bus', 'walk'];
    for (const id of order) if (C.modeAvailable(s, id) && E.canPay(s, D.transport[id].cost) && !(id === 'bus' && E.available(s) < 400)) return id;
    return 'walk';
  };
  C.travelInfo = (s, to) => { if (to === s.district) return null; const m = C.pickMode(s); return Object.assign({ id: m }, D.transport[m]); };
  C.travel = function (s, to, modeId) {
    if (!D.districts[to] || to === s.district) return SN.okr('');
    const m = modeId || C.pickMode(s), t = D.transport[m];
    if (!C.modeAvailable(s, m)) return SN.fail(t.name + ' сейчас недоступен.');
    if (t.cost && !E.pay(s, t.cost, 'transport', t.name + ' → ' + D.districts[to].name)) return SN.fail('Не хватает денег на ' + t.name.toLowerCase() + '.');
    // Даже без сил до места можно добрести — медленнее. Тупиков нет.
    const tired = s.st.energy < t.energy;
    s.st.energy = U.clamp(s.st.energy - t.energy);
    T.advance(s, t.mins * (tired ? 1.5 : 1) * (SN.perk(s, 'driver') ? 0.75 : 1), { indoor: m !== 'walk' && m !== 'bike' });
    s.district = to;
    s.flags['visited_' + to] = true;
    if (m === 'walk') Sys.stats.gain(s, { physical: 0.2 });
    return SN.okr(t.icon + ' ' + D.districts[to].name);
  };
  C.etaMins = (s, dest) => dest && dest !== s.district ? D.transport[C.pickMode(s)].mins * (SN.perk(s, 'driver') ? 0.75 : 1) : 0;
  C.hoursLabel = o => String(o[0]).padStart(2, '0') + ':00–' + String(o[1] % 24).padStart(2, '0') + ':00';
  C.homeDistrict = s => s.housing === 'street' ? null : D.housing[s.housing].district;
  /* Куда нужно ехать для действия: null — можно здесь */
  C.needTravel = function (s, where) {
    if (!where || where === 'any') return null;
    if (where === 'home') return C.homeDistrict(s) === s.district ? null : C.homeDistrict(s);
    if (Array.isArray(where)) return where.includes(s.district) ? null : where[0];
    return where === s.district ? null : where;
  };

  // ── Универсальное действие из D.actions
  const A = Sys.act = {};
  A.cost = (s, a) => E.price(s, a.cost || 0, Array.isArray(a.where) ? s.district : (a.where === 'any' || a.where === 'home' ? s.district : a.where), a.fixed);
  A.check = function (s, a) {
    if (a.where === 'home' && s.housing === 'street') return 'Нужно жильё';
    if (a.special === 'cook' && !(D.housing[s.housing].kitchen || s.items.includes('stove'))) return 'Нужна кухня или плитка';
    if (a.special === 'cook' && s.groceries < 1) return 'Нет продуктов';
    const rf = E.reqFail(s, a.req); if (rf) return rf;
    if (a.daily && (s.daily[a.id] || 0) >= a.daily) return 'Уже было сегодня';
    if (a.special === 'charityClothes' && s.lastDone.charity && T.day(s) - s.lastDone.charity < 14) return 'Следующая выдача через ' + (14 - (T.day(s) - s.lastDone.charity)) + ' дн.';
    if (a.special === 'trip' && s.lastDone.trip && T.day(s) - s.lastDone.trip < 14) return 'Недавно путешествовали';
    if (a.special === 'docPassport' && (s.docs.passport || s.docsPending.passport)) return s.docs.passport ? 'Паспорт уже есть' : 'Паспорт готовится';
    if (a.special === 'docOms' && (s.docs.oms || s.docsPending.oms)) return s.docs.oms ? 'Полис уже есть' : 'Полис готовится';
    if (a.special === 'docMedbook' && s.docs.medbook) return 'Медкнижка уже есть';
    if (a.special === 'docIp' && (s.docs.ip || s.docsPending.ip)) return s.docs.ip ? 'ИП уже открыто' : 'Регистрация идёт';
    if (a.energy && s.st.energy < a.energy) return 'Мало энергии';
    if (s.ill && Sys.stats.ILL[s.ill.id].noHeavy && (a.energy || 0) >= 14) return 'Травма: тяжёлые нагрузки нельзя';
    return '';
  };
  A.run = function (s, id) {
    const a = D.actionById[id];
    if (!a) return SN.fail('Неизвестное действие');
    const why = A.check(s, a); if (why) return SN.fail(why);
    if (a.special === 'nap') return Sys.stats.nap(s);
    const dest = C.needTravel(s, a.where);
    if (a.open && !T.isOpen(s, a.open, a.hours, C.etaMins(s, dest))) return SN.fail('Закрыто к вашему приходу. Часы: ' + C.hoursLabel(a.open));
    if (dest) { const r = C.travel(s, dest); if (!r.ok) return r; }
    let cost = A.cost(s, a);
    if (a.special === 'docPassport') cost = s.flags.ninaReferral ? 0 : 1500;
    if (a.id === 'clinic' && s.fin.ins && s.fin.ins.health) cost = 0;
    if (cost && !E.pay(s, cost, a.cat, a.name)) return SN.fail('Не хватает ' + U.money(cost - E.available(s)));
    if (a.energy) s.st.energy = U.clamp(s.st.energy - a.energy);
    T.advance(s, a.hours * 60, { indoor: a.indoor });
    let extra = '';
    if (a.special === 'fishing') { s.c.actions++; SN.emit('minigame', 'fishing'); return SN.okr(''); }
    if (a.special && A.specials[a.special]) extra = A.specials[a.special](s, a) || '';
    let mult = 1;
    if (a.id === 'sportground' || a.id === 'gym') mult = s.wear === 'sport' ? 1.2 : 1;
    Sys.stats.apply(s, a.eff, a.id === 'cookhome' && s.items.includes('kitchen') ? 1.3 : 1);
    Sys.stats.gain(s, a.gain, mult, a.cap);
    if (a.cat === 'food' && a.eff && a.eff.food) s.c.meals++;
    if (a.risk === 'poison' && !SN.perk(s, 'ironstomach') && U.chance(s, 0.04)) Sys.stats.getIll(s, 'poison');
    s.daily[a.id] = (s.daily[a.id] || 0) + 1;
    s.c.actions++; s.xp += Math.max(2, Math.round(a.hours * 3));
    Sys.quests.check(s);
    const msg = a.icon + ' ' + a.name + (cost ? ' (−' + U.money(cost) + ')' : '') + '.' + extra;
    SN.say(msg, 'good');
    return SN.okr(msg);
  };
  A.specials = {
    groceries: s => { s.groceries += 4; return ' Продуктов дома: ' + s.groceries + ' порц.'; },
    cook: s => { s.groceries--; return ' Осталось порций: ' + s.groceries + '.'; },
    charityClothes: s => {
      s.lastDone.charity = T.day(s);
      if (!s.clothes.includes('charity')) { s.clothes.push('charity'); s.wear = 'charity'; return ' Вам выдали чистую одежду по сезону — уже надета.'; }
      s.st.hygiene = U.clamp(s.st.hygiene + 10); return ' Вещи обновили на чистые.';
    },
    treat: (s, a) => Sys.stats.treat(s, a.heal),
    trip: s => { s.lastDone.trip = T.day(s); s.flags.traveled = (s.flags.traveled || 0) + 1; return ' Новые впечатления!'; },
    docPassport: s => { s.docsPending.passport = T.day(s) + 5; return ' Паспорт будет готов через 5 дней — заберите в МФЦ (готовый документ выдадут автоматически).'; },
    docOms: s => { s.docsPending.oms = T.day(s) + 2; return ' Полис будет готов через 2 дня.'; },
    docMedbook: s => { s.docs.medbook = true; return ' Медкнижка получена!'; },
    docIp: s => { s.docsPending.ip = T.day(s) + 3; return ' ИП будет зарегистрировано через 3 дня.'; }
  };

  // ── Документы
  const Doc = Sys.docs = {};
  Doc.daily = function (s, rep) {
    const d = T.day(s);
    for (const k in s.docsPending) {
      if (d >= s.docsPending[k]) {
        s.docs[k] = true; delete s.docsPending[k];
        rep.lines.push('Документ готов: ' + D.docNames[k] + '.');
      }
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);
