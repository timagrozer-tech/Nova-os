<script>/* js/systems/work.js */
/* Работа и образование */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const E = () => Sys.econ, C = () => Sys.city;
  const W = Sys.work = {};

  W.where = (s, j) => j.district === 'home' ? C().homeDistrict(s) : j.district;
  W.rankName = (j, r) => j.track ? j.track[Math.min(r, j.track.length - 1)] : j.name;
  W.payEstimate = function (s, j) {
    let p = j.pay;
    if (j.scaleSkill === 'music') p = 120 + s.sk.music * 14;
    else if (j.scaleSkill === 'blog') p = Math.min(16000, 300 + (s.flags.subs || 0) * 0.06);
    else if (j.scaleSkill) p *= 1 + s.sk[j.scaleSkill] * 0.006;
    if (j.kind === 'job' && s.job && s.job.id === j.id) p *= D.RANK_MULT[s.job.rank];
    if (j.id === 'photo' && s.items.includes('drone')) p *= 1.25;
    if (SN.perk(s, 'negotiator')) p *= 1.1;
    return Math.round(p * s.prices / 10) * 10;
  };

  /* Причина, почему нельзя выйти на смену прямо сейчас (или '') */
  W.check = function (s, j, ignoreTime) {
    if (j.district === 'home' && s.housing === 'street') return 'Нужно жильё с розеткой и тишиной';
    const rf = E().reqFail(s, j.req); if (rf) return rf;
    if (j.kind === 'job') {
      if (!s.job || s.job.id !== j.id) return 'Вы здесь не работаете';
      if (s.job.last === T.day(s)) return 'Смена уже отработана сегодня';
    }
    if (j.limit && (s.daily['gig_' + j.id] || 0) >= j.limit) return j.limit === 1 ? 'Сегодня уже работали здесь' : 'Лимит смен на сегодня (' + j.limit + ')';
    if (s.ill && Sys.stats.ILL[s.ill.id].noHeavy && j.energy >= 20) return 'Травма: тяжёлая работа запрещена';
    if (s.st.energy < Math.min(95, j.energy + 4)) return 'Мало энергии (нужно ' + (j.energy + 4) + ')';
    if (s.st.food < 12) return 'Сначала поешьте';
    if (!ignoreTime) {
      const dest = W.where(s, j);
      const eta = C().etaMins(s, dest);
      const ok = j.kind === 'gig' ? T.isOpen(s, j.open, j.hours, eta) : T.isOpen(s, j.open, 0, eta);
      if (!ok) return j.kind === 'gig' ? 'Не успеть до закрытия (' + C().hoursLabel(j.open) + ')' : 'Смена начинается с ' + j.open[0] + ':00 до ' + j.open[1] + ':00';
    }
    return '';
  };

  W.shift = function (s, id) {
    const j = D.jobById[id];
    if (!j) return SN.fail('Нет такой работы');
    const why = W.check(s, j); if (why) return SN.fail(why);
    const dest = W.where(s, j);
    if (dest && dest !== s.district) { const r = C().travel(s, dest); if (!r.ok) return r; }
    if (j.fuel && !E().pay(s, j.fuel, 'work', 'Топливо')) return SN.fail('Не хватает на топливо');
    s.st.energy = U.clamp(s.st.energy - j.energy * (SN.perk(s, 'workaholic') ? 0.85 : 1));
    s.st.hygiene = U.clamp(s.st.hygiene - j.hyg);
    T.advance(s, j.hours * 60, { indoor: j.indoor });
    if (j.perk) Sys.stats.apply(s, j.perk);
    let perf = 0.88 + U.rand(s) * 0.24;
    if (s.st.mood < 25) perf *= 0.9;
    if (s.st.stress > 75) perf *= 0.9;
    if (j.id === 'busk' && ['rain', 'snow', 'storm'].includes(s.weather.kind)) perf *= 0.45;
    if (j.id === 'busk' && T.weekend(s)) perf *= 1.3;
    if (SN.perk(s, 'lucky')) perf += 0.05;
    if (j.tips) perf *= 0.8 + U.rand(s) * (0.4 + s.sk.social / 100) * (SN.perk(s, 'lucky') ? 1.2 : 1);
    if (j.commission) perf *= U.chance(s, 0.25 + (SN.perk(s, 'lucky') ? 0.08 : 0) + s.sk.trade / 400) ? 2 + U.rand(s) : 0.4 + U.rand(s) * 0.4;
    if (j.id === 'stream') s.flags.subs = (s.flags.subs || 0) + Math.round(40 + s.sk.social * 3 + s.sk.marketing * 4 + U.rand(s) * 60);
    const pay = Math.round(W.payEstimate(s, j) * perf / 10) * 10;
    const official = j.kind === 'job';
    E().earn(s, pay, 'work', (official ? W.rankName(j, s.job.rank) : j.name), official);
    Sys.stats.gain(s, j.gain);
    s.st.stress = U.clamp(s.st.stress + (j.hours * 0.8 - (official ? 2 : 0)) * (SN.perk(s, 'zen') ? 0.6 : 1));
    s.xp += j.hours * 5; s.rep = U.clamp(s.rep + (official ? 0.4 : 0.15));
    let msg = j.icon + ' Смена окончена: +' + U.money(pay) + (official && s.account ? ' на карту' : '') + '.';
    if (j.risk && U.chance(s, j.risk * (s.st.energy < 25 ? 3 : 1))) { Sys.stats.getIll(s, 'injury'); msg += ' Неудачно потянули спину.'; }
    if (official) {
      s.c.jobs++; s.job.shifts++; s.job.last = T.day(s); s.job.missed = 0;
      msg += W.promote(s, j);
    } else { s.c.gigs++; s.gigs[id] = (s.gigs[id] || 0) + 1; s.daily['gig_' + id] = (s.daily['gig_' + id] || 0) + 1; }
    Sys.quests.check(s);
    SN.say(msg, 'good');
    return SN.okr(msg);
  };

  W.promote = function (s, j) {
    const r = s.job.rank;
    if (r >= 4) return '';
    if (s.job.shifts >= D.RANK_SHIFTS[r + 1] && s.sk[j.promo] >= D.RANK_SKILL[r + 1]) {
      s.job.rank++;
      s.rep = U.clamp(s.rep + 4);
      const t = 'Повышение! Теперь вы — ' + W.rankName(j, s.job.rank) + '. Оплата ×' + D.RANK_MULT[s.job.rank].toFixed(2).replace('.', ',') + '.';
      Sys.log(s, t);
      SN.emit('modal', { kind: 'info', icon: '📈', title: 'Повышение', text: t });
      return ' ' + t;
    }
    return '';
  };
  W.nextPromo = function (s, j) {
    const r = s.job.rank; if (r >= 4) return 'Вершина карьеры';
    return 'До повышения: смены ' + s.job.shifts + '/' + D.RANK_SHIFTS[r + 1] + ', ' + D.skillNames[j.promo].toLowerCase() + ' ' + Math.floor(s.sk[j.promo]) + '/' + D.RANK_SKILL[r + 1];
  };

  /* Отклик на вакансию → собеседование */
  W.applyCheck = function (s, j) {
    if (s.job && s.job.id === j.id) return 'Вы уже здесь работаете';
    const rf = E().reqFail(s, j.req); if (rf) return rf;
    const cd = s.flags['iv_' + j.id];
    if (cd && T.day(s) < cd) return 'Повторный отклик через ' + (cd - T.day(s)) + ' дн.';
    return '';
  };
  W.interviewChance = function (s, j, score) {
    let p = (SN.perk(s, 'charisma') ? 0.47 : 0.42) + score * 0.12 + Sys.stats.look(s) * 0.05 + s.sk.social * 0.004 + s.rep * 0.003 - j.interview;
    if (s.st.hygiene < 35) p -= 0.2;
    if (s.st.stress > 70) p -= 0.08;
    if (s.flags.interviewBonus) p += 0.15;
    return U.clamp(p, 0.05, 0.95);
  };
  W.interview = function (s, id, score) {
    const j = D.jobById[id];
    const why = W.applyCheck(s, j); if (why) return SN.fail(why);
    if (j.district !== s.district) { const r = C().travel(s, j.district); if (!r.ok) return r; }
    T.advance(s, 60, { indoor: true });
    const p = W.interviewChance(s, j, score);
    delete s.flags.interviewBonus;
    if (U.chance(s, p)) {
      if (s.job) Sys.log(s, 'Вы уволились с должности «' + W.rankName(D.jobById[s.job.id], s.job.rank) + '».');
      s.job = { id, rank: 0, shifts: 0, hired: T.day(s), last: 0, missed: 0 };
      s.rep = U.clamp(s.rep + 3);
      Sys.log(s, 'Приняты на работу: ' + j.name + '.');
      Sys.quests.check(s);
      return { ok: true, hired: true, msg: 'Вас приняли! ' + j.name + '. Смена начинается с ' + j.open[0] + ':00 до ' + j.open[1] + ':00 по будням.' + (s.account ? ' Зарплата приходит на карту.' : ' Откройте счёт в банке, чтобы получать зарплату на карту.') };
    }
    s.flags['iv_' + id] = T.day(s) + 2;
    s.st.mood = U.clamp(s.st.mood - 6);
    return { ok: true, hired: false, msg: 'Вам перезвонят… но, похоже, не в этот раз. Шанс был ' + Math.round(p * 100) + '%. Улучшите вид, навыки или репутацию и попробуйте через 2 дня.' };
  };
  W.quit = function (s) {
    if (!s.job) return SN.fail('Вы нигде не работаете');
    Sys.log(s, 'Вы уволились: ' + D.jobById[s.job.id].name + '.');
    s.job = null;
    return SN.okr('Вы уволились по собственному желанию.');
  };
  W.daily = function (s, rep) {
    if (!s.job) return;
    const prev = T.day(s) - 1;
    if (T.dateOf(prev).wd >= 5 || s.job.hired >= prev || s.job.last === prev || s.ill) return;
    s.job.missed++;
    if (s.job.missed === 3) rep.lines.push('⚠️ Начальник недоволен: 3 прогула подряд. Ещё два — и увольнение.');
    if (s.job.missed >= 5) {
      rep.lines.push('Вас уволили за прогулы с работы «' + D.jobById[s.job.id].name + '». Репутация −6.');
      s.rep = U.clamp(s.rep - 6); s.job = null;
    }
  };

  /* Лучшая доступная сейчас работа — для кнопки «Работать» на главном экране */
  W.best = function (s) {
    if (s.job) { const j = D.jobById[s.job.id]; if (!W.check(s, j)) return j; }
    let best = null, bestRate = 0;
    for (const j of D.jobs) {
      if (j.kind !== 'gig' || W.check(s, j)) continue;
      const rate = W.payEstimate(s, j) / j.hours - j.energy * 2;
      if (rate > bestRate) { bestRate = rate; best = j; }
    }
    return best;
  };

  // ── Образование
  const Ed = Sys.edu = {};
  Ed.done = (s, c) => c.cert ? s.certs.includes(c.cert) : c.doc ? s.docs[c.doc] : false;
  Ed.progress = (s, c) => s.study[c.id] || 0;
  Ed.sessionCost = (c, s) => c.repeat ? (c.sessionPrice || 0) : c.hours ? Math.round(c.cost * (s && c.id === 'programming' && s.flags.kolyaDiscount ? 0.7 : 1) * c.session / c.hours / 10) * 10 : 0;
  Ed.check = function (s, c, ignoreTime) {
    if (Ed.done(s, c)) return 'Пройдено';
    const rf = E().reqFail(s, c.req); if (rf) return rf;
    if (c.cap) for (const k in c.cap) if (s.sk[k] >= c.cap[k]) return 'Для роста дальше нужен систематический курс';
    if (s.st.energy < 15) return 'Слишком устали для учёбы';
    if (s.st.food < 12) return 'Сначала поешьте';
    if (!ignoreTime && !T.isOpen(s, c.open, c.session, C().etaMins(s, c.district))) return 'Занятия: ' + C().hoursLabel(c.open);
    const cost = Ed.sessionCost(c, s);
    if (cost && !E().canPay(s, cost)) return 'Занятие стоит ' + U.money(cost);
    return '';
  };
  Ed.study = function (s, id) {
    const c = D.courseById[id];
    const why = Ed.check(s, c); if (why) return SN.fail(why);
    if (c.district !== s.district) { const r = C().travel(s, c.district); if (!r.ok) return r; }
    const cost = Ed.sessionCost(c, s);
    if (cost && !E().pay(s, cost, 'study', c.name)) return SN.fail('Не хватает денег');
    s.st.energy = U.clamp(s.st.energy - c.session * 3.5);
    T.advance(s, c.session * 60, { indoor: true });
    Sys.stats.gain(s, c.gain, SN.perk(s, 'fastlearner') ? 1.25 : 1, c.cap);
    s.c.studyH += c.session; s.xp += c.session * 6;
    s.st.stress = U.clamp(s.st.stress + c.session * 0.6 * (SN.perk(s, 'zen') ? 0.6 : 1));
    let msg;
    if (c.repeat) { const k = Object.keys(c.gain)[0]; msg = c.icon + ' Вы позанимались ' + c.session + ' ч. ' + D.skillNames[k] + ' ' + Math.floor(s.sk[k]) + '.'; }
    else {
      s.study[id] = (s.study[id] || 0) + c.session;
      if (s.study[id] >= c.hours) {
        if (c.cert) s.certs.push(c.cert);
        if (c.doc) s.docs[c.doc] = true;
        s.rep = U.clamp(s.rep + 3); s.xp += 50;
        msg = '🎓 Обучение завершено: ' + c.name + '!';
        Sys.log(s, msg);
        SN.emit('modal', { kind: 'info', icon: '🎓', title: 'Документ получен', text: c.name + ' — пройдено. Теперь доступны новые профессии и возможности.' });
      } else msg = c.icon + ' Занятие пройдено: ' + s.study[id] + '/' + c.hours + ' ч.';
    }
    Sys.quests.check(s);
    SN.say(msg, 'good');
    return SN.okr(msg);
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/systems/property.js */
/* Имущество и жильё: аренда с залогом, покупка/продажа, коммуналка, вещи и одежда */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const E = () => Sys.econ;
  const P = Sys.prop = {};

  P.checkHome = function (s, id) {
    const h = D.housing[id];
    if (s.housing === id) return 'Вы уже здесь живёте';
    const rf = E().reqFail(s, h.req); if (rf) return rf;
    const need = h.type === 'rent' ? h.weekly + h.deposit : h.price;
    const refund = P.refundValue(s);
    if (!E().canPay(s, need - refund)) return 'Нужно ' + U.money(need) + (refund ? ' (с учётом возврата ' + U.money(refund) + ')' : '');
    return '';
  };
  /* Сколько вернётся при переезде: залог (если без долгов) или 85% стоимости своего жилья */
  P.refundValue = function (s) {
    const cur = D.housing[s.housing];
    if (cur.type === 'rent') return s.rentDebt > 0 ? 0 : s.deposit;
    if (cur.type === 'own') return Math.round(cur.price * 0.85);
    return 0;
  };
  P.moveOut = function (s) {
    const cur = D.housing[s.housing]; const refund = P.refundValue(s);
    if (refund) E().earn(s, refund, 'housing', cur.type === 'own' ? 'Продажа: ' + cur.name : 'Возврат залога');
    s.housing = 'street'; s.deposit = 0; s.rentPaid = 0; s.rentDebt = 0;
    if (s.partner && s.npc[s.partner] && s.npc[s.partner].livingTogether) { s.npc[s.partner].livingTogether = false; }
    return refund;
  };
  /* Есть ли вещь (с учётом замен: флагман = смартфон, бизнес-седан = авто…) */
  P.has = (s, id) => s.items.includes(id) || (D.itemAlias && (D.itemAlias[id] || []).some(x => s.items.includes(x)));
  P.itemValue = (s, id) => { const it = D.items[id]; return it.apr ? Math.round((s.itemVal[id] || it.price) * it.sell) : Math.round(it.price * it.sell); };
  P.takeHome = function (s, id, mortgage) {
    const h = D.housing[id];
    if (mortgage && h.type === 'own') {
      if (s.housing === id) return SN.fail('Вы уже здесь живёте');
      const q = Sys.inv.mortQuote(s, h.price); if (q.why) return SN.fail(q.why);
      const refund = P.refundValue(s);
      if (!E().canPay(s, q.down - refund)) return SN.fail('Первый взнос ' + U.money(q.down));
      if (s.housing !== 'street') P.moveOut(s);
      E().pay(s, q.down, 'housing', 'Первый взнос: ' + h.name);
      Sys.inv.addMort(s, q, 'home', id, h.name);
      s.housing = id; s.rentDebt = 0; s.rentPaid = T.day(s) + 7;
      T.advance(s, 120, { indoor: true });
      Sys.log(s, 'Купили жильё в ипотеку: ' + h.name + '.');
      Sys.quests.check(s);
      SN.say(h.icon + ' Новый адрес: ' + h.name + ' (ипотека ' + U.money(q.pay) + '/день)', 'good');
      return SN.okr(h.name);
    }
    const why = P.checkHome(s, id); if (why) return SN.fail(why);
    if (s.housing !== 'street') P.moveOut(s);
    if (h.type === 'rent') {
      E().pay(s, h.weekly + h.deposit, 'housing', 'Аренда + залог: ' + h.name);
      s.deposit = h.deposit; s.rentPaid = T.day(s) + 7;
    } else {
      E().pay(s, h.price, 'housing', 'Покупка: ' + h.name);
      s.rentPaid = T.day(s) + 7;
    }
    s.housing = id; s.rentDebt = 0;
    T.advance(s, 120, { indoor: true });
    Sys.log(s, (h.type === 'rent' ? 'Сняли жильё: ' : 'Купили жильё: ') + h.name + '.');
    Sys.quests.check(s);
    SN.say(h.icon + ' Новый адрес: ' + h.name, 'good');
    return SN.okr(h.name);
  };
  P.leave = function (s) {
    if (s.housing === 'street') return SN.fail('Вам некуда съезжать');
    const name = D.housing[s.housing].name, r = P.moveOut(s);
    Sys.log(s, 'Вы съехали: ' + name + (r ? ', получено ' + U.money(r) : '') + '.');
    return SN.okr('Вы съехали. ' + (r ? 'Возврат: ' + U.money(r) : ''));
  };

  /* Еженедельные платежи: аренда/коммуналка + обслуживание техники */
  P.weeklyBill = function (s) {
    const h = D.housing[s.housing];
    let sum = h.type === 'rent' ? h.weekly : h.type === 'own' ? h.upkeep * (s.items.includes('smarthome') ? 0.8 : 1) : 0;
    s.items.forEach(i => { if (D.items[i].upkeep) sum += D.items[i].upkeep; });
    return Math.round(sum * (s.partner && s.npc[s.partner] && s.npc[s.partner].livingTogether ? 0.6 : 1));
  };
  P.daily = function (s, rep) {
    const day = T.day(s);
    // Ежедневные эффекты вещей и изменение цены коллекционных предметов
    for (const i of s.items) {
      const it = D.items[i];
      if (it.homeDaily && (s.housing !== 'street' || !it.needHome)) Sys.stats.apply(s, it.homeDaily);
      if (it.skillDaily && s.housing !== 'street') Sys.stats.gain(s, it.skillDaily);
      if (it.apr) s.itemVal[i] = Math.max(it.price * 0.3, (s.itemVal[i] || it.price) * (1 + it.apr[0] + U.gauss(s) * it.apr[1]));
    }
    const hasBills = s.housing !== 'street' || s.items.some(i => D.items[i].upkeep);
    if (!hasBills) return;
    if (!s.rentPaid) s.rentPaid = day + 7;
    if (day < s.rentPaid) return;
    const bill = P.weeklyBill(s);
    if (E().pay(s, bill, 'housing', 'Еженедельные платежи')) {
      s.rentPaid = day + 7;
      if (s.rentDebt) rep.lines.push('Долг по жилью погашен.');
      s.rentDebt = 0;
      rep.lines.push('Списаны платежи за неделю (жильё и обслуживание): ' + U.money(bill) + '.');
      return;
    }
    s.rentDebt++;
    if (D.housing[s.housing].type === 'rent') {
      if (s.rentDebt >= 4) {
        rep.lines.push('Вас выселили за неуплату. Залог ушёл в счёт долга. Ночлежка в Старом районе принимает бесплатно.');
        s.deposit = 0; s.housing = 'street'; s.rentPaid = 0; s.rentDebt = 0; s.rep = U.clamp(s.rep - 5);
      } else rep.lines.push('⚠️ Нечем платить за жильё (' + U.money(bill) + '). Просрочка ' + s.rentDebt + ' дн. из 3 — затем выселение.');
    } else {
      s.st.mood = U.clamp(s.st.mood - 4);
      rep.lines.push('⚠️ Не хватает на коммуналку и обслуживание (' + U.money(bill) + '). Долг растёт, репутация падает.');
      s.rep = U.clamp(s.rep - 1);
    }
  };

  P.itemPrice = (s, id) => Math.round(D.items[id].price * (s.flags.discountDay === T.day(s) && !D.items[id].apr ? 0.75 : 1) * (SN.perk(s, 'haggler') && !D.items[id].apr ? 0.9 : 1));
  P.buyItem = function (s, id) {
    const it = D.items[id];
    if (s.items.includes(id)) return SN.fail('Уже есть');
    if (it.needHome && s.housing === 'street') return SN.fail('Сначала нужно жильё');
    const p = P.itemPrice(s, id);
    if (!E().pay(s, p, 'items', it.name)) return SN.fail('Нужно ещё ' + U.money(p - E().available(s)));
    s.items.push(id);
    if (id === 'phone') delete s.flags.phoneBroken;
    T.advance(s, 30, { indoor: true });
    Sys.stats.apply(s, { mood: id === 'sportcar' || id === 'yacht' || id === 'jet' ? 30 : 5 });
    if (it.apr) s.itemVal[id] = p;
    if (it.rep) s.rep = U.clamp(s.rep + it.rep);
    Sys.log(s, 'Покупка: ' + it.name + ' (' + U.money(p) + ').');
    Sys.quests.check(s);
    SN.say(it.icon + ' Куплено: ' + it.name, 'good');
    return SN.okr(it.name);
  };
  P.sellItem = function (s, id) {
    const it = D.items[id];
    if (!s.items.includes(id)) return SN.fail('Нет такой вещи');
    const v = P.itemValue(s, id);
    s.items = s.items.filter(x => x !== id); delete s.itemVal[id];
    E().earn(s, v, 'items', 'Продажа: ' + it.name);
    Sys.log(s, 'Продано: ' + it.name + ' за ' + U.money(v) + '.');
    SN.say('Продано за ' + U.money(v), 'good');
    return SN.okr('');
  };
  P.clothPrice = (s, id) => Math.round(D.clothes[id].price * (s.flags.discountDay === T.day(s) ? 0.7 : 1) * (SN.perk(s, 'haggler') ? 0.9 : 1));
  P.buyClothes = function (s, id) {
    const c = D.clothes[id];
    if (s.clothes.includes(id)) return SN.fail('Уже есть');
    if (!c.price) return SN.fail('Эту одежду выдают в пункте помощи соццентра');
    const p = P.clothPrice(s, id);
    if (!E().pay(s, p, 'items', c.name)) return SN.fail('Нужно ещё ' + U.money(p - E().available(s)));
    s.clothes.push(id); s.wear = id;
    s.st.mood = U.clamp(s.st.mood + 6);
    Sys.quests.check(s);
    SN.say(c.icon + ' Обновка надета: ' + c.name, 'good');
    return SN.okr('');
  };
  P.wear = function (s, id) {
    if (!s.clothes.includes(id)) return SN.fail('Нет такой одежды');
    s.wear = id; return SN.okr('Надето: ' + D.clothes[id].name);
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/systems/business.js */
/* Бизнес: открытие, персонал, реклама, цены, улучшения, ежедневный расчёт прибыли/убытков */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const E = () => Sys.econ;
  const B = Sys.biz = {};

  B.make = id => ({ id, lvl: 1, staff: 0, ads: 0, price: 1, rep: 30, days: 0, plusDays: 0, total: 0, last: null, owner: false, debt: 0, opened: 0 });
  B.get = (s, id) => s.biz.find(b => b.id === id);

  B.openCheck = function (s, id) {
    const d = D.bizById[id];
    if (B.get(s, id)) return 'Уже открыто';
    const rf = E().reqFail(s, d.req); if (rf) return rf;
    if (!E().canPay(s, B.price(s, id))) return 'Нужно ' + U.money(B.price(s, id));
    return '';
  };
  B.price = (s, id) => Math.round(D.bizById[id].price * (id === 'workshop' && s.flags.valeraPartner ? 0.7 : 1));
  B.open = function (s, id) {
    const why = B.openCheck(s, id); if (why) return SN.fail(why);
    const d = D.bizById[id];
    E().pay(s, B.price(s, id), 'business', 'Открытие: ' + d.name);
    const b = B.make(id); b.opened = T.day(s); b.staff = d.staffMax > 1 ? 1 : 0;
    if (s.flags.mariaMentor) b.rep += 20;
    if (id === 'workshop' && s.flags.valeraPartner) b.rep = Math.max(b.rep, 60);
    s.biz.push(b);
    T.advance(s, 180, { indoor: true });
    s.xp += 120; s.rep = U.clamp(s.rep + 5);
    Sys.log(s, 'Открыт бизнес: ' + d.name + '.');
    Sys.quests.check(s);
    SN.emit('modal', { kind: 'info', icon: d.icon, title: 'Своё дело!', text: d.name + ' открыт(а). Наймите персонал или работайте сами — без людей точка не работает. Прибыль и расходы считаются каждую ночь.' });
    return SN.okr(d.name);
  };

  B.capacity = (b, d, withOwner) => (b.staff + (withOwner ? 1 : 0)) * d.cap * (1 + 0.4 * (b.lvl - 1));
  /* Прогноз/расчёт дня. rnd — случайный множитель; если не передан, берётся 1 (прогноз) */
  B.calc = function (s, b, rnd, season, weather) {
    const d = D.bizById[b.id];
    const repM = 0.6 + b.rep / 100 * 0.8;
    const sat = 1 / (1 + (SN.perk(s, 'tycoon') ? 0.02 : 0.04) * Math.max(0, s.biz.length - 1));
    const pl = D.PRICE_LEVELS[b.price];
    let demand = d.base * (1 + 0.4 * (b.lvl - 1)) * repM * D.ADS_MULT[b.ads] * pl.demand * (d.season[season] || 1) * sat * (rnd == null ? 1 : rnd) * (SN.perk(s, 'marketer') ? 1.08 : 1);
    if (['rain', 'snow', 'storm'].includes(weather)) demand *= d.rain;
    const cap = B.capacity(b, d, b.owner);
    const cust = Math.floor(Math.min(demand, cap));
    const rev = cust * d.check * pl.rev * s.prices;
    const cogs = cust * d.check * d.cogs * s.prices;
    const wages = b.staff * d.wage * (SN.perk(s, 'manager') ? 0.9 : 1);
    const ads = b.ads * d.ads;
    const rent = d.rent * (1 + 0.3 * (b.lvl - 1));
    const tax = rev * D.TAX;
    const profit = rev - cogs - wages - ads - rent - tax;
    return { demand: Math.round(demand), cap: Math.round(cap), cust, rev: Math.round(rev), cogs: Math.round(cogs), wages, ads, rent: Math.round(rent), tax: Math.round(tax), profit: Math.round(profit) };
  };
  B.forecast = (s, b) => B.calc(s, b, null, T.season(s), s.weather ? s.weather.kind : 'clear');

  B.daily = function (s, rep) {
    const season = T.season(s), wk = s.weather ? s.weather.kind : 'clear';
    for (const b of s.biz) {
      const d = D.bizById[b.id];
      const r = B.calc(s, b, 0.85 + U.rand(s) * 0.3, season, wk);
      b.days++; b.last = r; b.total += r.profit;
      if (r.profit > 0) { b.plusDays++; s.c.bizProfitDays++; }
      // Репутация точки: довольные клиенты растят, очереди и высокие цены — снижают
      if (r.cust === 0) b.rep -= 2;
      else if (r.demand > r.cap * 1.25) b.rep -= 1;
      else b.rep += b.price === 2 ? 0.2 : b.price === 0 ? 1.2 : 0.7;
      b.rep = U.clamp(b.rep);
      if (r.profit >= 0) {
        const toDebt = Math.min(b.debt, r.profit); b.debt -= toDebt;
        E().earn(s, r.profit - toDebt, 'business', d.name, true);
      } else {
        const need = -r.profit, paid = Math.min(need, Math.max(0, E().available(s)));
        if (paid > 0) E().pay(s, paid, 'business', 'Убыток: ' + d.name);
        if (need > paid) { b.debt += need - paid; rep.lines.push('⚠️ ' + d.name + ': долг перед поставщиками ' + U.money(b.debt) + '.'); }
      }
      rep.biz.push({ name: d.name, icon: d.icon, ...r, closed: r.cust === 0 });
      if (r.cust === 0) rep.lines.push(d.icon + ' ' + d.name + ' простаивает: нет персонала. Наймите сотрудника или выйдите на смену.');
      b.owner = false;
    }
  };

  B.set = function (s, id, key, val) {
    const b = B.get(s, id), d = D.bizById[id];
    if (!b) return SN.fail('Нет бизнеса');
    if (key === 'staff') b.staff = U.clamp(val, 0, d.staffMax);
    if (key === 'ads') b.ads = U.clamp(val, 0, 2);
    if (key === 'price') b.price = U.clamp(val, 0, 2);
    return SN.okr('');
  };
  B.upgradeCost = (b, d, s) => Math.round(d.price * 0.5 * b.lvl * (s && SN.perk(s, 'tycoon') ? 0.75 : 1));
  B.upgrade = function (s, id) {
    const b = B.get(s, id), d = D.bizById[id];
    if (b.lvl >= 3) return SN.fail('Максимальный уровень');
    const c = B.upgradeCost(b, d, s);
    if (!E().pay(s, c, 'business', 'Расширение: ' + d.name)) return SN.fail('Нужно ' + U.money(c));
    b.lvl++; s.xp += 80;
    Sys.quests.check(s);
    SN.say(d.icon + ' Расширение до уровня ' + b.lvl, 'good');
    return SN.okr('');
  };
  /* Владелец сам выходит на смену: точка работает даже без персонала, экономия на зарплате */
  B.work = function (s, id) {
    const b = B.get(s, id), d = D.bizById[id];
    if (b.owner) return SN.fail('Вы уже отработали сегодня');
    if (s.st.energy < 25) return SN.fail('Мало энергии');
    if (s.district !== d.district) { const r = Sys.city.travel(s, d.district); if (!r.ok) return r; }
    s.st.energy = U.clamp(s.st.energy - 20);
    T.advance(s, 8 * 60, { indoor: b.id !== 'drinks' });
    b.owner = true; b.rep = U.clamp(b.rep + 1);
    Sys.stats.gain(s, { trade: 1.2, social: 0.4 });
    s.xp += 40;
    SN.say(d.icon + ' Вы отработали смену в своём деле. Сегодня точка работает с вами.', 'good');
    return SN.okr('');
  };
  B.sell = function (s, id) {
    const b = B.get(s, id), d = D.bizById[id];
    const v = Math.round((d.price + (b.lvl - 1) * d.price * 0.5) * 0.6 * (0.7 + b.rep / 100 * 0.6)) - b.debt;
    s.biz = s.biz.filter(x => x !== b);
    E().earn(s, Math.max(0, v), 'business', 'Продажа: ' + d.name);
    Sys.log(s, 'Бизнес продан: ' + d.name + ' за ' + U.money(Math.max(0, v)) + '.');
    return SN.okr('Продано за ' + U.money(Math.max(0, v)));
  };
  B.sellValue = (s, b) => { const d = D.bizById[b.id]; return Math.max(0, Math.round((d.price + (b.lvl - 1) * d.price * 0.5) * 0.6 * (0.7 + b.rep / 100 * 0.6)) - b.debt); };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/systems/finance.js */
/* Финансы: счёт и карта, вклад, кредит, инвестиции, история операций */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const E = () => Sys.econ;
  const F = Sys.fin = {};
  F.DEP_RATE = 0.0004;      // 0,04% в день ≈ 15,7% годовых
  F.LOAN_RATE = 0.0008;     // 0,08% в день ≈ 34% годовых (снижается навыком «Финансы»)
  F.LOAN_TERM = 60;
  F.FUNDS = {
    index:  { name: 'Индексный фонд', icon: '📈', mu: 0.0005, sigma: 0.012, risk: 'Средний риск. Может падать на 10–20% за месяц, но в долгую обычно растёт.' },
    crypto: { name: 'Криптовалюта', icon: '🪙', mu: 0.0002, sigma: 0.06, risk: 'Очень высокий риск: за неделю можно потерять половину вложенного.' }
  };

  F.openAccount = function (s) {
    if (s.account) return SN.fail('Счёт уже открыт');
    if (!s.docs.passport) return SN.fail('Для открытия счёта нужен паспорт');
    if (s.district !== 'business') { const r = Sys.city.travel(s, 'business'); if (!r.ok) return r; }
    if (!T.isOpen(s, [9, 20], 1)) return SN.fail('Банк работает с 09:00 до 20:00');
    T.advance(s, 60, { indoor: true });
    s.account = true;
    if (s.bank > 0) Sys.log(s, 'Остаток прежнего счёта переведён.');
    Sys.log(s, 'Открыт банковский счёт с картой.');
    Sys.quests.check(s);
    SN.say('🏦 Счёт открыт. Зарплата будет приходить на карту, картой можно платить везде.', 'good');
    return SN.okr('');
  };
  F.toBank = function (s, amt) {
    if (!s.account) return SN.fail('Нет счёта');
    amt = Math.min(Math.floor(amt), s.money);
    if (amt <= 0) return SN.fail('Нет наличных');
    s.money -= amt; s.bank += amt; E().ledger(s, 0, 'bank', 'Внесено на счёт ' + U.money(amt));
    Sys.quests.check(s);
    return SN.okr('Внесено ' + U.money(amt));
  };
  F.toCash = function (s, amt) {
    if (!s.account) return SN.fail('Нет счёта');
    amt = Math.min(Math.floor(amt), s.bank);
    if (amt <= 0) return SN.fail('На счёте пусто');
    s.bank -= amt; s.money += amt; E().ledger(s, 0, 'bank', 'Снято со счёта ' + U.money(amt));
    return SN.okr('Снято ' + U.money(amt));
  };
  F.depositPut = function (s, amt) {
    amt = Math.min(Math.floor(amt), s.bank);
    if (!s.account || amt <= 0) return SN.fail('Пополнить вклад можно со счёта');
    s.bank -= amt; s.fin.deposit += amt;
    Sys.quests.check(s);
    return SN.okr('На вклад: ' + U.money(amt));
  };
  F.depositTake = function (s, amt) {
    amt = Math.min(Math.floor(amt), Math.floor(s.fin.deposit));
    if (amt <= 0) return SN.fail('Вклад пуст');
    s.fin.deposit -= amt; s.bank += amt;
    return SN.okr('Со вклада: ' + U.money(amt));
  };
  F.loanRate = s => F.LOAN_RATE * (1 - s.sk.finance / 200) * (Sys.inv ? Sys.inv.scoreMult(s) : 1) * (SN.perk(s, 'banker') ? 0.85 : 1);
  F.avgIncome = s => { const d = s.days.slice(0, 7); return d.length ? d.reduce((a, x) => a + x.inc, 0) / d.length : 0; };
  F.loanLimit = function (s) {
    if (!s.account || !s.docs.passport) return 0;
    if (!s.job && !s.biz.length) return 0;
    if (s.rep < 15 || s.fin.loan > 0) return 0;
    const sc = Sys.inv ? Sys.inv.score(s) : 600;
    if (sc < 500) return 0;
    return Math.max(0, Math.floor(Math.min(s.rep * 4000 * sc / 600, F.avgIncome(s) * 20 * sc / 600 + (s.job ? 10000 : 0)) / 1000) * 1000);
  };
  F.loanWhy = function (s) {
    if (!s.account) return 'Нужен банковский счёт';
    if (!s.job && !s.biz.length) return 'Нужен официальный доход: работа или бизнес';
    if (s.rep < 15) return 'Нужна репутация 15';
    if (s.fin.loan > 0) return 'Сначала погасите текущий кредит';
    return '';
  };
  F.takeLoan = function (s, amt) {
    const lim = F.loanLimit(s);
    amt = Math.floor(amt);
    if (amt <= 0 || amt > lim) return SN.fail('Доступный лимит: ' + U.money(lim));
    s.fin.loan = amt; s.fin.loanStart = T.day(s); s.fin.loanDue = T.day(s) + F.LOAN_TERM;
    s.bank += amt;
    E().ledger(s, amt, 'loan', 'Кредит получен');
    Sys.log(s, 'Взят кредит ' + U.money(amt) + ' на ' + F.LOAN_TERM + ' дней.');
    return SN.okr('Кредит зачислен на счёт');
  };
  F.repay = function (s, amt) {
    amt = Math.min(Math.ceil(amt), Math.ceil(s.fin.loan));
    if (amt <= 0) return SN.fail('Нет долга');
    if (!E().pay(s, amt, 'loan', 'Погашение кредита')) return SN.fail('Не хватает денег');
    s.fin.loan = Math.max(0, s.fin.loan - amt);
    if (s.fin.loan < 1) { s.fin.loan = 0; s.flags.loanRepaid = true; s.rep = U.clamp(s.rep + 4); Sys.log(s, 'Кредит полностью погашен.'); }
    Sys.quests.check(s);
    return SN.okr('Погашено ' + U.money(amt));
  };
  F.buyFund = function (s, id, amt) {
    amt = Math.min(Math.floor(amt), s.bank);
    if (!s.account || amt <= 0) return SN.fail('Покупка фондов — со счёта в банке');
    s.bank -= amt; s.fin.funds[id] = (s.fin.funds[id] || 0) + amt;
    E().ledger(s, 0, 'invest', 'Куплено: ' + F.FUNDS[id].name + ' на ' + U.money(amt));
    Sys.quests.check(s);
    return SN.okr('Инвестировано ' + U.money(amt));
  };
  F.sellFund = function (s, id) {
    const v = Math.floor(s.fin.funds[id] || 0);
    if (v <= 0) return SN.fail('Нет вложений');
    s.fin.funds[id] = 0; s.bank += v;
    E().ledger(s, 0, 'invest', 'Продано: ' + F.FUNDS[id].name + ' на ' + U.money(v));
    return SN.okr('Продано на ' + U.money(v));
  };

  F.daily = function (s, rep) {
    const f = s.fin;
    if (f.deposit > 0) { const i = f.deposit * F.DEP_RATE * (SN.perk(s, 'banker') ? 1.2 : 1); f.deposit += i; f.depIncome = (f.depIncome || 0) + i; }
    if (f.loan > 0) {
      const overdue = T.day(s) > f.loanDue;
      f.loan += f.loan * (overdue ? 0.002 : F.loanRate(s));
      if (overdue) {
        s.rep = U.clamp(s.rep - 1); s.st.stress = U.clamp(s.st.stress + 4); f.badPays = (f.badPays || 0) + 1;
        rep.lines.push('⚠️ Кредит просрочен: ' + U.money(f.loan) + '. Пени растут, репутация падает.');
      } else if (f.loanDue - T.day(s) === 7) rep.lines.push('До погашения кредита 7 дней. Остаток ' + U.money(f.loan) + '.');
    }
    for (const id in F.FUNDS) {
      if (f.funds[id] > 0) {
        const fd = F.FUNDS[id];
        const ch = Math.max(-0.35, fd.mu + U.gauss(s) * fd.sigma);
        f.funds[id] = Math.max(0, f.funds[id] * (1 + ch));
      }
    }
    f.history.unshift({ d: T.day(s) - 1, cash: s.money, bank: s.bank + f.deposit });
    f.history = f.history.slice(0, 30);
  };
  const f2 = s => s.fin;
  F.netWorth = function (s) {
    let w = s.money + s.bank + s.fin.deposit + (s.fin.funds.index || 0) + (s.fin.funds.crypto || 0) - s.fin.loan;
    s.items.forEach(i => w += Sys.prop.itemValue(s, i));
    const h = D.housing[s.housing];
    if (h.type === 'own') w += h.price * 0.85; else w += s.deposit;
    s.biz.forEach(b => w += Sys.biz.sellValue(s, b));
    if (Sys.inv) {
      w += Sys.inv.passiveValue(s) + Sys.inv.portfolioValue(s) + (f2(s).gold || 0) * (Sys.inv.mkt(s).gold || 0) * 0.97;
      f2(s).bonds.forEach(b => w += b.amt); f2(s).terms.forEach(t => w += t.amt + t.acc);
      f2(s).mort.forEach(m => w -= m.left);
    }
    return Math.round(w);
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/systems/invest.js */
/* Капитал: доходные активы, биржа, облигации, золото, срочные вклады, кредитный рейтинг, ипотека,
   страхование, кешбэк, копилка, рейтинг богачей */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const E = () => Sys.econ;
  const I = Sys.inv = {};
  const P = (s, id) => SN.perk(s, id);
  I.TAX = 0.13;

  // ─────────── Кредитный рейтинг 300–850
  I.score = function (s) {
    const f = s.fin, nw = Sys.fin.netWorth(s);
    let sc = 420 + Math.min(150, s.rep * 1.5) + (s.account ? 40 : 0) + (s.job ? 40 : 0) + (s.biz.length ? 25 : 0)
      + Math.min(140, (f.goodPays || 0) * 1.5) - (f.badPays || 0) * 12 + (s.flags.loanRepaid ? 40 : 0) + (s.flags.mortRepaid ? 40 : 0)
      + (nw > 1e6 ? 40 : nw > 1e5 ? 20 : 0) - (f.loan > 0 && T.day(s) > f.loanDue ? 80 : 0);
    return Math.round(U.clamp(sc, 300, 850));
  };
  I.scoreLabel = sc => sc >= 750 ? 'Отличный' : sc >= 650 ? 'Хороший' : sc >= 550 ? 'Средний' : 'Низкий';
  I.scoreMult = s => { const sc = I.score(s); return sc >= 750 ? 0.75 : sc >= 650 ? 0.9 : sc >= 550 ? 1 : 1.3; };

  // ─────────── Доходные активы
  I.units = (s, id) => s.passive.filter(p => p.id === id);
  I.check = function (s, id) {
    const d = D.passiveById[id];
    if (I.units(s, id).length >= d.max) return 'Максимум ' + d.max + ' шт.';
    return E().reqFail(s, d.req);
  };
  I.newUnit = (s, id, price) => ({ uid: (s.flags.uid = (s.flags.uid || 0) + 1), id, value: price, vac: D.passiveById[id].rent ? 2 : 0, q: 1, buy: T.day(s), earned: 0 });
  I.buy = function (s, id, mortgage) {
    const d = D.passiveById[id];
    const why = I.check(s, id); if (why) return SN.fail(why);
    if (mortgage) {
      const q = I.mortQuote(s, d.price); if (q.why) return SN.fail(q.why);
      const u = I.newUnit(s, id, d.price);
      if (!E().pay(s, q.down, 'passive', 'Первый взнос: ' + d.name)) return SN.fail('Нужно ' + U.money(q.down) + ' на первый взнос');
      s.passive.push(u); I.addMort(s, q, 'passive', u.uid, d.name);
    } else {
      if (!E().pay(s, d.price, 'passive', 'Покупка: ' + d.name)) return SN.fail('Нужно ' + U.money(d.price));
      s.passive.push(I.newUnit(s, id, d.price));
    }
    T.advance(s, 60, { indoor: true });
    s.xp += 40;
    Sys.log(s, 'Куплен доходный актив: ' + d.name + (mortgage ? ' (ипотека)' : '') + '.');
    Sys.quests.check(s);
    SN.say(d.icon + ' ' + d.name + ' — теперь ваш. ' + (d.rent ? 'Ищем арендатора.' : 'Доход пойдёт с завтрашнего дня.'), 'good');
    return SN.okr('');
  };
  I.sellValue = (s, u) => { const d = D.passiveById[u.id]; return Math.round(u.value * (d.cat === 'realty' ? 0.92 : 0.6)); };
  I.sell = function (s, uid) {
    const u = s.passive.find(x => x.uid === uid); if (!u) return SN.fail('Нет актива');
    const d = D.passiveById[u.id];
    let v = I.sellValue(s, u);
    const m = s.fin.mort.find(x => x.kind === 'passive' && x.ref === uid);
    if (m) { v -= Math.ceil(m.left); s.fin.mort = s.fin.mort.filter(x => x !== m); }
    s.passive = s.passive.filter(x => x !== u);
    if (v > 0) E().earn(s, v, 'passive', 'Продажа: ' + d.name); else if (v < 0) E().pay(s, -v, 'loan', 'Остаток ипотеки');
    Sys.log(s, 'Продан актив: ' + d.name + '.');
    return SN.okr('Продано' + (m ? ', ипотека закрыта' : '') + '. Получено ' + U.money(Math.max(0, v)));
  };
  I.refresh = function (s, uid) {
    const u = s.passive.find(x => x.uid === uid); if (!u) return SN.fail('Нет актива');
    if (s.st.energy < 15) return SN.fail('Мало энергии');
    s.st.energy = U.clamp(s.st.energy - 12);
    T.advance(s, 180, { indoor: true });
    u.q = 1; Sys.stats.gain(s, { tech: 0.6, marketing: 0.6 });
    SN.say('Контент обновлён: доход снова 100%.', 'good');
    return SN.okr('');
  };
  I.unitIncome = function (s, u, season) {
    const d = D.passiveById[u.id];
    if (u.vac > 0) return { inc: 0, up: d.up };
    const inc = d.inc * (u.q || 1) * (d.seasonal ? d.seasonal[season] : 1) * (s.fin.agency && d.rent ? 0.9 : 1);
    return { inc, up: d.up * (P(s, 'landlord') && d.cat === 'realty' ? 0.85 : 1) };
  };
  I.netOf = (inc, up) => { const pre = inc - up; return pre > 0 ? pre * (1 - I.TAX) : pre; };
  I.passivePerDay = function (s) {
    const season = T.season(s);
    let sum = 0;
    for (const u of s.passive || []) { const r = I.unitIncome(s, Object.assign({}, u, { vac: 0 }), season); sum += I.netOf(r.inc, r.up); }
    return Math.round(sum);
  };
  I.passiveValue = s => (s.passive || []).reduce((a, u) => a + I.sellValue(s, u), 0);
  I.passiveDaily = function (s, rep) {
    const season = T.season(s);
    let total = 0;
    for (const u of s.passive) {
      const d = D.passiveById[u.id];
      if (u.vac > 0) { u.vac--; if (u.vac === 0 && d.rent) rep.lines.push(d.icon + ' ' + d.name + ': найден арендатор.'); }
      const r = I.unitIncome(s, u, season);
      const inc = r.inc * (0.9 + U.rand(s) * 0.2) * (d.id === 'photobooth' && T.weekend(s) ? 1.5 : 1);
      const net = I.netOf(inc, r.up);
      total += net; u.earned = (u.earned || 0) + net;
      if (d.rent && !u.vac && U.chance(s, 0.012 * (P(s, 'landlord') ? 0.5 : 1))) {
        u.vac = s.fin.agency ? 1 + Math.floor(U.rand(s) * 2) : 3 + Math.floor(U.rand(s) * 7);
        rep.lines.push(d.icon + ' ' + d.name + ': арендатор съехал, поиск нового ~' + u.vac + ' дн.' + (s.fin.agency ? ' (агентство)' : ''));
      }
      if (d.cat !== 'online' && U.chance(s, 0.005)) {
        const cost = Math.round(d.price * 0.008 / 100) * 100;
        if (s.fin.ins.property) rep.lines.push(d.icon + ' ' + d.name + ': поломка на ' + U.money(cost) + ' — покрыта страховкой.');
        else { total -= cost; rep.lines.push(d.icon + ' ' + d.name + ': ремонт ' + U.money(cost) + '.'); }
      }
      if (d.decay) u.q = Math.max(0.3, (u.q || 1) * 0.994);
      if (d.cat === 'realty') u.value *= 1 + 0.0002 + U.gauss(s) * 0.003;
      else if (d.cat === 'machine' || d.cat === 'energy') u.value *= 0.9993;
    }
    if (total > 0) E().earn(s, total, 'passive', 'Пассивный доход', true);
    else if (total < 0) { const need = -total; E().pay(s, Math.min(need, Math.max(0, E().available(s))), 'passive', 'Расходы на активы'); }
    s.c.passive = (s.c.passive || 0) + Math.max(0, total);
    rep.passive = Math.round(total);
  };

  // ─────────── Биржа
  I.mkt = function (s) {
    const m = s.fin.mkt;
    if (!m.p || !Object.keys(m.p).length) { m.p = {}; m.h = {}; D.stocks.forEach(x => { m.p[x.id] = x.price; m.h[x.id] = [x.price]; }); }
    if (!m.gold) { m.gold = 6800; m.gh = [6800]; }
    return m;
  };
  I.price = (s, id) => I.mkt(s).p[id];
  I.fee = s => P(s, 'investor') ? 0 : 0.003;
  I.openBroker = function (s) {
    if (!s.account) return SN.fail('Сначала откройте банковский счёт');
    s.fin.broker = true; Sys.log(s, 'Открыт брокерский счёт.');
    SN.say('📈 Брокерский счёт открыт. Покупки — со счёта в банке.', 'good');
    return SN.okr('');
  };
  I.buyStock = function (s, id, amt) {
    if (!s.fin.broker) return SN.fail('Нужен брокерский счёт');
    const p = I.price(s, id), fee = I.fee(s);
    const q = Math.floor(Math.min(amt, s.bank) / (p * (1 + fee)));
    if (q < 1) return SN.fail('Недостаточно средств на счёте для 1 акции (' + U.money(p) + ')');
    const cost = q * p, f = cost * fee;
    s.bank -= cost + f;
    const pos = s.fin.port[id] || (s.fin.port[id] = { q: 0, cost: 0 });
    pos.q += q; pos.cost += cost + f;
    E().ledger(s, 0, 'invest', 'Куплено ' + q + ' шт. ' + id + ' на ' + U.money(cost));
    Sys.quests.check(s);
    return SN.okr('Куплено ' + q + ' шт. ' + D.stockById[id].name);
  };
  I.sellStock = function (s, id, frac) {
    const pos = s.fin.port[id]; if (!pos || pos.q < 1) return SN.fail('Нет акций');
    const q = Math.max(1, Math.round(pos.q * frac)), p = I.price(s, id);
    const gross = q * p, fee = gross * I.fee(s), basis = pos.cost * q / pos.q;
    const profit = gross - fee - basis, tax = profit > 0 ? profit * I.TAX : 0;
    pos.cost -= basis; pos.q -= q; if (pos.q <= 0) delete s.fin.port[id];
    s.bank += gross - fee - tax;
    E().ledger(s, Math.round(profit - tax), 'invest', 'Продано ' + q + ' шт. ' + id + (tax ? ', налог ' + U.money(tax) : ''));
    return SN.okr('Продано на ' + U.money(gross - fee - tax) + (profit >= 0 ? ' (прибыль ' : ' (убыток ') + U.money(Math.abs(profit)) + ')');
  };
  I.portfolioValue = s => Object.entries(s.fin.port || {}).reduce((a, [id, p]) => a + p.q * (I.mkt(s).p[id] || 0), 0);
  I.portfolioCost = s => Object.values(s.fin.port || {}).reduce((a, p) => a + p.cost, 0);
  I.buyGold = function (s, amt) {
    if (!s.account) return SN.fail('Нужен счёт в банке');
    amt = Math.min(Math.floor(amt), s.bank); if (amt < 1000) return SN.fail('Минимум 1 000 ₽');
    const g = amt / (I.mkt(s).gold * 1.03); s.bank -= amt; s.fin.gold += g;
    E().ledger(s, 0, 'invest', 'Куплено золото ' + g.toFixed(1) + ' г');
    return SN.okr('Куплено ' + g.toFixed(1).replace('.', ',') + ' г золота');
  };
  I.sellGold = function (s) {
    if (s.fin.gold <= 0) return SN.fail('Нет золота');
    const v = s.fin.gold * I.mkt(s).gold * 0.97; s.fin.gold = 0; s.bank += v;
    E().ledger(s, 0, 'invest', 'Продано золото на ' + U.money(v));
    return SN.okr('Продано на ' + U.money(v));
  };
  I.BOND = { rate: 0.00035, days: 90, name: 'Облигации федерального займа (ОФЗ)' };
  I.buyBond = function (s, amt) {
    if (!s.fin.broker) return SN.fail('Нужен брокерский счёт');
    amt = Math.min(Math.floor(amt), s.bank); if (amt < 1000) return SN.fail('Минимум 1 000 ₽');
    s.bank -= amt; s.fin.bonds.push({ amt, end: T.day(s) + I.BOND.days, rate: I.BOND.rate });
    E().ledger(s, 0, 'invest', 'Куплены ОФЗ на ' + U.money(amt));
    return SN.okr('Куплено облигаций на ' + U.money(amt));
  };
  I.sellBond = function (s, i) {
    const b = s.fin.bonds[i]; if (!b) return SN.fail('Нет облигаций');
    s.fin.bonds.splice(i, 1); s.bank += b.amt * 0.985;
    return SN.okr('Продано досрочно за ' + U.money(b.amt * 0.985));
  };
  I.marketDaily = function (s, rep) {
    const m = I.mkt(s);
    const g = 0.0002 + U.gauss(s) * 0.007;
    let shock = null;
    if (U.chance(s, 0.09)) {
      const st = U.pick(s, D.stocks), up = U.chance(s, 0.55);
      shock = { sector: st.sector, mag: (up ? 1 : -1) * (0.04 + U.rand(s) * 0.1) };
      const txt = '📰 ' + D.sectorNews[st.sector][up ? 0 : 1] + ' (' + st.name + ' ' + (up ? '+' : '') + Math.round(shock.mag * 100) + '%)';
      s.fin.news.unshift({ d: T.day(s), t: txt }); s.fin.news = s.fin.news.slice(0, 12);
      if (s.fin.port[st.id]) rep.lines.push(txt);
    }
    for (const st of D.stocks) {
      let r = st.mu + st.beta * g + st.sigma * U.gauss(s) + (shock && shock.sector === st.sector ? shock.mag : 0);
      r = U.clamp(r, -0.25, 0.25);
      m.p[st.id] = Math.max(0.01, m.p[st.id] * (1 + r));
      const h = m.h[st.id] || (m.h[st.id] = []); h.push(+m.p[st.id].toPrecision(6)); if (h.length > 40) h.shift();
    }
    m.gold *= 1 + 0.0002 + U.gauss(s) * 0.006; m.gh.push(Math.round(m.gold)); if (m.gh.length > 40) m.gh.shift();
    // Дивиденды раз в 30 дней
    if (T.day(s) % 30 === 0) {
      let div = 0;
      for (const [id, pos] of Object.entries(s.fin.port)) { const st = D.stockById[id]; if (st && st.div) div += pos.q * m.p[id] * st.div / 12; }
      div *= (P(s, 'investor') ? 1.1 : 1) * (1 - I.TAX);
      if (div > 1) { E().earn(s, div, 'invest', 'Дивиденды', true); rep.lines.push('💰 Дивиденды по акциям: ' + U.money(div) + ' (после налога).'); }
    }
    // Облигации: купон ежедневно, погашение
    let coupon = 0;
    s.fin.bonds = s.fin.bonds.filter(b => {
      coupon += b.amt * b.rate;
      if (T.day(s) >= b.end) { s.bank += b.amt; rep.lines.push('ОФЗ погашены: ' + U.money(b.amt) + ' вернулись на счёт.'); return false; }
      return true;
    });
    if (coupon > 0) E().earn(s, coupon * (1 - I.TAX), 'invest', 'Купоны ОФЗ', true);
  };

  // ─────────── Срочные вклады
  I.TERMS = [{ days: 30, rate: 0.0005 }, { days: 90, rate: 0.0006 }, { days: 180, rate: 0.0007 }];
  I.termRate = (s, k) => I.TERMS[k].rate * (P(s, 'banker') ? 1.2 : 1);
  I.openTerm = function (s, k, amt) {
    amt = Math.min(Math.floor(amt), s.bank); if (amt < 5000) return SN.fail('Минимум 5 000 ₽ со счёта');
    s.bank -= amt; s.fin.terms.push({ amt, acc: 0, rate: I.termRate(s, k), end: T.day(s) + I.TERMS[k].days, days: I.TERMS[k].days });
    E().ledger(s, 0, 'bank', 'Открыт вклад на ' + I.TERMS[k].days + ' дн.: ' + U.money(amt));
    return SN.okr('Вклад открыт');
  };
  I.closeTerm = function (s, i) {
    const t = s.fin.terms[i]; if (!t) return SN.fail('Нет вклада');
    s.fin.terms.splice(i, 1); s.bank += t.amt;
    return SN.okr('Вклад закрыт досрочно: проценты сгорели, возвращено ' + U.money(t.amt));
  };
  I.termsDaily = function (s, rep) {
    s.fin.terms = s.fin.terms.filter(t => {
      t.acc += (t.amt + t.acc) * t.rate;
      if (T.day(s) >= t.end) { const v = t.amt + t.acc; s.bank += v; s.today.inc += t.acc; E().ledger(s, t.acc, 'bank', 'Проценты по вкладу'); rep.lines.push('🐷 Вклад на ' + t.days + ' дн. закрыт: +' + U.money(t.acc) + ' процентов.'); return false; }
      return true;
    });
  };

  // ─────────── Ипотека
  I.MORT_DAYS = 720;
  I.annuity = (L, r, n) => L * r / (1 - Math.pow(1 + r, -n));
  I.mortQuote = function (s, price) {
    const rate = 0.00025 * I.scoreMult(s) * (P(s, 'banker') ? 0.85 : 1);
    const down = Math.ceil(price * 0.2), loan = price - down;
    const pay = Math.ceil(I.annuity(loan, rate, I.MORT_DAYS));
    const q = { down, loan, pay, rate, days: I.MORT_DAYS, why: '' };
    const sc = I.score(s);
    if (!s.account) q.why = 'Нужен банковский счёт';
    else if (sc < 560) q.why = 'Кредитный рейтинг ' + sc + ' — нужно 560+';
    else if (!s.job && !s.biz.length && !s.passive.length) q.why = 'Нужен подтверждённый доход';
    else {
      const inc = Math.max(Sys.fin.avgIncome(s), I.passivePerDay(s)), busy = s.fin.mort.reduce((a, m) => a + m.pay, 0);
      if (pay + busy > inc * 0.6) q.why = 'Платёж ' + U.money(pay) + '/день больше 60% дохода (' + U.money(inc) + '/день)';
    }
    return q;
  };
  I.addMort = function (s, q, kind, ref, name) {
    s.fin.mort.push({ kind, ref, name, left: q.loan, pay: q.pay, rate: q.rate, missed: 0, start: T.day(s) });
    E().ledger(s, q.loan, 'loan', 'Ипотека: ' + name);
  };
  I.mortRepay = function (s, i, amt) {
    const m = s.fin.mort[i]; if (!m) return SN.fail('Нет ипотеки');
    amt = Math.min(Math.ceil(amt), Math.ceil(m.left));
    if (!E().pay(s, amt, 'loan', 'Досрочное погашение ипотеки')) return SN.fail('Не хватает денег');
    m.left -= amt;
    if (m.left < 1) { s.fin.mort.splice(i, 1); s.flags.mortRepaid = true; Sys.log(s, 'Ипотека погашена: ' + m.name + '.'); Sys.quests.check(s); return SN.okr('Ипотека полностью погашена!'); }
    m.pay = Math.ceil(I.annuity(m.left, m.rate, Math.max(10, I.MORT_DAYS - (T.day(s) - m.start))));
    return SN.okr('Погашено ' + U.money(amt) + '. Новый платёж ' + U.money(m.pay) + '/день');
  };
  I.mortDaily = function (s, rep) {
    for (const m of s.fin.mort.slice()) {
      const interest = m.left * m.rate;
      if (E().pay(s, m.pay, 'loan', 'Платёж по ипотеке')) {
        m.left -= m.pay - interest; m.missed = 0; s.fin.goodPays = (s.fin.goodPays || 0) + 1;
        if (m.left <= 1) { s.fin.mort = s.fin.mort.filter(x => x !== m); s.flags.mortRepaid = true; rep.lines.push('🏦 Ипотека погашена: ' + m.name + '!'); }
      } else {
        m.missed++; s.fin.badPays = (s.fin.badPays || 0) + 1; m.left += interest + m.pay * 0.02;
        rep.lines.push('⚠️ Не хватило на платёж по ипотеке (' + U.money(m.pay) + '). Просрочка ' + m.missed + '/14 дн.');
        if (m.missed >= 14) I.seize(s, m, rep);
      }
    }
  };
  I.seize = function (s, m, rep) {
    let sale = 0;
    if (m.kind === 'passive') { const u = s.passive.find(x => x.uid === m.ref); if (u) { sale = u.value * 0.7; s.passive = s.passive.filter(x => x !== u); } }
    else if (m.kind === 'home' && s.housing === m.ref) { sale = D.housing[m.ref].price * 0.7; s.housing = 'street'; s.rentPaid = 0; }
    s.fin.mort = s.fin.mort.filter(x => x !== m);
    const rest = sale - m.left;
    if (rest > 0) E().earn(s, rest, 'loan', 'Остаток после продажи залога');
    s.rep = U.clamp(s.rep - 10);
    rep.lines.push('🏦 Банк забрал залог «' + m.name + '» за долги и продал его. ' + (rest > 0 ? 'Вам вернули ' + U.money(rest) + '.' : 'Денег от продажи едва хватило на долг.'));
  };

  // ─────────── Страхование, карты, копилка
  I.INS = { health: { name: 'ДМС — медицинская страховка', icon: '🩺', fee: () => 1800, desc: 'Платная клиника бесплатно, болезни проходят быстрее.' },
    property: { name: 'Страхование имущества', icon: '🛡️', fee: s => Math.max(500, Math.round((I.passiveValue(s) + (D.housing[s.housing].type === 'own' ? D.housing[s.housing].price : 0)) * 0.0003)), desc: 'Ремонты, поломки и порча арендаторами — за счёт страховой.' } };
  I.CARDS = { basic: { name: 'Дебетовая карта', cb: 0.005, fee: 0 }, premium: { name: 'Премиальная карта', cb: 0.02, fee: 1500, score: 650 } };
  I.setCard = function (s, k) {
    if (k === 'premium' && I.score(s) < 650) return SN.fail('Нужен кредитный рейтинг 650');
    s.fin.card = k; return SN.okr('Карта: ' + I.CARDS[k].name);
  };
  I.toggleIns = function (s, k) {
    if (!s.account) return SN.fail('Нужен банковский счёт');
    s.fin.ins[k] = !s.fin.ins[k];
    if (s.fin.ins[k] && !E().pay(s, I.INS[k].fee(s), 'bank', 'Страховка: ' + I.INS[k].name)) { s.fin.ins[k] = false; return SN.fail('Не хватает на первый взнос'); }
    return SN.okr(s.fin.ins[k] ? 'Страховка оформлена (списание раз в неделю)' : 'Страховка отключена');
  };
  I.cashbackOn = (s, amt, cat) => { if (s.account && !['housing', 'loan', 'business', 'invest', 'bank', 'passive', 'gift'].includes(cat)) s.fin.cb = (s.fin.cb || 0) + amt * I.CARDS[s.fin.card || 'basic'].cb; };
  I.autosaveOn = function (s, amt, cat, toBank) {
    const pct = s.fin.autosave || 0;
    if (!pct || !s.account || !['work', 'business', 'passive'].includes(cat)) return;
    const x = Math.floor(amt * pct / 100);
    if (toBank && s.account) { const y = Math.min(x, s.bank); s.bank -= y; s.fin.deposit += y; }
    else { const y = Math.min(x, s.money); s.money -= y; s.fin.deposit += y; }
  };
  I.serviceDaily = function (s, rep) {
    if (s.fin.cb >= 1) { s.bank += s.fin.cb; s.today.inc += s.fin.cb; E().ledger(s, s.fin.cb, 'bank', 'Кешбэк'); s.fin.cb = 0; }
    if (T.day(s) % 7 !== 0) return;
    for (const k in I.INS) if (s.fin.ins[k] && !E().pay(s, I.INS[k].fee(s), 'bank', 'Страховка: ' + I.INS[k].name)) { s.fin.ins[k] = false; rep.lines.push('Страховка «' + I.INS[k].name + '» отключена: не хватило на взнос.'); }
    const c = I.CARDS[s.fin.card || 'basic'];
    if (c.fee && !E().pay(s, c.fee, 'bank', 'Обслуживание премиальной карты')) s.fin.card = 'basic';
  };

  // ─────────── Рейтинг богачей
  I.richList = function (s) {
    const d = T.day(s);
    const list = D.rich.map(r => ({ name: r.name, icon: r.icon, what: r.what, w: r.w * Math.pow(1 + r.g, d) }));
    list.push({ name: s.hero.name + ' (вы)', icon: '⭐', what: 'начинал с нуля', w: Sys.fin.netWorth(s), me: true });
    return list.sort((a, b) => b.w - a.w);
  };
  I.richRank = s => I.richList(s).findIndex(x => x.me) + 1;

  I.daily = function (s, rep) {
    I.passiveDaily(s, rep);
    I.marketDaily(s, rep);
    I.termsDaily(s, rep);
    I.mortDaily(s, rep);
    I.serviceDaily(s, rep);
    s.nwHist.push(Sys.fin.netWorth(s)); if (s.nwHist.length > 120) s.nwHist.shift();
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/systems/perks.js */
/* Таланты (очки за уровни + покупка очков) и платные мастер-классы по любому навыку */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const Pk = Sys.perks = {};

  Pk.spent = s => (s.perks || []).reduce((a, id) => a + (D.perkById[id] ? D.perkById[id].cost : 0), 0);
  Pk.points = s => Math.max(0, Sys.quests.level(s) - 1 + (s.flags.boughtPts || 0) - Pk.spent(s));
  Pk.buy = function (s, id) {
    const p = D.perkById[id];
    if (!p) return SN.fail('Нет таланта');
    if (s.perks.includes(id)) return SN.fail('Уже изучен');
    if (Pk.points(s) < p.cost) return SN.fail('Нужно очков: ' + p.cost);
    s.perks.push(id);
    Sys.log(s, '🌟 Новый талант: ' + p.name + '.');
    Sys.quests.check(s);
    SN.say(p.icon + ' Талант «' + p.name + '» изучен!', 'good');
    return SN.okr('');
  };
  /* Коуч-сессия: купить очко таланта за деньги, цена растёт */
  Pk.pointPrice = s => Math.round(40000 * Math.pow(1.6, s.flags.boughtPts || 0) / 1000) * 1000;
  Pk.buyPoint = function (s) {
    const c = Pk.pointPrice(s);
    if (!Sys.econ.pay(s, c, 'study', 'Коуч-сессия: очко таланта')) return SN.fail('Нужно ' + U.money(c));
    s.flags.boughtPts = (s.flags.boughtPts || 0) + 1;
    T.advance(s, 120, { indoor: true });
    SN.say('Коуч-сессия пройдена: +1 очко таланта.', 'good');
    return SN.okr('');
  };

  /* Онлайн-мастер-класс по любому навыку: быстро, но дорожает с уровнем */
  Pk.mcCost = (s, k) => Math.round(600 * Math.pow(1 + s.sk[k] / 14, 2) / 100) * 100;
  Pk.mcCheck = function (s, k) {
    if (!s.items.includes('phone') && !Sys.prop.has(s, 'phone') && !Sys.prop.has(s, 'laptop')) return 'Нужен смартфон или ноутбук';
    if (s.sk[k] >= 95) return 'Навык почти максимальный';
    if (s.st.energy < 12) return 'Мало энергии';
    if (!Sys.econ.canPay(s, Pk.mcCost(s, k))) return 'Нужно ' + U.money(Pk.mcCost(s, k));
    return '';
  };
  Pk.masterclass = function (s, k) {
    const why = Pk.mcCheck(s, k); if (why) return SN.fail(why);
    const c = Pk.mcCost(s, k);
    Sys.econ.pay(s, c, 'study', 'Мастер-класс: ' + D.skillNames[k]);
    s.st.energy = U.clamp(s.st.energy - 8);
    T.advance(s, 180, { indoor: s.housing !== 'street' });
    const before = s.sk[k];
    Sys.stats.gain(s, { [k]: 4.5 }, SN.perk(s, 'fastlearner') ? 1.25 : 1);
    s.c.studyH += 3; s.xp += 15;
    Sys.quests.check(s);
    const msg = D.skillIcons[k] + ' Мастер-класс: ' + D.skillNames[k] + ' ' + Math.floor(before) + ' → ' + Math.floor(s.sk[k]);
    SN.say(msg, 'good');
    return SN.okr(msg);
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/systems/social.js */
/* Люди и отношения: встречи по расписанию, диалоги, совместные занятия,
   романтика только по обоюдному согласию, совместная жизнь, свадьба. */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const S = Sys.social = {};

  S.get = (s, id) => s.npc[id] || (s.npc[id] = { rel: 0, trust: 0, met: false, mem: {}, last: 0, romance: 0, status: '', livingTogether: false, cd: 0, phone: false });
  S.where = (s, id) => D.npcById[id].where(s);
  S.present = (s, id) => S.where(s, id) === s.district;
  S.relLabel = r => r >= 80 ? 'Близкий человек' : r >= 60 ? 'Друг' : r >= 35 ? 'Приятель' : r >= 15 ? 'Знакомый' : 'Едва знакомы';
  S.statusLabel = n => n.status === 'married' ? 'Супруг(а) 💍' : n.status === 'partner' ? (n.livingTogether ? 'Живёте вместе 🏠' : 'Встречаетесь ❤️') : n.status === 'dating' ? 'Ходите на свидания 💞' : '';

  /* api для эффектов диалога */
  const api = (s, n) => ({
    rel: x => { n.rel = U.clamp(n.rel + x); },
    trust: x => { n.trust = U.clamp(n.trust + x); },
    time: m => T.advance(s, m, { indoor: false })
  });

  /* Открыть разговор: лично (нужно быть в одном районе) или по телефону */
  S.open = function (s, id, remote) {
    const def = D.npcById[id], n = S.get(s, id);
    if (remote) {
      if (!s.items.includes('phone') || s.flags.phoneBroken) return SN.fail('Нужен работающий телефон');
      if (!n.phone) return SN.fail('У вас нет номера ' + def.name);
      const hh = T.hourF(s); if (hh < 8 || hh >= 23) return SN.fail('Слишком поздно для звонков');
    } else {
      const where = S.where(s, id);
      if (!where) return SN.fail(def.name + ' сейчас не в городе — загляните в другое время');
      if (where !== s.district) { const r = Sys.city.travel(s, where); if (!r.ok) return r; }
      if (S.where(s, id) !== s.district) return SN.fail(def.name + ' уже ушёл(ушла)');
    }
    const first = !n.met;
    n.met = true;
    T.advance(s, remote ? 10 : 20, { indoor: false });
    if (n.last !== T.day(s)) { n.rel = U.clamp(n.rel + (remote ? 1.5 : 3) * (s.st.hygiene < 25 && !remote ? 0.4 : 1) * (SN.perk(s, 'charisma') ? 1.3 : 1)); n.last = T.day(s); }
    if (n.rel >= 15 && !n.phone && s.items.includes('phone')) { n.phone = true; SN.say(def.icon + ' ' + def.name + ' даёт свой номер.', 'good'); }
    Sys.quests.check(s);
    return { ok: true, first, greet: def.greet[D.npcTier(n)] };
  };
  S.choices = function (s, id) {
    const def = D.npcById[id], n = S.get(s, id);
    return def.choices.map((c, i) => ({ i, t: c.t, show: !c.show || c.show(s, n), lock: c.lock ? c.lock(s, n) : '' })).filter(c => c.show);
  };
  S.choose = function (s, id, i) {
    const def = D.npcById[id], n = S.get(s, id), c = def.choices[i];
    if (!c || (c.show && !c.show(s, n))) return { text: '…' };
    const lock = c.lock ? c.lock(s, n) : ''; if (lock) return { text: lock };
    T.advance(s, 15, {});
    const r = c.run(s, n, api(s, n));
    s.xp += 3;
    Sys.quests.check(s);
    return typeof r === 'string' ? { text: r } : r;
  };

  /* Совместные занятия */
  S.HANG = {
    walk:   { name: 'Прогуляться', icon: '🚶', cost: 0, hours: 2, rel: 4, rom: 3, mood: 6 },
    coffee: { name: 'Выпить кофе', icon: '☕', cost: 550, hours: 1.5, rel: 6, rom: 5, mood: 6 },
    cinema: { name: 'Сходить в кино', icon: '🎬', cost: 1000, hours: 3, rel: 7, rom: 7, mood: 12 },
    gift:   { name: 'Подарить подарок', icon: '🎁', cost: 900, hours: 0.5, rel: 6, rom: 6, mood: 3, cooldown: 3 },
    dinner: { name: 'Романтический ужин', icon: '🍽️', cost: 3400, hours: 3, rel: 8, rom: 12, mood: 15, romanceOnly: true }
  };
  S.hangCheck = function (s, id, k) {
    const n = S.get(s, id), h = S.HANG[k];
    if (!n.met) return 'Сначала познакомьтесь';
    if (h.romanceOnly && !n.status) return 'Только для пары';
    if (n.rel < 10 && k !== 'walk') return 'Пока слишком мало знакомы';
    if (h.cooldown && n.mem.giftDay && T.day(s) - n.mem.giftDay < h.cooldown) return 'Недавно дарили';
    if (n.mem['hang_' + T.day(s)]) return 'Сегодня уже провели время вместе';
    if (!Sys.econ.canPay(s, h.cost)) return 'Нужно ' + U.money(h.cost);
    if (!S.where(s, id)) return 'Сейчас не в городе';
    return '';
  };
  S.hang = function (s, id, k) {
    const why = S.hangCheck(s, id, k); if (why) return SN.fail(why);
    const n = S.get(s, id), h = S.HANG[k], def = D.npcById[id];
    const where = S.where(s, id);
    if (where !== s.district) { const r = Sys.city.travel(s, where); if (!r.ok) return r; }
    if (h.cost) Sys.econ.pay(s, h.cost, 'social', h.name + ': ' + def.name);
    T.advance(s, h.hours * 60, { indoor: k !== 'walk' });
    const vibe = (s.st.mood > 50 ? 1.1 : 0.9) * (s.st.hygiene < 30 ? 0.6 : 1) * (SN.perk(s, 'charisma') ? 1.2 : 1);
    n.rel = U.clamp(n.rel + h.rel * vibe);
    if (n.status) n.romance = U.clamp(n.romance + h.rom * vibe);
    if (k === 'gift') n.mem.giftDay = T.day(s);
    n.mem['hang_' + T.day(s)] = 1; n.last = T.day(s);
    Sys.stats.apply(s, { mood: h.mood, stress: -5 });
    Sys.stats.gain(s, { social: 0.6 });
    if (n.status) s.c.dates++;
    Sys.quests.check(s);
    SN.say(h.icon + ' ' + h.name + ' с ' + def.name.split(' ')[0] + ': отношения ' + Math.round(n.rel), 'good');
    return SN.okr('');
  };
  S.findNew = function (s) {
    if (s.st.energy < 10) return SN.fail('Мало энергии');
    T.advance(s, 120, {});
    Sys.stats.gain(s, { social: 1 });
    const here = D.npcs.filter(d => !S.get(s, d.id).met && S.where(s, d.id) === s.district);
    if (here.length) {
      const d = U.pick(s, here); S.get(s, d.id).met = true; S.get(s, d.id).rel = 5;
      Sys.quests.check(s);
      SN.say('Вы познакомились: ' + d.icon + ' ' + d.name + ' (' + d.role.toLowerCase() + ').', 'good');
      return SN.okr(d.id);
    }
    SN.say('Вы пообщались с людьми вокруг. Новых знакомств здесь сейчас нет — попробуйте другой район или время.', 'info');
    return SN.okr('');
  };

  // ── Романтика: всегда с проверкой согласия; отказ уважается
  S.consent = function (s, n, base) {
    let p = base + (SN.perk(s, 'charisma') ? 0.05 : 0) + (n.rel - 35) / 80 + Sys.stats.look(s) * 0.05 + n.trust / 300;
    if (s.st.mood > 55) p += 0.08;
    if (s.st.stress > 70) p -= 0.1;
    if (s.st.hygiene < 35) p -= 0.25;
    if (n.mem.lied && !n.mem.forgiven) p -= 0.2;
    return U.clamp(p, 0.03, 0.95);
  };
  S.dateCheck = function (s, id) {
    const def = D.npcById[id], n = S.get(s, id);
    if (!def.romance) return 'Только дружба';
    if (s.partner && s.partner !== id) return 'Вы уже в отношениях';
    if (n.status) return '';
    if (n.rel < 35) return 'Нужно лучше узнать друг друга (отношения 35)';
    if (n.cd > T.day(s)) return def.name + ' просит не торопить события';
    return '';
  };
  S.askDate = function (s, id) {
    const why = S.dateCheck(s, id); if (why) return SN.fail(why);
    const n = S.get(s, id), def = D.npcById[id];
    if (n.status) return SN.fail('Вы уже встречаетесь — просто проводите время вместе');
    const p = S.consent(s, n, 0.35);
    if (U.chance(s, p)) {
      n.status = 'dating'; n.romance = 20;
      Sys.log(s, def.name + ' согласилась(ся) на свидание.');
      Sys.quests.check(s);
      return { ok: true, yes: true, msg: def.name + ' улыбается: «Давай. Только без пафоса — просто погуляем?» Теперь в карточке доступны свидания.' };
    }
    n.cd = T.day(s) + 4;
    return { ok: true, yes: false, msg: def.name + ' мягко отказывает: «Ты классный, но мне пока не хочется. Давай останемся как есть?» Это нормально — уважайте её(его) решение.' };
  };
  S.proposeCouple = function (s, id) {
    const n = S.get(s, id), def = D.npcById[id];
    if (n.status !== 'dating') return SN.fail('Сначала свидания');
    if (n.romance < 60) return SN.fail('Чувства ещё не окрепли (романтика 60)');
    if (n.cd > T.day(s)) return SN.fail('Дайте время подумать');
    if (U.chance(s, S.consent(s, n, 0.5))) { n.status = 'partner'; s.partner = id; Sys.log(s, 'Теперь вы с ' + def.name + ' — пара.'); Sys.quests.check(s); return { ok: true, yes: true, msg: '«Я думала(думал), ты никогда не спросишь». Теперь вы пара.' }; }
    n.cd = T.day(s) + 5;
    return { ok: true, yes: false, msg: '«Мне хорошо с тобой, но я не готова(готов) к серьёзному. Дай мне время.»' };
  };
  S.moveIn = function (s, id) {
    const n = S.get(s, id);
    if (n.status !== 'partner' && n.status !== 'married') return SN.fail('Сначала станьте парой');
    if (!['flat', 'studio', 'house'].includes(s.housing)) return SN.fail('Нужна отдельная квартира или дом');
    if (n.romance < 75) return SN.fail('Рано съезжаться (романтика 75)');
    n.livingTogether = true; Sys.log(s, 'Вы съехались с ' + D.npcById[id].name + '. Расходы на жильё делите пополам.');
    Sys.quests.check(s);
    return { ok: true, yes: true, msg: 'Коробки, смех, первый ужин на полу среди вещей. Вы живёте вместе — расходы на жильё теперь ниже, настроение выше.' };
  };
  S.marry = function (s, id) {
    const n = S.get(s, id);
    if (!n.livingTogether) return SN.fail('Сначала поживите вместе');
    if (!s.items.includes('ring')) return SN.fail('Нужно обручальное кольцо');
    if (n.romance < 90) return SN.fail('Нужна романтика 90');
    if (!U.chance(s, S.consent(s, n, 0.7))) { n.cd = T.day(s) + 7; return { ok: true, yes: false, msg: '«Я люблю тебя. Но давай не сейчас — я хочу быть уверенной(уверенным) до конца».' }; }
    n.status = 'married'; s.items = s.items.filter(i => i !== 'ring');
    Sys.log(s, 'Свадьба! Вы поженились с ' + D.npcById[id].name + '.');
    Sys.stats.apply(s, { mood: 40, stress: -30 }); s.rep = U.clamp(s.rep + 10);
    Sys.quests.check(s);
    return { ok: true, yes: true, msg: '«Да!» Скромная свадьба в кафе на набережной: Серёга в пиджаке, Нина Петровна плачет, Михалыч произносит тост про историю, которая пишется сейчас.' };
  };
  S.breakUp = function (s, id) {
    const n = S.get(s, id);
    n.status = ''; n.livingTogether = false; n.romance = 0; n.rel = U.clamp(n.rel - 25); s.partner = null;
    Sys.stats.apply(s, { mood: -20, stress: 15 });
    Sys.log(s, 'Вы расстались с ' + D.npcById[id].name + '.');
    return SN.okr('Вы расстались.');
  };

  S.daily = function (s, rep) {
    const day = T.day(s);
    for (const id in s.npc) {
      const n = s.npc[id];
      if (!n.met) continue;
      const idle = day - (n.last || day);
      if (idle > 7 && n.rel > 10) n.rel = U.clamp(n.rel - 0.5);
      if (n.status) {
        if (n.livingTogether) { n.romance = U.clamp(n.romance + 0.5); n.rel = U.clamp(n.rel + 0.3); s.st.mood = U.clamp(s.st.mood + 3); s.st.stress = U.clamp(s.st.stress - 2); }

<script>/* js/systems/events.js */
/* События: отбор раз в сутки (детерминированно от ГПСЧ сохранения), очередь выбора, сезонные праздники */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const Ev = Sys.events = {};
  Ev.byId = id => D.events.find(e => e.id === id) || D.seasonal.find(e => e.id === id);

  Ev.daily = function (s, rep) {
    const o = T.dateOf(T.day(s));
    // Сезонные
    s.flags.fair = false;
    for (const se of D.seasonal) {
      if (!se.when(s, o)) continue;
      if (se.flag) s.flags[se.flag] = true;
      if (!s.flags['seen_' + se.id + '_' + o.y] && (se.id !== 'fair' || o.d === 12)) {
        s.flags['seen_' + se.id + '_' + o.y] = true;
        if (se.effect) se.effect(s);
        s.pending.push({ id: se.id });
      }
    }
    // Собака
    if (s.flags.dog) { if (!Sys.econ.pay(s, 50, 'food', 'Корм для Рыжика')) Sys.stats.apply(s, { mood: -3 }); }
    // Случайные: 45% шанс в день, не повторяются чаще раза в 6 дней
    if (s.pending.length >= 2 || !U.chance(s, 0.45)) return;
    s.flags.evLast = s.flags.evLast || {};
    const pool = D.events.filter(e => { try { return e.when(s) && !(s.flags.evLast[e.id] > T.day(s) - 6); } catch (x) { return false; } });
    if (!pool.length) return;
    let total = pool.reduce((a, e) => a + e.w, 0), r = U.rand(s) * total, pick = pool[0];
    for (const e of pool) { r -= e.w; if (r <= 0) { pick = e; break; } }
    s.flags.evLast[pick.id] = T.day(s);
    s.pending.push({ id: pick.id });
  };

  Ev.current = s => s.pending.length ? Ev.byId(s.pending[0].id) : null;
  Ev.resolve = function (s, idx) {
    const e = Ev.current(s);
    if (!e) return { text: '' };
    s.pending.shift();
    if (!e.choices) return { text: '' };
    const c = e.choices[idx];
    if (!c) return { text: '' };
    if (c.lock) { const l = c.lock(s); if (l) { s.pending.unshift({ id: e.id }); return { text: l, locked: true }; } }
    const text = c.run(s);
    s.c.events++;
    Sys.log(s, e.icon + ' ' + e.title + ': ' + text);
    Sys.quests.check(s);
    return { text };
  };
})(typeof window !== 'undefined' ? window : globalThis);
