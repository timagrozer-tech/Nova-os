<script>/* js/systems/quests.js */
/* Задания, достижения, уровни, рыбалка, быстрые действия главного экрана */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const Q = Sys.quests = {};

  Q.level = s => Math.floor((1 + Math.sqrt(1 + s.xp / 50)) / 2);
  Q.levelXp = L => 200 * L * (L - 1);
  Q.isOpen = (s, q) => !(q.after || []).some(a => s.quests[a] !== 'done');
  Q.active = s => D.quests.filter(q => s.quests[q.id] !== 'done' && Q.isOpen(s, q));
  let busy = false;
  Q.check = function (s) {
    if (busy) return; busy = true;
    try {
      let changed = true;
      while (changed) {
        changed = false;
        for (const q of D.quests) {
          if (s.quests[q.id] === 'done' || !Q.isOpen(s, q)) continue;
          let ok = false; try { ok = q.done(s); } catch (e) { ok = false; }
          if (!ok) continue;
          s.quests[q.id] = 'done'; changed = true;
          const r = q.reward || {};
          s.xp += r.xp || 0; if (r.rep) s.rep = U.clamp(s.rep + r.rep);
          if (r.money) Sys.econ.earn(s, r.money, 'quest', 'Награда: ' + q.title);
          Sys.log(s, '✅ Задание выполнено: ' + q.title);
          SN.emit('quest', q);
        }
      }
      for (const a of D.achievements) {
        if (s.ach[a.id]) continue;
        let ok = false; try { ok = a.done(s); } catch (e) { ok = false; }
        if (ok) { s.ach[a.id] = T.day(s); s.xp += 50; Sys.log(s, '🏆 Достижение: ' + a.name); SN.emit('achievement', a); }
      }
    } finally { busy = false; }
  };

  // ── Рыбалка (мини-игра): результат 0–3 пойманных рыб
  const Fun = Sys.fun = {};
  Fun.fishResult = function (s, caught) {
    caught = U.clamp(Math.floor(caught), 0, 3);
    s.fish += caught; s.c.fishCaught += caught;
    Sys.stats.gain(s, { physical: 0.2 });
    s.xp += 10 + caught * 10;
    Sys.quests.check(s);
    return caught ? 'Улов: ' + caught + ' ' + U.plural(caught, 'рыба', 'рыбы', 'рыб') + '. Можно съесть (сытость +30) или продать на рынке (250 ₽ за штуку).' : 'Сегодня не клюёт. Зато отдохнули.';
  };
  Fun.eatFish = function (s) {
    if (s.fish < 1) return SN.fail('Нет рыбы');
    if (s.housing === 'street' && !s.items.includes('stove') && !s.flags.campfireOk) { s.flags.campfireOk = true; }
    s.fish--; T.advance(s, 40, {}); Sys.stats.apply(s, { food: 30, mood: 4 }); s.c.meals++;
    SN.say('🐟 Ухa на костре у реки. Сытость +30.', 'good'); return SN.okr('');
  };
  Fun.sellFish = function (s) {
    if (s.fish < 1) return SN.fail('Нет рыбы');
    if (s.district !== 'old') { const r = Sys.city.travel(s, 'old'); if (!r.ok) return r; }
    const n = s.fish, v = n * 250; s.fish = 0; T.advance(s, 30, {});
    Sys.econ.earn(s, v, 'other', 'Продажа рыбы на рынке');
    SN.say('Продано ' + n + ' рыб на рынке: +' + U.money(v), 'good'); return SN.okr('');
  };

  // ── Умные быстрые действия главного экрана
  const Quick = Sys.quick = {};
  Quick.work = s => { const j = Sys.work.best(s); return j ? { label: j.name, run: () => Sys.work.shift(s, j.id) } : { label: 'Нет доступной работы', run: () => SN.fail(Quick.workWhy(s)) }; };
  Quick.workWhy = s => {
    if (s.st.energy < 15) return 'Мало энергии — отдохните.';
    if (s.st.food < 12) return 'Сначала поешьте.';
    const h = T.hourF(s); if (h < 6 || h > 21) return 'Ночью работы нет. Выспитесь — утром откроются подработки.';
    return 'Сейчас нет подходящей работы. Загляните в «Карьеру».';
  };
  Quick.eat = function (s) {
    const order = ['cookhome', 'soup', 'canteen', 'bread', 'noodles'];
    for (const id of order) {
      const a = D.actionById[id];
      if (Sys.act.check(s, a)) continue;
      const dest = Sys.city.needTravel(s, a.where);
      if (a.open && !T.isOpen(s, a.open, a.hours, Sys.city.etaMins(s, dest))) continue;
      if (dest && id !== 'soup' && id !== 'cookhome') continue;
      if (!Sys.econ.canPay(s, Sys.act.cost(s, a))) continue;
      return { label: a.name, run: () => Sys.act.run(s, id) };
    }
    if (s.fish > 0) return { label: 'Сварить уху', run: () => Fun.eatFish(s) };
    return { label: 'Нет денег на еду', run: () => SN.fail('Нет денег. Бесплатный обед в соццентре — 12:00–15:00. Можно сдать вторсырьё (2 ч, ~230 ₽).') };
  };
  Quick.rest = function (s) {
    const h = T.hourF(s);
    if (h >= 20 || h < 5 || s.st.energy < 25) {
      const o = Sys.stats.sleepOptions(s);
      const pick = o.find(x => x.id === 'home') || (o.find(x => x.id === 'shelter' && x.open !== false)) || o.find(x => x.id === 'street');
      return { label: pick.name, run: () => Sys.stats.sleep(s, pick.id), sleep: true };
    }
    return { label: 'Вздремнуть 2 ч', run: () => Sys.act.run(s, 'nap') };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/systems/auto.js */
/* Автопилот: прожить день / неделю / месяц по плану.
   Герой сам ест, моется, лечится, ходит на работу или подработки, учится, прячет наличные на счёт и спит в лучшем месте.
   События решаются разумным вариантом (или автопилот останавливается — по настройке). */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const Au = Sys.auto = {};
  Au.DEF = { work: 'auto', study: '', events: 'auto', maxHours: 10, saveCash: true };
  Au.plan = s => Object.assign({}, Au.DEF, s.settings.auto || {});

  Au.begin = function (s) {
    SN.mute(true);
    return { plan: Au.plan(s), nw: Sys.fin.netWorth(s), earned: s.c.earned, spent: s.c.spent, day: T.day(s), shifts: s.c.jobs + s.c.gigs, studyH: s.c.studyH, events: [], stop: '', st: Object.assign({}, s.st), days: 0 };
  };
  Au.end = function (s, ctx) {
    const muted = SN.mute(false);
    const lines = [], warn = [];
    for (const m of muted) {
      if (m.ev === 'quest') lines.push('✅ ' + m.data.title);
      else if (m.ev === 'achievement') lines.push('🏆 ' + m.data.name);
      else if (m.ev === 'modal') lines.push((m.data.icon || '•') + ' ' + m.data.text);
      else if (m.ev === 'newday') m.data.forEach(r => r.lines.forEach(l => (l.includes('⚠️') || l.includes('выселили') || l.includes('уволили') ? warn : lines).push(l)));
    }
    s.c.autoDays = (s.c.autoDays || 0) + ctx.days;
    Sys.quests.check(s);
    return { days: ctx.days, income: s.c.earned - ctx.earned, spent: s.c.spent - ctx.spent, nw0: ctx.nw, nw1: Sys.fin.netWorth(s), shifts: s.c.jobs + s.c.gigs - ctx.shifts,
      studyH: s.c.studyH - ctx.studyH, events: ctx.events, lines: lines.slice(-14), warn: warn.slice(-8), stop: ctx.stop, st0: ctx.st, st1: Object.assign({}, s.st) };
  };

  Au.try = (fn) => { const r = fn(); return r && r.ok; };
  Au.resolve = function (s, ctx) {
    const ev = Sys.events.current(s); if (!ev) return;
    let idx = 0;
    if (ev.choices) { idx = ev.choices.findIndex(c => !c.lock || !c.lock(s)); if (idx < 0) idx = ev.choices.length - 1; }
    const r = Sys.events.resolve(s, idx);
    if (r.locked) s.pending.shift();
    ctx.events.push(ev.icon + ' ' + ev.title + (r.text ? ': ' + r.text : ''));
  };

  Au.care = function (s) {
    const st = s.st;
    if (st.food < 55) { const q = Sys.quick.eat(s); if (Au.try(q.run)) return true; }
    if (s.ill && !s.daily.autoTreat) {
      s.daily.autoTreat = 1;
      for (const id of (s.fin.ins.health ? ['clinic'] : []).concat(['polyclinic', 'freemed', 'pharmacy'])) {
        const a = D.actionById[id];
        if (Sys.act.check(s, a) || !Sys.econ.canPay(s, Sys.act.cost(s, a))) continue;
        if (a.open && !T.isOpen(s, a.open, a.hours, Sys.city.etaMins(s, Sys.city.needTravel(s, a.where)))) continue;
        if (Au.try(() => Sys.act.run(s, id))) return true;
      }
    }
    if (st.hygiene < 40 && !s.daily.autoWash) {
      s.daily.autoWash = 1;
      for (const id of ['homeshower', 'freeshower', 'banya']) {
        const a = D.actionById[id];
        if (Sys.act.check(s, a) || !Sys.econ.canPay(s, Sys.act.cost(s, a))) continue;
        if (a.open && !T.isOpen(s, a.open, a.hours, Sys.city.etaMins(s, Sys.city.needTravel(s, a.where)))) continue;
        if (Au.try(() => Sys.act.run(s, id))) return true;
      }
    }
    return false;
  };

  Au.work = function (s, plan, part) {
    if (plan.work === 'none' || (s.daily.autoWork || 0) >= plan.maxHours) return false;
    const done = (h) => { s.daily.autoWork = (s.daily.autoWork || 0) + h; return true; };
    if (part !== 'gig' && s.job && (plan.work === 'auto' || plan.work === 'job')) {
      const j = D.jobById[s.job.id];
      if (!Sys.work.check(s, j) && Au.try(() => Sys.work.shift(s, j.id))) return done(j.hours);
    }
    if (part !== 'gig' && s.biz.length && (plan.work === 'auto' || plan.work === 'biz')) {
      const b = s.biz.find(x => !x.owner && (x.staff === 0 || plan.work === 'biz'));
      if (b && s.st.energy >= 30 && Au.try(() => Sys.biz.work(s, b.id))) return done(8);
    }
    if (part !== 'main' && (plan.work === 'auto' || plan.work === 'gig')) {
      // Не брать подработку, если сегодня ещё предстоит смена на основной работе
      if (plan.work === 'auto' && s.job && !T.weekend(s) && s.job.last !== T.day(s) && T.hourF(s) < D.jobById[s.job.id].open[1]) return false;
      let best = null, rate = 0;
      for (const j of D.jobs) { if (j.kind !== 'gig' || Sys.work.check(s, j)) continue; const r = Sys.work.payEstimate(s, j) / j.hours - j.energy * 2; if (r > rate) { rate = r; best = j; } }
      if (best && Au.try(() => Sys.work.shift(s, best.id))) return done(best.hours);
    }
    return false;
  };

  Au.study = function (s, plan) {
    const c = D.courseById[plan.study];
    if (!c || (s.daily.autoStudy || 0) >= 2) return false;
    if (Sys.edu.done(s, c)) { s.settings.auto = Object.assign(Au.plan(s), { study: '' }); return false; }
    const why = Sys.edu.check(s, c, true); if (why) return false;
    const eta = Sys.city.etaMins(s, c.district);
    if (!T.isOpen(s, c.open, c.session, eta)) {
      // Занятия откроются позже сегодня — подождать, если ждать недолго
      const startH = c.open[0] - eta / 60, h = T.hourF(s);
      if (startH > h && startH - h <= 3 && c.open[0] + c.session <= c.open[1]) T.advance(s, (startH - h) * 60, { indoor: s.housing !== 'street' });
      else return false;
    }
    if (Au.try(() => Sys.edu.study(s, c.id))) { s.daily.autoStudy = (s.daily.autoStudy || 0) + 1; return true; }
    return false;
  };

  Au.sleep = function (s, plan) {
    if (plan.saveCash && s.account && s.money > 1500) Sys.fin.toBank(s, s.money - 1000);
    const o = Sys.stats.sleepOptions(s);
    let id = 'street';
    if (o.find(x => x.id === 'home')) id = 'home';
    else if (Sys.econ.available(s) > 15000 && o.find(x => x.id === 'hostelNight')) id = 'hostelNight';
    else if (T.hour(s) < 2 || T.hour(s) >= 6) id = 'shelter';
    if (id === 'shelter') {
      if (s.district !== 'old') Sys.city.travel(s, 'old');
      if (T.hour(s) >= 2 && T.hour(s) < 19) T.advance(s, (19 - T.hourF(s)) * 60, {});
      if (!(T.hour(s) >= 19 || T.hour(s) < 2)) id = 'street';
    }
    if (!Au.try(() => Sys.stats.sleep(s, id))) Sys.stats.sleep(s, 'street');
  };

  /* Один день. Возвращает причину остановки или '' */
  Au.day = function (s, ctx) {
    const plan = ctx.plan, d0 = T.day(s);
    let guard = 0;
    while (T.day(s) === d0 && T.hourF(s) < 20.5 && guard++ < 30) {
      if (s.pending.length) { if (plan.events === 'stop') return 'Событие ждёт вашего решения'; Au.resolve(s, ctx); continue; }
      if (s.st.health < 15) return 'Здоровье на исходе — автопилот остановлен. Нужны врач, еда и отдых.';
      if (Au.care(s)) continue;
      if (s.st.energy < 22) break;
      if (Au.work(s, plan, 'main')) continue;
      if (plan.study && Au.study(s, plan)) continue;
      if (Au.work(s, plan, 'gig')) continue;
      break;
    }
    if (T.day(s) === d0 && T.hourF(s) < 19) {
      if (s.housing !== 'street' && s.district !== Sys.city.homeDistrict(s)) Sys.city.travel(s, Sys.city.homeDistrict(s));
      T.advance(s, (19 - T.hourF(s)) * 60, { indoor: s.housing !== 'street' && s.district === Sys.city.homeDistrict(s) });
      Sys.stats.apply(s, { stress: -3, mood: 2 });
    }
    if (s.st.food < 45) { const q = Sys.quick.eat(s); q.run(); }
    Au.sleep(s, plan);
    ctx.days++;
    if (s.pending.length && plan.events !== 'stop') { while (s.pending.length) Au.resolve(s, ctx); }
    return '';
  };

  /* Синхронный вариант (для тестов и быстрых вызовов) */
  Au.run = function (s, days) {
    const ctx = Au.begin(s);
    try { for (let i = 0; i < days; i++) { const st = Au.day(s, ctx); if (st) { ctx.stop = st; break; } } }
    finally { var sum = Au.end(s, ctx); }
    return sum;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  /* Скайлайн района: детерминированный набор домов, окна горят вечером/ночью */
  Sc.skyline = function (s) {
    const ph = T.phase(s), [top, bot] = Sc.SKY[ph];
    const seed = Object.keys(D.districts).indexOf(s.district) + 3;
    let r = seed * 9301; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
    const lit = ph === 'night' ? 0.45 : ph === 'evening' ? 0.6 : ph === 'dawn' ? 0.25 : 0.05;
    const tall = s.district === 'business' || s.district === 'center' ? 1.2 : s.district === 'industrial' ? 0.8 : 1;
    let x = -10, b = '', w = '';
    const bcol = ph === 'day' ? '#3c4752' : ph === 'night' ? '#222c38' : '#2a2f3c';
    while (x < 420) {
      const bw = 30 + rnd() * 50, bh = Math.min(280, (110 + rnd() * 130) * tall);
      b += `<rect x="${x.toFixed(0)}" y="${(300 - bh).toFixed(0)}" width="${bw.toFixed(0)}" height="${bh.toFixed(0)}" fill="${bcol}" opacity="${(0.85 + rnd() * 0.15).toFixed(2)}"/>`;
      for (let wy = 300 - bh + 10; wy < 290; wy += 14) for (let wx = x + 6; wx < x + bw - 8; wx += 11) if (rnd() < lit) { const tw = rnd() < 0.18; w += `<rect ${tw ? `class="tw" style="animation-delay:${(rnd() * 6).toFixed(1)}s"` : ''} x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="5" height="7" fill="#ffd27a" opacity="${(0.6 + rnd() * 0.4).toFixed(2)}"/>`; }
      if (s.district === 'industrial' && rnd() < 0.3) b += `<rect x="${(x + bw / 2).toFixed(0)}" y="${(300 - bh - 50).toFixed(0)}" width="9" height="50" fill="${bcol}"/>`;
      x += bw + 2;
    }
    const sun = ph === 'night' ? `<circle cx="320" cy="60" r="16" fill="#e8ecf5" opacity=".85"/>` : ph === 'day' ? `<circle cx="300" cy="50" r="22" fill="#fff4c9" opacity=".9"/>` : `<circle cx="80" cy="170" r="26" fill="#ffb26b" opacity=".85"/>`;
    const water = s.district === 'embankment' ? `<rect x="0" y="270" width="400" height="30" fill="#2a4a63" opacity=".9"/>` : '';
    return `<svg class="skyline" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="400" height="300" fill="url(#sk)"/>${sun}${b}${w}${water}</svg>`;
  };

<script>/* js/ui/components.js */
/* UI-компоненты: строки HTML. Все динамические строки экранируются. Действия — через data-a (делегирование кликов). */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys;
  const UI = SN.UI = SN.UI || {};
  const C = UI.C = {};
  const e = U.esc;

  C.attrs = (a, x, y) => `data-a="${e(a)}"` + (x != null ? ` data-x="${e(x)}"` : '') + (y != null ? ` data-y="${e(y)}"` : '');
  /* Кнопка. why — причина недоступности: кнопка остаётся нажимаемой и объясняет, почему нельзя */
  C.btn = (label, a, x, y, o) => {
    o = o || {};
    const dis = o.why ? ` aria-disabled="true" data-why="${e(o.why)}"` : '';
    return `<button class="btn ${o.cls || ''}" ${C.attrs(a, x, y)}${dis}${o.label ? ` aria-label="${e(o.label)}"` : ''}>${label}</button>`;
  };
  C.head = (title, sub, back) => `<div class="section-head"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${back ? `<button class="back" data-a="back">← Назад</button>` : ''}</div>`;
  C.tabs = (list, cur, a) => `<div class="tabs" role="tablist">${list.map(([id, name]) => `<button role="tab" aria-selected="${cur === id}" class="tab ${cur === id ? 'on' : ''}" ${C.attrs(a, id)}>${name}</button>`).join('')}</div>`;
  C.meter = (label, icon, v, col, inverse, info) => {
    const low = !info && (inverse ? v > 75 : v < 20);
    return `<div class="meter ${low ? 'low' : ''}" aria-label="${label}: ${Math.round(v)}"><div class="mr"><span aria-hidden="true" class="mi">${icon}</span><b data-count="m_${label}">${Math.round(v)}</b></div><div class="ml">${label}</div><div class="track"><i data-k="m_${label}" style="width:${U.clamp(v)}%;background:${col}"></i></div></div>`;
  };
  C.prog = (v, max) => `<div class="prog"><i style="width:${U.clamp(v / max * 100)}%"></i></div>`;
  C.tag = (t, cls) => `<span class="tag ${cls || ''}">${t}</span>`;
  /* Карточка-строка */
  C.row = o => `<div class="card ${o.cls || ''}" ${o.a ? C.attrs(o.a, o.x, o.y) + ' role="button" tabindex="0"' : ''}><div class="row"><div class="thumb">${o.icon}</div><div class="grow"><div class="title">${o.title}</div>${o.desc ? `<div class="desc">${o.desc}</div>` : ''}${o.meta ? `<div class="meta">${o.meta}</div>` : ''}${o.why ? `<div class="why">${e(o.why)}</div>` : ''}${o.extra || ''}</div>${o.btn || ''}</div>${o.below || ''}</div>`;
  C.kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  C.notice = (t, cls) => `<div class="notice ${cls || ''}">${t}</div>`;
  C.empty = t => `<div class="list-empty">${t}</div>`;
  /* Где выполняется действие и сколько ехать */
  C.where = (s, where) => {
    const dest = Sys.city.needTravel(s, where);
    if (where === 'any') return '<span class="m">📍 где угодно</span>';
    if (where === 'home') return dest ? '<span class="m">🏠 дома · дорога ' + D.transport[Sys.city.pickMode(s)].mins + ' мин</span>' : '<span class="m">🏠 дома</span>';
    const id = Array.isArray(where) ? (where.includes(s.district) ? s.district : where[0]) : where;
    if (!dest) return `<span class="m">📍 ${D.districts[id].name} — вы здесь</span>`;
    const t = D.transport[Sys.city.pickMode(s)];
    return `<span class="m">📍 ${D.districts[id].name} · ${t.icon} ${t.mins} мин${t.cost ? ', ' + t.cost + ' ₽' : ''}</span>`;
  };
  C.money = x => U.money(x);
  /* Мини-график доходов/расходов */
  C.bars = days => {
    const d = days.slice(0, 14).reverse();
    if (!d.length) return C.empty('История появится после первого дня');
    const max = Math.max(1, ...d.map(x => Math.max(x.inc, x.exp)));
    return `<div class="bars" role="img" aria-label="Доходы и расходы за ${d.length} дней">${d.map(x => `<div title="День ${x.d}: +${x.inc} / −${x.exp}"><i style="height:${x.inc / max * 100}%;background:var(--green)"></i><i style="height:${x.exp / max * 100}%;background:var(--red);opacity:.75"></i></div>`).join('')}</div><div class="tags">${C.tag('■ доход', 'good')}${C.tag('■ расход', 'bad')}</div>`;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/screens.js */
/* Экраны игры. Каждый экран — функция, возвращающая HTML по текущему состоянию. */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys, UI = SN.UI, C = UI.C;
  const e = U.esc, M = U.money;
  const V = UI.views = {};
  const S = () => SN.state;

  // ─────────────────────────── ДОМ
  V.home = function () {
    const s = S(), h = D.housing[s.housing], w = s.weather, wk = D.weatherKinds[w.kind];
    const qWork = Sys.quick.work(s), qEat = Sys.quick.eat(s), qRest = Sys.quick.rest(s);
    const flag = V.dayFlag(s);
    const head = s.housing === 'street' ? 'Без крыши над головой' : h.icon + ' ' + h.name;
    const goal = Sys.quests.active(s)[0];
    let o = `<div class="hero">${SN.Scene.html(s)}
      <div class="scene-top"><span class="pill">📍 ${D.districts[s.district].name}</span><span class="pill">${wk.icon} ${w.temp > 0 ? '+' : ''}${w.temp}° · ${D.seasonName[T.season(s)]}</span></div>
      <div class="scene-copy"><div class="eyebrow">${e(s.hero.name)} · ${T.dateLabel(s)}</div><h1>${head}</h1>
      <p>${goal ? '🎯 ' + goal.title : 'Город большой. Возможностей ещё больше.'}</p>
      ${flag ? `<div class="dayflag">${flag}</div>` : ''}
      <div class="quick">
        <button data-a="quick" data-x="work"><span class="ico">💼</span>Работать<small>${e(qWork.label)}</small></button>
        <button data-a="quick" data-x="eat"><span class="ico">🍲</span>Поесть<small>${e(qEat.label)}</small></button>
        <button data-a="sleepSheet"><span class="ico">🛏️</span>Отдохнуть<small>${e(qRest.label)}</small></button>
      </div></div></div>`;
    o += V.autoPanel(s);
    const st = s.st;
    const pas = Sys.inv.passivePerDay(s);
    o += `<div class="money-strip"><button ${C.attrs('go', 'rich')}><b>${U.num(Sys.fin.netWorth(s))} ₽</b><span>капитал · #${Sys.inv.richRank(s)} в городе</span></button><button ${C.attrs('go', 'passive')}><b class="${pas > 0 ? 'pos' : ''}">+${U.num(pas)} ₽</b><span>пассивно в день</span></button><button ${C.attrs('go', 'talents')}><b>${Sys.perks.points(s)} ★</b><span>очков таланта</span></button></div>`;
    o += `<h3 class="heading">Состояние <span class="muted">Репутация ${Math.round(s.rep)}</span></h3><div class="meters">
      ${C.meter('Здоровье', '❤️', st.health, '#f27c7b')}${C.meter('Сытость', '🍗', st.food, '#ffb86a')}${C.meter('Энергия', '⚡', st.energy, '#b29aff')}
      ${C.meter('Гигиена', '💧', st.hygiene, '#7bbdff')}${C.meter('Настроение', '😊', st.mood, '#8dda9f')}${C.meter('Тепло', '🌡️', st.warmth, '#f9bd79')}
      ${C.meter('Стресс', '😣', st.stress, '#ff8f7a', true)}${C.meter('Репутация', '⭐', s.rep, '#f5b54a', false, true)}${C.meter('Навыки', '🧠', V.skillAvg(s), '#7bd7e8', false, true)}</div>`;
    if (s.ill) { const I = Sys.stats.ILL[s.ill.id]; o += `<div class="card warn" style="margin-top:9px"><div class="row"><div class="thumb">${I.icon}</div><div class="grow"><div class="title">${I.name}</div><div class="desc">Ещё ~${Math.max(1, Math.ceil(s.ill.left))} дн. Энергия и здоровье тают быстрее. Бесплатно лечат в мобильном медпункте соццентра.</div></div>${C.btn('Лечить', 'go', 'cat:health', null, { cls: 'sm' })}</div></div>`; }
    const offers = V.offers(s);
    if (offers.length) o += `<h3 class="heading">Сейчас можно <span class="muted">${T.clock(s)}</span></h3>` + offers.join('');
    const qs = Sys.quests.active(s).slice(0, 3);

  // ─────────────────────────── ИНВЕНТАРЬ / ЗАДАНИЯ / ДОСТИЖЕНИЯ / ЖУРНАЛ / СТАТИСТИКА
  V.inventory = function () {
    const s = S();
    let o = C.head('🎒 Инвентарь', 'Вещи, документы, запасы', true);
    o += `<div class="card gold">${C.kv('🏠 Жильё', D.housing[s.housing].name)}${C.kv('🛍️ Продукты дома', s.groceries + ' порц.')}${C.kv('🐟 Рыба', s.fish)}${s.flags.dog ? C.kv('🐕 Рыжик', 'с вами') : ''}</div>`;
    o += `<h3 class="heading">Документы</h3><div class="card">${Object.keys(D.docNames).map(k => C.kv(D.docNames[k], s.docs[k] ? '✅' : s.docsPending[k] ? '⏳' : '—')).join('')}${s.certs.map(c => C.kv('🎓 ' + D.certNames[c], '✅')).join('')}</div>`;

  V.quests = function () {

  V.ach = function () {

  V.stats = function () {

  // ─────────────────────────── РЕЖИМЫ / НАСТРОЙКИ / ПОМОЩЬ
  V.MODES = [
    ['👑', 'Классический', true, 'Сбалансированная песочница с сюжетными линиями. Обморок не заканчивает игру. Бесплатные службы всегда доступны.'],
    ['💀', 'Хардкор', false, 'Цены ×1,4, зарплаты ×0,8, болезни вдвое опаснее, кражи чаще. Нет бесплатного обеда по выходным. Восстановление после неудачи: социальный контракт центра занятости (обучение + 14 дней гарантированного ночлега), реабилитационный кредит без процентов 10 000 ₽ раз в игру.'],
    ['📖', 'Сюжетный', false, '5 актов, 40+ сцен с выбором, напарники с собственными арками. Концовки: «Мастер своего дела», «Семья», «Свободная жизнь», «Империя», «Помощь другим». Ключевые решения необратимы и меняют отношение NPC.'],
    ['♾️', 'Песочница', false, 'Выбор стартовых условий: деньги, документы, жильё, навыки, сезон. Множители экономики. Отключаемые потребности. Без заданий-ограничений.'],
    ['🏢', 'Бизнес-империя', false, 'Старт с 200 000 ₽ и ИП. Конкуренты в районах, закупки партиями, найм с навыками, кредитные линии, филиалы, франшизы, фондовый рынок с акциями вашей компании.'],
    ['👨‍👩‍👦', 'Династия', false, 'Семья и дети, взросление (1 игровой год = 1 месяц жизни ребёнка), наследование активов и 50% навыков, смена поколений, репутация фамилии.']
  ];
  V.modes = function () {
    const s = S();
    return C.head('🎲 Режимы игры', 'Сейчас полностью реализован Классический режим', true) + C.notice('Остальные режимы в разработке. Ниже — их задокументированные правила; выбрать их пока нельзя.', 'blue') + V.MODES.map(m => C.row({ icon: m[0], title: m[1] + (m[2] ? '' : ''), desc: m[3], cls: m[2] ? 'gold' : 'dim', btn: m[2] ? C.tag('Активен', 'good') : C.tag('В разработке') })).join('');
  };
  V.settings = function () {
    const s = S(), st = s.settings;

    let o = C.head('⚙️ Настройки', 'Доступность и сохранения', true);

    o += tog('bigText', 'Крупный текст', 'Увеличивает размер шрифта.');
    o += tog('vibro', 'Вибрация', 'Лёгкий отклик при нажатиях и событиях (на телефоне).');
    o += `<div class="card gold"><div class="title">🔐 Автосохранение включено</div><div class="desc">Прогресс хранится только в этом браузере (localStorage) с контрольной суммой и резервной копией. Ничего не отправляется в интернет. Очистка данных браузера удалит прогресс — делайте экспорт.</div><div class="btns">${C.btn('💾 Экспорт в файл', 'exportSave', null, null, { cls: 'sm' })}${C.btn('📋 Скопировать код', 'copySave', null, null, { cls: 'sm sec' })}</div></div>`;
    o += `<div class="card"><div class="title">Импорт сохранения</div><div class="desc">JSON-файл, экспортированный ранее (поддерживаются и сохранения прототипа).</div><input type="file" accept="application/json,.json" class="field" style="margin-top:8px" data-file="import"></div>`;
    o += `<div class="card"><div class="title">Новая игра</div><div class="desc">Начать заново. Текущий прогресс будет удалён (сделайте экспорт).</div><div class="btns">${C.btn('Начать заново', 'reset', null, null, { cls: 'bad sm' })}</div></div>`;
    o += `<p class="footnote">С НУЛЯ ${SN.VERSION} · формат сохранения v${SN.SAVE_VERSION} · HTML/CSS/JS без движков и CDN</p>`;
    return o;
  };
  V.help = function () {
    return C.head('❓ Как играть', '', true) + `<div class="card"><div class="title">Первые шаги</div><div class="desc" style="font-size:12.5px;line-height:1.55">
      1. Днём — бесплатный обед, душ и вещи в соццентре (Старый район).<br>2. Познакомьтесь с Ниной Петровной: она даст направление на паспорт.<br>3. Подрабатывайте: вторсырьё, листовки, разгрузка. Копите.<br>4. Ночуйте в ночлежке (с 19:00) — там тепло и не воруют.<br>5. С паспортом: счёт в банке, курсы, вакансии, аренда хостела.<br>6. Учитесь — профессии с документами платят в разы больше.<br>7. Дальше — своё дело, жильё, семья, или свободная жизнь. Выбор ваш.</div></div>
      <div class="card"><div class="title">Показатели</div><div class="desc" style="font-size:12.5px;line-height:1.55">Голод, холод и усталость медленно отнимают здоровье. При нуле здоровья — больница, а не конец игры. Стресс снижает эффективность, отдых и общение его снимают. Каждое действие тратит игровое время.</div></div>
      <div class="card"><div class="title">📲 Установить на Android</div><div class="desc" style="font-size:12.5px;line-height:1.55">Откройте игру в Chrome по HTTPS-адресу → меню ⋮ → «Добавить на главный экран» / «Установить приложение». После первого запуска игра работает без интернета.</div></div>`;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/screens2.js */
/* Экраны 0.3: финансы (банк, вклады, кредиты, ипотека, биржа, страхование), доходные активы, магазин,
   таланты, мастер-классы, автопилот, рейтинг богачей, обновлённое меню */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys, UI = SN.UI, C = UI.C, V = UI.views;
  const e = U.esc, M = U.money, I = () => Sys.inv;
  const S = () => SN.state;
  UI.tabs = UI.tabs || {};
  UI.tabs.fin = UI.tabs.fin || 'overview'; UI.tabs.passive = UI.tabs.passive || 'realty'; UI.tabs.shop = UI.tabs.shop || 'tech';

  /* Мини-график (спарклайн) */
  C.spark = function (arr, w, h, opt) {
    opt = opt || {}; w = w || 120; h = h || 34;
    if (!arr || arr.length < 2) return `<svg width="${w}" height="${h}" class="spark"></svg>`;
    const mn = Math.min(...arr), mx = Math.max(...arr), rg = mx - mn || 1;
    const pts = arr.map((v, i) => [i / (arr.length - 1) * w, h - 3 - (v - mn) / rg * (h - 6)]);
    const up = arr[arr.length - 1] >= arr[0], col = opt.col || (up ? 'var(--green)' : 'var(--red)');
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const id = 'g' + Math.random().toString(36).slice(2, 7);
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="spark-line"/></svg>`;
  };
  C.pct = x => (x >= 0 ? '+' : '') + (x * 100).toFixed(1).replace('.', ',') + '%';
  C.hero2 = (items) => `<div class="kpis">${items.map(([v, l, cls]) => `<div class="kpi ${cls || ''}"><strong>${v}</strong><span>${l}</span></div>`).join('')}</div>`;

  // ─────────── Панель «Прожить» на главном экране
  V.autoPanel = function (s) {
    const p = Sys.auto.plan(s);
    const wl = { auto: 'работа + подработки', job: 'только основная работа', gig: 'только подработки', biz: 'своё дело', none: 'отдых' }[p.work];
    const c = p.study && D.courseById[p.study];
    return `<div class="card autopanel"><div class="row"><div class="thumb glow">⏩</div><div class="grow"><div class="title">Прожить время</div><div class="desc">План: ${wl}${c ? ' · учёба: ' + e(c.name) : ''}. Герой сам ест, моется, лечится и спит.</div></div>${C.btn('⚙', 'go', 'auto', null, { cls: 'sec sm', label: 'План' })}</div>
      <div class="seg3">${C.btn('1 день', 'live', 1, null, { cls: 'sec' })}${C.btn('Неделя', 'live', 7)}${C.btn('Месяц', 'live', 30, null, { cls: 'sec' })}</div></div>`;
  };
  V.auto = function () {
    const s = S(), p = Sys.auto.plan(s);
    const opt = (key, val, label, desc) => `<button class="choice ${p[key] === val ? 'on' : ''}" ${C.attrs('autoSet', key, val)}>${label}${desc ? `<small class="ok">${desc}</small>` : ''}</button>`;
    let o = C.head('⏩ Автопилот', 'Как герой проживает дни, когда вы ускоряете время', true);
    o += `<h3 class="heading">Работа</h3>` + opt('work', 'auto', '💼 Работа и подработки', 'Смена на основной работе, затем лучшие подработки; в выходные — подработки')
      + opt('work', 'job', '🏢 Только основная работа', 'Без подработок: больше сил на учёбу') + opt('work', 'gig', '🛠️ Только подработки')
      + opt('work', 'biz', '🏪 Работать в своём деле', 'Владелец выходит на смену в точку без персонала') + opt('work', 'none', '🌴 Не работать', 'Жить на сбережения и пассивный доход');
    o += `<h3 class="heading">Часов работы в день: ${p.maxHours}</h3><div class="seg">${[6, 8, 10, 12, 14].map(h => C.btn(String(h), 'autoSet', 'maxHours', h, { cls: p.maxHours === h ? '' : 'sec' })).join('')}</div>`;
    const avail = D.courses.filter(c => !Sys.edu.done(s, c) && !Sys.econ.reqFail(s, c.req));
    o += `<h3 class="heading">Учёба в свободное время</h3>` + opt('study', '', '— Не учиться') + avail.map(c => opt('study', c.id, c.icon + ' ' + c.name, c.repeat ? 'Повторяемо' : 'Пройдено ' + Sys.edu.progress(s, c) + '/' + c.hours + ' ч')).join('');
    o += `<h3 class="heading">События</h3>` + opt('events', 'auto', '🤖 Решать разумно', 'Автопилот выберет осторожный вариант и расскажет, что случилось') + opt('events', 'stop', '✋ Останавливаться', 'Каждое событие решаете вы');
    o += `<div class="card"><label class="switch"><span><span class="title">Прятать наличные на счёт</span><span class="desc" style="display:block">Перед сном — защита от краж</span></span><input type="checkbox" ${p.saveCash ? 'checked' : ''} data-autotoggle="saveCash"></label></div>`;
    o += `<div class="seg3">${C.btn('1 день', 'live', 1, null, { cls: 'sec' })}${C.btn('Неделя', 'live', 7)}${C.btn('Месяц', 'live', 30, null, { cls: 'sec' })}</div>`;
    return o;
  };

  // ─────────── Финансы
  V.fin = function (tab) {
    const s = S(), f = s.fin, F = Sys.fin; tab = tab || UI.tabs.fin;
    const sc = I().score(s);
    let o = C.head('💳 Финансы', 'Банк, кредиты, инвестиции, страхование', true);
    o += `<div class="card gold bankcard"><div class="bc-top"><span>🏦 Городской банк</span><span class="tag ${s.fin.card === 'premium' ? 'gold' : ''}">${I().CARDS[s.fin.card || 'basic'].name}</span></div>
      <div class="bc-sum">${U.num(F.netWorth(s))} <span>₽ капитал</span></div>${C.spark(s.nwHist.slice(-30), 300, 46, { col: 'var(--gold)' })}
      <div class="kpis">${[[U.num(s.money), 'Наличные'], [U.num(s.bank), 'На карте'], [sc, 'Рейтинг · ' + I().scoreLabel(sc)]].map(([v, l]) => `<div class="kpi"><strong>${v}</strong><span>${l}</span></div>`).join('')}</div></div>`;
    o += C.tabs([['overview', 'Обзор'], ['save', 'Вклады'], ['credit', 'Кредиты'], ['invest', 'Биржа'], ['ins', 'Защита']], tab, 'finTab');
    if (!s.account) {
      o += C.row({ icon: '🏦', title: 'Открыть счёт с картой', desc: 'Деньги на счёте не украдут, зарплата приходит на карту, кешбэк с покупок. Нужен паспорт. Деловой район, 09–20.', btn: C.btn('Открыть', 'openAcc', null, null, { cls: 'sm', why: s.docs.passport ? '' : 'Нужен паспорт' }) });
      return o + V.ledger(s);
    }
    if (tab === 'overview') {

    ['⚙️', 'Настройки', 'settings', 'Сохранения, доступность'], ['❓', 'Как играть', 'help', 'Подсказки']];
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* js/ui/sheets.js */
/* Нижние шторки: события, итоги дня, диалоги, собеседование, сон, суммы, рыбалка, подтверждения */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys, UI = SN.UI, C = UI.C;
  const e = U.esc, M = U.money;
  const Sh = UI.sheet = { el: null, queue: [] };
  const S = () => SN.state;

  Sh.isOpen = () => !!Sh.el;
  Sh.open = function (html, o) {
    Sh.close(true);
    o = o || {};
    const w = document.createElement('div');
    w.className = 'sheet-wrap';
    w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
    w.addEventListener('click', ev => { if (ev.target === w && o.closable !== false) Sh.close(); });
    document.body.appendChild(w);
    Sh.el = w; Sh.onClose = o.onClose;
    const f = w.querySelector('[data-focus]') || w.querySelector('button'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 30);
  };
  Sh.body = () => Sh.el && Sh.el.querySelector('.sheet');
  Sh.close = function (silent) {
    if (!Sh.el) return;
    Sh.el.remove(); Sh.el = null;
    const cb = Sh.onClose; Sh.onClose = null;
    if (cb) cb();
    if (!silent) setTimeout(UI.pump, 60);
  };
  Sh.push = fn => { Sh.queue.push(fn); };
  /* Показать следующее из очереди: инфо → итоги дня → события с выбором */
  UI.pump = function () {
    if (Sh.isOpen()) return;
    if (Sh.queue.length) { Sh.queue.shift()(); return; }
    if (S().pending.length) Sh.event();
  };

  Sh.info = function (o) {
    Sh.open(`${o.icon ? `<div class="big-ico">${o.icon}</div>` : ''}<h3 style="justify-content:center">${e(o.title)}</h3><p style="text-align:center">${e(o.text)}</p><button class="btn wide" data-a="sheetClose" data-focus>Понятно</button>`);
  };
  Sh.confirm = function (title, text, yes, label) {
    UI.onConfirm = yes;
    Sh.open(`<h3>${e(title)}</h3><p>${text}</p><div class="btns"><button class="btn sec" data-a="sheetClose">Отмена</button><button class="btn" data-a="confirmYes" data-focus>${e(label || 'Подтвердить')}</button></div>`);
  };

  /* Итоги дня (можно несколько дней подряд после долгого сна/болезни) */
  Sh.days = function (reports) {
    const r = reports[reports.length - 1];
    const bizSum = r.biz.reduce((a, b) => a + b.profit, 0);
    const lines = reports.flatMap(x => x.lines);
    Sh.open(`<h3>🌙 Итоги дня ${r.day}</h3>
      <div class="card gold"><div class="stat3"><div><strong style="color:var(--green)">+${U.num(r.inc)}</strong><span>Доход</span></div><div><strong style="color:var(--red)">−${U.num(r.exp)}</strong><span>Расход</span></div><div><strong>${U.num(S().money + S().bank)}</strong><span>Сейчас ₽</span></div></div></div>
      ${r.biz.length ? `<div class="card"><div class="title">Бизнес: ${bizSum >= 0 ? '+' : ''}${M(bizSum)}</div>${r.biz.map(b => C.kv(b.icon + ' ' + b.name + (b.closed ? ' (простой)' : ''), `<span style="color:${b.profit >= 0 ? 'var(--green)' : 'var(--red)'}">${b.profit >= 0 ? '+' : ''}${U.num(b.profit)} ₽</span>`) + `<div class="desc">${b.cust} клиентов · выручка ${M(b.rev)} · расходы ${M(b.rev - b.profit)} (налог ${M(b.tax)})</div>`).join('')}</div>` : ''}
      ${lines.length ? `<div class="card">${lines.map(l => `<div class="kv" style="display:block;font-size:12.5px">${e(l)}</div>`).join('')}</div>` : ''}
      <p class="desc">Новый день: ${T.dateLabel(S())}, ${D.weatherKinds[S().weather.kind].icon} ${S().weather.temp}°</p>
      <button class="btn wide" data-a="sheetClose" data-focus>Дальше</button>`);
  };

  Sh.event = function () {
    const ev = Sys.events.current(S()); if (!ev) return;
    const s = S();
    const ch = (ev.choices || [{ t: 'Хорошо' }]).map((c, i) => { const l = c.lock ? c.lock(s) : ''; return `<button class="choice" data-a="evChoose" data-x="${i}" ${l ? `aria-disabled="true" data-why="${e(l)}"` : ''}>${e(c.t)}${l ? `<small>${e(l)}</small>` : ''}</button>`; }).join('');
    Sh.open(`<div class="big-ico">${ev.icon}</div><h3 style="justify-content:center">${e(ev.title)}</h3><p>${e(ev.text)}</p>${ch}`, { closable: false });
  };
  Sh.eventResult = function (text) { Sh.open(`<p>${e(text)}</p><button class="btn wide" data-a="sheetClose" data-focus>Дальше</button>`); };

  // ── Диалог с NPC
  Sh.dialog = function (id, greet) {
    const n = D.npcById[id], st = Sys.social.get(S(), id);
    Sh.dlg = { id, log: [{ who: 'npc', t: greet }] };
    Sh.renderDialog(st, n);
  };
  Sh.renderDialog = function () {
    const id = Sh.dlg.id, n = D.npcById[id], st = Sys.social.get(S(), id);
    const chs = Sys.social.choices(S(), id);
    const html = `<div class="npc-head"><div class="thumb">${n.icon}</div><div class="grow"><h3 style="margin:0">${n.name}</h3><div class="desc">${n.role} · ${Sys.social.relLabel(st.rel)} (${Math.round(st.rel)})</div>${C.prog(st.rel, 100)}</div></div>
      <div id="dlgLog">${Sh.dlg.log.slice(-6).map(m => `<div class="bubble ${m.who === 'me' ? 'me' : ''}">${e(m.t)}</div>`).join('')}</div>
      ${chs.map(c => `<button class="choice" data-a="dlg" data-x="${c.i}" ${c.lock ? `aria-disabled="true" data-why="${e(c.lock)}"` : ''}>${e(c.t)}${c.lock ? `<small>${e(c.lock)}</small>` : ''}</button>`).join('')}
      <div class="btns"><button class="btn sec" data-a="sheetClose">Попрощаться</button><button class="btn ghost" data-a="npcFromDlg" data-x="${id}">Карточка</button></div>`;
    if (Sh.isOpen() && Sh.body()) { Sh.body().innerHTML = '<div class="grab"></div>' + html; const lg = Sh.body().querySelector('#dlgLog'); if (lg) lg.lastElementChild && lg.lastElementChild.scrollIntoView({ block: 'nearest' }); }
    else Sh.open(html);
  };
  Sh.dialogChoose = function (i) {
    const id = Sh.dlg.id, def = D.npcById[id].choices[i];
    Sh.dlg.log.push({ who: 'me', t: def.t });
    const r = Sys.social.choose(S(), id, i);
    Sh.dlg.log.push({ who: 'npc', t: r.text });
    UI.after(true);
    Sh.renderDialog();
  };

  // ── Собеседование
  Sh.Q = [
    ['Почему вы хотите работать именно у нас?', [['Хочу стабильности и расти в профессии', 1], ['Честно — нужны деньги, но работать буду на совесть', 0.7], ['Да мне всё равно, где работать', 0]]],
    ['В резюме большой перерыв. Что случилось?', [['Были трудности, сейчас восстанавливаю документы и навыки', 1], ['Долгая история, не хочу об этом', 0.3], ['Работал без оформления, ничего особенного', 0.5]]],
    ['Что будете делать, если не справляетесь с задачей?', [['Спрошу совета у старших и разберусь', 1], ['Буду молча стараться до последнего', 0.5], ['Наверное, уйду', 0]]],
    ['Как относитесь к переработкам?', [['Нормально, если это оговорено и оплачивается', 1], ['Готов работать хоть круглосуточно!', 0.4], ['Ни минуты сверх графика', 0.3]]],
    ['Назовите свою сильную сторону', [['Пунктуальность: ни разу не опоздал на подработку', 1], ['Я лучший во всём', 0.2], ['Не знаю даже', 0]]],
    ['Конфликт с коллегой. Ваши действия?', [['Спокойно поговорю с ним наедине', 1], ['Пожалуюсь начальнику', 0.5], ['Разберёмся по-мужски', 0]]]
  ];
  Sh.interview = function (jobId) {
    const j = D.jobById[jobId], s = S();
    const why = Sys.work.applyCheck(s, j); if (why) return SN.fail(why);
    const qs = Sh.Q.slice().sort(() => Math.random() - 0.5).slice(0, 2);
    Sh.iv = { jobId, qs, ans: [] };
    Sh.renderInterview();
  };
  Sh.renderInterview = function () {
    const iv = Sh.iv, j = D.jobById[iv.jobId], s = S(), k = iv.ans.length;
    let html = `<h3>${j.icon} Собеседование</h3><div class="desc">${j.name} · ${D.districts[j.district].name}. Вид: ${Sys.stats.look(s)}/4, общение ${Math.floor(s.sk.social)}, репутация ${Math.round(s.rep)}</div>`;
    if (k < iv.qs.length) {
      const q = iv.qs[k];
      html += `<div class="bubble">«${q[0]}»</div>` + q[1].slice().sort(() => Math.random() - 0.5).map(a => `<button class="choice" data-a="ivAns" data-x="${a[1]}">${e(a[0])}</button>`).join('');
    } else {
      const score = iv.ans.reduce((a, b) => a + b, 0);
      const p = Sys.work.interviewChance(s, j, score);
      html += `<p>Ответы ${score >= 1.6 ? 'произвели хорошее впечатление' : score >= 1 ? 'нормальные' : 'вызвали сомнения'}. Шанс получить место: <b>${Math.round(p * 100)}%</b>. Собеседование займёт 1 час${s.district !== j.district ? ' + дорога' : ''}.</p>
        <div class="btns"><button class="btn sec" data-a="sheetClose">Не сейчас</button><button class="btn" data-a="ivGo" data-focus>Пройти</button></div>`;
    }
    Sh.open(html);
  };

  // ── Сон
  Sh.sleep = function () {
    const s = S(), opts = Sys.stats.sleepOptions(s);
    const h = T.hourF(s);
    let html = `<h3>🛏️ Где отдохнуть?</h3><p class="desc">Сейчас ${T.clock(s)}. Ночной сон — до 7:00 утра, днём — 8 часов. Энергия ${Math.round(s.st.energy)}.</p>`;
    html += opts.map(o => {
      const why = o.open === false ? o.note : (o.cost && !Sys.econ.canPay(s, o.cost) ? 'Нужно ' + M(o.cost) : '');
      return `<button class="choice" data-a="sleep" data-x="${o.id}" ${why ? `aria-disabled="true" data-why="${e(why)}"` : ''}>${o.icon} ${e(o.name)} — сон ×${String(o.q.toFixed(2)).replace('.', ',')}${o.cost ? ', ' + M(o.cost) : ''}${o.warm ? ', тепло' : ', холодно'}${o.district && o.district !== s.district ? ', ехать: ' + D.districts[o.district].name : ''}${o.id === 'street' && s.money > 600 ? '<small>Риск кражи наличных</small>' : ''}${why ? `<small>${e(why)}</small>` : ''}</button>`;
    }).join('');
    html += `<button class="choice" data-a="act" data-x="nap">😴 Вздремнуть 2 часа (энергия +18)</button><div class="btns"><button class="btn sec" data-a="sheetClose">Отмена</button></div>`;
    Sh.open(html);
  };

  // ── Суммы для финансов
  Sh.AM = {
    toBank: ['Внести на счёт', s => s.money], toCash: ['Снять наличные', s => s.bank], depPut: ['Пополнить вклад', s => s.bank], depTake: ['Снять со вклада', s => Math.floor(s.fin.deposit)],
    loan: ['Взять кредит', s => Sys.fin.loanLimit(s)], repay: ['Погасить кредит', s => Math.min(Math.ceil(s.fin.loan), Sys.econ.available(s))]
  };
  Sh.amount = function (kind) {
    const s = S();
    const fund = kind.startsWith('fund:') ? kind.slice(5) : null;
    const [title, maxf] = fund ? ['Купить: ' + Sys.fin.FUNDS[fund].name, x => x.bank] : Sh.AM[kind];
    const max = Math.max(0, Math.floor(maxf(s)));
    Sh.am = { kind, fund, max };
    const presets = [500, 1000, 5000, 20000].filter(x => x < max);
    Sh.open(`<h3>${e(title)}</h3><p class="desc">Доступно: ${M(max)}</p>
      ${fund ? C.notice('⚠️ ' + Sys.fin.FUNDS[fund].risk + ' Не вкладывайте деньги, которые нужны на еду и жильё.') : ''}
      ${kind === 'loan' ? C.notice('⚠️ Кредит нужно вернуть с процентами за ' + Sys.fin.LOAN_TERM + ' дней. Ставка ~' + Math.round(Sys.fin.loanRate(s) * 36500) + '% годовых.') : ''}
      <input class="field" type="number" inputmode="numeric" min="1" max="${max}" step="1" value="${Math.min(max, presets[presets.length - 1] || max)}" id="amIn" aria-label="Сумма">
      <div class="amount">${presets.map(p => `<button class="btn sec" data-a="amSet" data-x="${p}">${U.num(p)}</button>`).join('')}<button class="btn sec" data-a="amSet" data-x="${max}">Всё</button></div>
      <div class="btns"><button class="btn sec" data-a="sheetClose">Отмена</button><button class="btn" data-a="amGo" data-focus>Подтвердить</button></div>`);
  };

  // ── Рыбалка: маркер бегает по шкале, нужно нажать, когда он в зелёной зоне
  Sh.fishing = function () {
    const f = Sh.fish = { tries: 3, caught: 0, res: [], x: 0, dir: 1, speed: 0.9 + Math.random() * 0.5, zone: 0, w: 0, raf: 0, last: 0 };
    const newZone = () => { f.w = 14 + Math.random() * 10; f.zone = 8 + Math.random() * (84 - f.w); f.speed = 0.9 + Math.random() * 0.8; };
    newZone(); f.newZone = newZone;
    Sh.open(`<h3>🎣 Рыбалка</h3><p class="desc">Нажмите «Подсечь», когда поплавок в зелёной зоне. Три заброса.</p>
      <div class="fish-bar"><div class="fish-zone" id="fz"></div><div class="fish-mark" id="fm"></div></div>
      <div class="fish-res" id="fr" aria-live="polite"></div>
      <button class="btn wide" data-a="fishHook" data-focus style="min-height:56px;font-size:16px">Подсечь!</button>`, { closable: false });
    const zoneEl = document.getElementById('fz'), mark = document.getElementById('fm');
    const paint = () => { zoneEl.style.left = f.zone + '%'; zoneEl.style.width = f.w + '%'; };
    paint(); f.paint = paint;
    const motion = S().settings.motion && !(G.matchMedia && G.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const loop = t => {
      if (!Sh.fish) return;
      const dt = f.last ? Math.min(50, t - f.last) : 16; f.last = t;
      f.x += f.dir * f.speed * dt * (motion ? 0.09 : 0.05);
      if (f.x > 100) { f.x = 100; f.dir = -1; } if (f.x < 0) { f.x = 0; f.dir = 1; }
      mark.style.left = f.x + '%';
      f.raf = requestAnimationFrame(loop);
    };
    f.raf = requestAnimationFrame(loop);
  };
  Sh.fishHook = function () {
    const f = Sh.fish; if (!f || f.tries <= 0) return;
    const hit = f.x >= f.zone && f.x <= f.zone + f.w;
    f.tries--; if (hit) f.caught++;
    f.res.push(hit ? '🐟' : '💨');
    document.getElementById('fr').textContent = f.res.join(' ');
    if (f.tries > 0) { f.newZone(); f.paint(); return; }
    cancelAnimationFrame(f.raf); Sh.fish = null;
    const msg = Sys.fun.fishResult(S(), f.caught);
    UI.after(true);
    Sh.open(`<div class="big-ico">${f.caught ? '🐟' : '🌊'}</div><p style="text-align:center">${e(msg)}</p><div class="btns"><button class="btn sec" data-a="sheetClose">Позже</button>${f.caught ? `<button class="btn" data-a="eatFish">Сварить уху</button>` : ''}</div>`);
  };

  // ── Первый запуск
  Sh.welcome = function () {
    Sh.open(`<div class="big-ico">🌆</div><h3 style="justify-content:center">С НУЛЯ</h3>
      <p>Осень. У вас 340 ₽, потрёпанная куртка и ни одного документа. Город большой — и возможностей в нём больше, чем кажется.</p>
      <p class="desc">Можно учиться и строить карьеру, открыть своё дело, найти друзей и любовь — или просто жить свободно. Голод, холод и усталость реальны, но безвыходных ситуаций нет: соццентр и ночлежка помогут всегда.</p>
      <label class="desc" for="wName">Как зовут героя?</label><input id="wName" class="field" maxlength="24" value="${e(S().hero.name)}" autocomplete="off">
      <button class="btn wide" style="margin-top:12px" data-a="startGame" data-focus>Начать с нуля</button>`, { closable: false });
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/main.js */
/* Точка входа: загрузка сохранения, маршрутизация, делегирование кликов, автосохранение, PWA */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys, UI = SN.UI, V = UI.views, Sh = UI.sheet;
  const $ = id => document.getElementById(id);
  const S = () => SN.state;

  UI.route = 'home'; UI.stack = []; UI.tabs = Object.assign({ career: 'jobs', people: 'contacts' }, UI.tabs || {});
  const NAV = [['home', '🏠', 'Дом'], ['city', '🗺️', 'Город'], ['career', '💼', 'Карьера'], ['people', '👥', 'Люди'], ['more', '▦', 'Ещё']];
  const ROOT = r => r.split(':')[0];
  const navOf = r => { const b = ROOT(r); if (b === 'district') return 'city'; if (b === 'npc') return 'people'; return NAV.some(n => n[0] === b) ? b : 'more'; };

  // ── Тост
  let toastT;
  SN.on('toast', ({ msg, kind }) => {
    if (!msg) return;
    const t = $('toast'); t.textContent = msg; t.className = 'toast on ' + (kind === 'bad' ? 'bad' : kind === 'info' ? 'info' : '');
    clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', kind === 'bad' ? 3200 : 2600);
  });
  SN.on('modal', o => Sh.push(() => Sh.info(o)));
  SN.on('newday', reps => Sh.push(() => Sh.days(reps)));
  SN.on('quest', q => SN.say('✅ Задание выполнено: ' + q.title + ' (+' + ((q.reward || {}).xp || 0) + ' XP)', 'good'));
  SN.on('achievement', a => SN.say('🏆 Достижение: ' + a.name, 'good'));
  SN.on('minigame', k => { if (k === 'fishing') Sh.push(() => Sh.fishing()); });

  // ── Отрисовка
  UI.top = function () {
    const s = S(), L = Sys.quests.level(s), a = Sys.quests.levelXp(L), b = Sys.quests.levelXp(L + 1);
    $('top').innerHTML = `<div class="toprow"><div class="brand">С НУЛЯ<small>СИМУЛЯТОР ЖИЗНИ</small></div>
      <div class="wallet" aria-label="Деньги"><b>${U.num(s.money)} <span>₽</span></b><div>${s.account ? '💳 ' + U.num(s.bank) + ' ₽' : 'без счёта'}${s.fin.loan > 0 ? ' · долг ' + U.num(s.fin.loan) : ''}</div></div></div>
      <div class="topsub"><span class="lvl">УР. ${L}</span><div class="xp" role="progressbar" aria-valuenow="${s.xp}" aria-label="Опыт"><i style="width:${U.clamp((s.xp - a) / (b - a) * 100)}%"></i></div><span class="clock">📅 День ${T.day(s)} · ${T.clock(s)}</span></div>`;
  };
  UI.render = function () {
    const s = S(), r = UI.route, [base, arg] = [ROOT(r), r.split(':')[1]];
    T.ensureWeather(s);
    document.documentElement.classList.toggle('nomotion', !s.settings.motion);
    document.documentElement.classList.toggle('big', !!s.settings.bigText);
    UI.top();
    let html;
    try {
      if (base === 'district') html = V.district(arg);
      else if (base === 'cat') html = V.cat(arg);
      else if (base === 'npc') html = V.npc(arg);
      else if (base === 'career') html = V.career(arg || UI.tabs.career);
      else if (base === 'people') html = V.people(arg || UI.tabs.people);
      else html = (V[base] || V.home)();
    } catch (err) { console.error(err); html = `<div class="notice">Ошибка экрана: ${U.esc(err.message)}. Попробуйте вернуться на главный.</div>` + UI.C.btn('На главный', 'go', 'home'); }
    const c = $('content'); c.innerHTML = `<div class="view">${html}</div>`;
    const nv = navOf(r);
    $('nav').innerHTML = NAV.map(n => `<button class="${nv === n[0] ? 'on' : ''}" data-a="nav" data-x="${n[0]}" aria-current="${nv === n[0] ? 'page' : 'false'}"><span class="ni">${n[1]}</span>${n[2]}${n[0] === 'home' && s.pending.length ? '<i class="dot"></i>' : ''}</button>`).join('');
    document.title = 'С НУЛЯ — День ' + T.day(s);
  };
  UI.go = function (r, keepScroll) {
    if (r !== UI.route) UI.stack.push(UI.route);
    if (UI.stack.length > 30) UI.stack.shift();
    UI.route = r; UI.render();
    if (!keepScroll) G.scrollTo(0, 0);
  };
  UI.save = () => SN.Save.write(S());
  /* После любого действия: сохранить, перерисовать, показать очередь окон */
  UI.after = function (noPump) {
    UI.save();
    const y = G.scrollY; UI.render(); G.scrollTo(0, y);
    if (!noPump) setTimeout(UI.pump, 50);
  };
  const res = r => { if (r && r.msg && !r.ok) { /* сообщение уже в тосте */ } UI.after(); return r; };

  // ── Обработчики действий
  const A = UI.A = {
    nav: x => { UI.stack = []; UI.route = x; UI.render(); G.scrollTo(0, 0); },
    go: x => UI.go(x),
    back: () => UI.go(UI.stack.pop() || 'more', false),
    careerTab: x => { UI.tabs.career = x; UI.route = 'career'; UI.render(); },
    peopleTab: x => { UI.tabs.people = x; UI.route = 'people'; UI.render(); },
    quick: x => { const q = x === 'work' ? Sys.quick.work(S()) : Sys.quick.eat(S()); res(q.run()); },
    sleepSheet: () => Sh.sleep(),
    sleep: x => { Sh.close(true); res(Sys.stats.sleep(S(), x)); },
    act: x => { if (Sh.isOpen()) Sh.close(true); res(Sys.act.run(S(), x)); },
    shift: x => res(Sys.work.shift(S(), x)),
    apply: x => Sh.interview(x),
    ivAns: x => { Sh.iv.ans.push(+x); Sh.renderInterview(); },
    ivGo: () => { const r = Sys.work.interview(S(), Sh.iv.jobId, Sh.iv.ans.reduce((a, b) => a + b, 0)); Sh.close(true); UI.after(true); if (r.msg) Sh.info({ icon: r.hired ? '🤝' : '📞', title: r.hired ? 'Вы приняты!' : 'Отказ', text: r.msg }); },
    study: x => res(Sys.edu.study(S(), x)),
    quit: () => Sh.confirm('Уволиться?', 'Повышения и стаж на этом месте будут потеряны.', () => res(Sys.work.quit(S())), 'Уволиться'),
    travel: x => { const r = Sys.city.travel(S(), x); if (r.ok) SN.say(r.msg, 'good'); res(r); },
    setTransport: x => { S().settings.transport = x; UI.after(); },
    talk: x => { const r = Sys.social.open(S(), x, false); UI.after(true); if (r.ok) Sh.dialog(x, r.greet); },
    call: x => { const r = Sys.social.open(S(), x, true); UI.after(true); if (r.ok) Sh.dialog(x, '📱 ' + r.greet); },
    dlg: x => Sh.dialogChoose(+x),
    npc: x => UI.go('npc:' + x),
    npcFromDlg: x => { Sh.close(true); UI.go('npc:' + x); },
    hang: (x, y) => res(Sys.social.hang(S(), x, y)),
    findNew: () => res(Sys.social.findNew(S())),
    askDate: x => { const r = Sys.social.askDate(S(), x); UI.after(true); if (r.msg) Sh.info({ icon: r.yes ? '💞' : '🙂', title: r.yes ? 'Согласие' : 'Не сейчас', text: r.msg }); },
    couple: x => { const r = Sys.social.proposeCouple(S(), x); UI.after(true); if (r.msg) Sh.info({ icon: r.yes ? '❤️' : '🙂', title: r.yes ? 'Вы пара' : 'Пока нет', text: r.msg }); },
    moveIn: x => { const r = Sys.social.moveIn(S(), x); UI.after(true); if (r.msg && r.ok) Sh.info({ icon: '🏠', title: 'Вместе', text: r.msg }); },
    marry: x => { const r = Sys.social.marry(S(), x); UI.after(true); if (r.msg && r.ok) Sh.info({ icon: r.yes ? '💍' : '🙂', title: r.yes ? 'Свадьба!' : 'Не сейчас', text: r.msg }); },
    breakUp: x => Sh.confirm('Расстаться?', 'Отношения и настроение сильно упадут.', () => res(Sys.social.breakUp(S(), x)), 'Расстаться'),
    home: x => { const h = D.housing[x]; Sh.confirm(h.icon + ' ' + h.name, h.type === 'rent' ? `Оплата ${U.money(h.weekly)} за первую неделю${h.deposit ? ' + залог ' + U.money(h.deposit) : ''}. Дальше — автосписание раз в неделю.` : `Покупка за ${U.money(h.price)}. Коммуналка ${U.money(h.upkeep)} в неделю.`, () => res(Sys.prop.takeHome(S(), x)), h.type === 'rent' ? 'Снять' : 'Купить'); },
    leave: () => Sh.confirm('Освободить жильё?', D.housing[S().housing].type === 'own' ? 'Жильё будет продано за 85% стоимости.' : 'Залог вернётся, если нет долгов.', () => res(Sys.prop.leave(S()))),
    buyItem: x => res(Sys.prop.buyItem(S(), x)),
    sellItem: x => Sh.confirm('Продать ' + D.items[x].name.toLowerCase() + '?', 'Вы получите ' + U.money(D.items[x].price * D.items[x].sell) + '.', () => res(Sys.prop.sellItem(S(), x)), 'Продать'),
    buyClothes: x => res(Sys.prop.buyClothes(S(), x)),
    wear: x => res(Sys.prop.wear(S(), x)),
    look: (x, y) => { const h = S().hero; if (x === 'beard') h.beard = +y; else h[x] = +y; UI.after(); },
    bizOpen: x => { const d = D.bizById[x]; Sh.confirm(d.icon + ' ' + d.name, `Вложение ${U.money(Sys.biz.price(S(), x))}. Аренда ${U.money(d.rent)} в день, налог 6% с выручки. Без персонала точка простаивает.`, () => res(Sys.biz.open(S(), x)), 'Открыть'); },
    bizSet: (x, y) => { const [k, v] = y.split(':'); Sys.biz.set(S(), x, k, +v); UI.after(); },
    bizWork: x => res(Sys.biz.work(S(), x)),
    bizUp: x => res(Sys.biz.upgrade(S(), x)),
    bizSell: x => Sh.confirm('Продать бизнес?', 'Вы получите ' + U.money(Sys.biz.sellValue(S(), Sys.biz.get(S(), x))) + '.', () => res(Sys.biz.sell(S(), x)), 'Продать'),
    openAcc: () => res(Sys.fin.openAccount(S())),
    amount: x => Sh.amount(x),
    amSet: x => { const i = document.getElementById('amIn'); if (i) i.value = x; },
    amGo: () => {
      const v = Math.floor(+document.getElementById('amIn').value || 0), am = Sh.am, s = S();
      if (v <= 0) return SN.fail('Введите сумму');
      const F = Sys.fin;
      const map = { toBank: F.toBank, toCash: F.toCash, depPut: F.depositPut, depTake: F.depositTake, loan: F.takeLoan, repay: F.repay };
      const r = am.fund ? F.buyFund(s, am.fund, v) : map[am.kind](s, v);
      Sh.close(true); if (r.ok && r.msg) SN.say(r.msg, 'good'); res(r);
    },
    sellFund: x => res(Sys.fin.sellFund(S(), x)),
    eatFish: () => { if (Sh.isOpen()) Sh.close(true); res(Sys.fun.eatFish(S())); },
    sellFish: () => res(Sys.fun.sellFish(S())),
    fishHook: () => Sh.fishHook(),
    event: () => Sh.event(),
    evChoose: x => { const r = Sys.events.resolve(S(), +x); Sh.close(true); UI.after(true); if (r.text) Sh.eventResult(r.text); },
    sheetClose: () => Sh.close(),
    confirmYes: () => { const f = UI.onConfirm; UI.onConfirm = null; Sh.close(true); if (f) f(); },
    startGame: () => { const n = (document.getElementById('wName').value || '').replace(/[<>]/g, '').trim().slice(0, 24); if (n) S().hero.name = n; S().flags.welcomed = true; Sh.close(); UI.after(); },
    exportSave: () => {
      if (G.AndroidBridge) { const ok = G.AndroidBridge.saveFile('s-nulya-den-' + T.day(S()) + '.json', SN.Save.exportText(S())); if (!ok) SN.say('Не удалось сохранить файл.', 'bad'); return; }
      const blob = new Blob([SN.Save.exportText(S())], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 's-nulya-den-' + T.day(S()) + '.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      SN.say('Сохранение экспортировано в файл.', 'good');
    },
    copySave: () => { const t = SN.Save.exportText(S()); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => SN.say('Код сохранения скопирован.', 'good'), () => SN.say('Не удалось скопировать — используйте экспорт в файл.', 'bad')); },
    reset: () => Sh.confirm('Начать новую игру?', 'Весь текущий прогресс будет удалён без возможности восстановления.', () => { SN.state = SN.fresh(); UI.stack = []; UI.route = 'home'; UI.after(true); Sh.welcome(); }, 'Начать заново')
  };

  /* Системная кнопка «Назад» в Android-приложении: true — обработано игрой */
  UI.androidBack = function () {
    if (Sh.isOpen()) { if (Sh.fish || (Sys.events.current(S()) && Sh.el.querySelector('[data-a="evChoose"]')) || Sh.el.querySelector('[data-a="startGame"]')) return true; Sh.close(); return true; }
    if (UI.stack.length) { A.back(); return true; }
    if (UI.route !== 'home') { A.nav('home'); return true; }
    UI.save(); return false;
  };

  // ── Делегирование событий
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-a]'); if (!el) return;
    if (el.getAttribute('aria-disabled') === 'true') { SN.say(el.getAttribute('data-why') || 'Недоступно', 'bad'); return; }
    const f = A[el.dataset.a]; if (!f) return;
    ev.preventDefault();
    try { f(el.dataset.x, el.dataset.y, el); } catch (err) { console.error(err); SN.say('Ошибка: ' + err.message, 'bad'); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && Sh.isOpen()) { if (!Sh.fish && !(Sys.events.current(S()) && Sh.el.querySelector('[data-a="evChoose"]'))) Sh.close(); }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-a]')) { ev.preventDefault(); ev.target.click(); }
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.dataset.toggle) { S().settings[t.dataset.toggle] = t.checked; UI.after(); }
    if (t.dataset.change === 'name') { const n = t.value.replace(/[<>]/g, '').trim().slice(0, 24); if (n) { S().hero.name = n; UI.after(); } }
    if (t.dataset.file === 'import' && t.files && t.files[0]) {
      const f = t.files[0];
      if (f.size > SN.Save.MAX) return SN.say('Файл слишком большой.', 'bad');
      const rd = new FileReader();
      rd.onload = () => { try { SN.state = SN.Save.importText(String(rd.result)); UI.stack = []; UI.route = 'home'; UI.after(); SN.say('Сохранение загружено: день ' + T.day(S()), 'good'); } catch (e) { SN.say('Файл сохранения повреждён или не подходит.', 'bad'); } };
      rd.readAsText(f);
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && SN.state) UI.save(); });
  G.addEventListener('pagehide', () => { if (SN.state) UI.save(); });

  // ── Запуск
  function boot() {
    const r = SN.Save.read();
    SN.state = r.state || SN.fresh();
    T.ensureWeather(SN.state);
    Sys.quests.check(SN.state);
    UI.render();
    if (r.warn) SN.say(r.warn, r.source === 'legacy' ? 'info' : 'bad');
    if (!SN.state.flags.welcomed) Sh.welcome(); else UI.pump();
    UI.save();
    // Service Worker — только по HTTPS/localhost (не из file://)
    if (!G.AndroidBridge && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/actions2.js */
/* 0.3: действия новых экранов, шторки сумм, автопилот с анимацией, визуальные эффекты
   (счётчики денег, всплывающие суммы, плавные шкалы, конфетти уровня, смена дня, вибро, «волна» на кнопках) */
(function (G) {
  'use strict';
  const SN = G.SN, U = SN.U, D = SN.D, T = SN.T, Sys = SN.Sys, UI = SN.UI, C = UI.C, A = UI.A, Sh = UI.sheet;
  const e = U.esc, M = U.money, S = () => SN.state;
  const res = r => { UI.after(); return r; };
  const ok = r => { if (r && r.ok && r.msg) SN.say(r.msg, 'good'); return res(r); };

  // ─────────── Шторка суммы (универсальная)
  Sh.amountCfg = function (kind) {
    const s = S(), I = Sys.inv, F = Sys.fin;
    const [k, arg] = kind.split(':');
    const cfg = {
      toBank: { t: 'Внести на карту', max: s.money, go: v => F.toBank(s, v) },
      toCash: { t: 'Снять наличные', max: s.bank, go: v => F.toCash(s, v) },
      depPut: { t: 'Пополнить накопительный счёт', max: s.bank, go: v => F.depositPut(s, v) },
      depTake: { t: 'Снять с накопительного счёта', max: s.fin.deposit, go: v => F.depositTake(s, v) },
      loan: { t: 'Взять кредит', max: F.loanLimit(s), note: '⚠️ Кредит нужно вернуть с процентами за ' + F.LOAN_TERM + ' дней. Ставка ~' + Math.round(F.loanRate(s) * 36500) + '% годовых.', go: v => F.takeLoan(s, v) },
      repay: { t: 'Погасить кредит', max: Math.min(Math.ceil(s.fin.loan), Sys.econ.available(s)), go: v => F.repay(s, v) },
      fund: { t: arg && F.FUNDS[arg] ? 'Купить: ' + F.FUNDS[arg].name : '', max: s.bank, note: arg && F.FUNDS[arg] ? '⚠️ ' + F.FUNDS[arg].risk : '', go: v => F.buyFund(s, arg, v) },
      term: { t: 'Вклад на ' + (I.TERMS[arg] || {}).days + ' дней', max: s.bank, note: 'Минимум 5 000 ₽. Досрочное закрытие — без процентов.', go: v => I.openTerm(s, +arg, v) },
      bond: { t: 'Купить ОФЗ', max: s.bank, note: 'Купон начисляется каждый день, через ' + I.BOND.days + ' дней деньги вернутся.', go: v => I.buyBond(s, v) },
      gold: { t: 'Купить золото', max: s.bank, note: 'Спред 3%: покупка дороже продажи. Золото — для защиты, не для быстрых денег.', go: v => I.buyGold(s, v) },
      stock: { t: arg && D.stockById[arg] ? 'Купить: ' + D.stockById[arg].name : '', max: s.bank, note: arg && D.stockById[arg] ? 'Цена ' + M(I.price(s, arg)) + ' за акцию · комиссия ' + (I.fee(s) * 100).toFixed(1).replace('.', ',') + '%. Акции могут подешеветь.' : '', go: v => I.buyStock(s, arg, v) },
      mort: { t: 'Досрочно погасить ипотеку', max: s.fin.mort[arg] ? Math.min(Math.ceil(s.fin.mort[arg].left), Sys.econ.available(s)) : 0, note: 'Уменьшает ежедневный платёж.', go: v => I.mortRepay(s, +arg, v) }
    }[k];
    return cfg;
  };
  Sh.amount = function (kind) {
    const cfg = Sh.amountCfg(kind); if (!cfg) return;
    const max = Math.max(0, Math.floor(cfg.max));
    Sh.am = { kind, max };
    const presets = [1000, 5000, 20000, 100000, 1000000].filter(x => x < max).slice(-3);
    Sh.open(`<h3>${e(cfg.t)}</h3><p class="desc">Доступно: ${M(max)}</p>${cfg.note ? C.notice(e(cfg.note)) : ''}
      <input class="field big" type="number" inputmode="numeric" min="1" max="${max}" step="1" value="${Math.min(max, presets[presets.length - 1] || max)}" id="amIn" aria-label="Сумма">
      <input type="range" class="range" min="0" max="${max}" step="${Math.max(1, Math.round(max / 200))}" value="${Math.min(max, presets[presets.length - 1] || max)}" id="amRange" aria-label="Ползунок суммы">
      <div class="amount">${presets.map(p => `<button class="btn sec" data-a="amSet" data-x="${p}">${U.num(p)}</button>`).join('')}<button class="btn sec" data-a="amSet" data-x="${Math.floor(max / 2)}">½</button><button class="btn sec" data-a="amSet" data-x="${max}">Всё</button></div>
      <div class="btns"><button class="btn sec" data-a="sheetClose">Отмена</button><button class="btn" data-a="amGo" data-focus>Подтвердить</button></div>`);
    const r = document.getElementById('amRange'), i = document.getElementById('amIn');
    r.addEventListener('input', () => { i.value = r.value; });
    i.addEventListener('input', () => { r.value = i.value; });
  };
  A.amSet = x => { const i = document.getElementById('amIn'), r = document.getElementById('amRange'); if (i) i.value = x; if (r) r.value = x; };
  A.amGo = () => {
    const v = Math.floor(+document.getElementById('amIn').value || 0);
    if (v <= 0) return SN.fail('Введите сумму');
    const cfg = Sh.amountCfg(Sh.am.kind);
    const r = cfg.go(v);
    Sh.close(true); ok(r);
  };

  // ─────────── Новые действия
  Object.assign(A, {
    finTab: x => { UI.tabs.fin = x; UI.route = 'fin'; UI.render(); },
    passiveTab: x => { UI.tabs.passive = x; UI.route = 'passive'; UI.render(); },
    shopTab: x => { UI.tabs.shop = x; UI.route = 'shop'; UI.render(); },
    finSet: (k, v) => { S().fin[k] = +v; UI.after(); },
    setCard: x => ok(Sys.inv.setCard(S(), x)),
    toggleIns: x => ok(Sys.inv.toggleIns(S(), x)),
    closeTerm: i => Sh.confirm('Закрыть вклад досрочно?', 'Начисленные проценты сгорят, вернётся только сумма вклада.', () => ok(Sys.inv.closeTerm(S(), +i)), 'Закрыть'),
    openBroker: () => ok(Sys.inv.openBroker(S())),
    sellStock: (id, f) => ok(Sys.inv.sellStock(S(), id, +f)),
    sellGold: () => ok(Sys.inv.sellGold(S())),
    buyAsset: id => { const d = D.passiveById[id]; Sh.confirm(d.icon + ' ' + d.name, `Цена ${M(d.price)}. Доход ≈ ${M(Sys.inv.netOf(d.inc, d.up))} в день после налога и расходов.${d.rent ? ' Сначала нужно найти арендатора (пара дней).' : ''}`, () => res(Sys.inv.buy(S(), id, false)), 'Купить'); },
    mortAsset: id => { const d = D.passiveById[id], q = Sys.inv.mortQuote(S(), d.price); Sh.confirm('🏦 Ипотека: ' + d.name, `Первый взнос ${M(q.down)}, кредит ${M(q.loan)} на ${q.days} дней. Платёж <b>${M(q.pay)}</b> в день, доход актива ≈ ${M(Sys.inv.netOf(d.inc, d.up))} в день. Просрочка 14 дней — банк заберёт объект.`, () => res(Sys.inv.buy(S(), id, true)), 'Оформить'); },
    homeMort: id => { const h = D.housing[id], q = Sys.inv.mortQuote(S(), h.price); Sh.confirm('🏦 Ипотека: ' + h.name, `Первый взнос ${M(q.down)}, платёж <b>${M(q.pay)}</b> в день ${q.days} дней. Коммуналка ${M(h.upkeep)}/нед. отдельно.`, () => res(Sys.prop.takeHome(S(), id, true)), 'Оформить'); },
    sellAsset: uid => { const u = S().passive.find(x => x.uid === +uid); if (!u) return; Sh.confirm('Продать ' + D.passiveById[u.id].name + '?', 'Вы получите около ' + M(Sys.inv.sellValue(S(), u)) + ' (минус остаток ипотеки, если есть).', () => ok(Sys.inv.sell(S(), +uid)), 'Продать'); },
    refreshAsset: uid => res(Sys.inv.refresh(S(), +uid)),
    perk: id => { const p = D.perkById[id]; if (S().perks.includes(id)) return SN.say(p.icon + ' ' + p.name + ': ' + p.desc, 'info'); Sh.confirm(p.icon + ' ' + p.name, e(p.desc) + '<br><br>Стоимость: ' + '★'.repeat(p.cost), () => { res(Sys.perks.buy(S(), id)); FX.burst(); }, 'Изучить'); },
    buyPoint: () => res(Sys.perks.buyPoint(S())),
    mc: k => res(Sys.perks.masterclass(S(), k)),
    autoSet: (k, v) => { const s = S(); s.settings.auto = Object.assign(Sys.auto.plan(s), { [k]: k === 'maxHours' ? +v : v }); UI.after(); },
    live: days => UI.live(+days),
    liveStop: () => { if (UI.liveCtx) UI.liveCtx.stopReq = true; }
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.dataset.autotoggle) { const s = S(); s.settings.auto = Object.assign(Sys.auto.plan(s), { [t.dataset.autotoggle]: t.checked }); UI.after(); }
    if (t.dataset.fintoggle) { S().fin[t.dataset.fintoggle] = t.checked; UI.after(); }
  });

  // ─────────── Автопилот с анимацией
  UI.live = function (days) {
    if (UI.liveCtx) return;
    if (Sh.isOpen()) Sh.close(true);
    const s = S(), ctx = Sys.auto.begin(s);
    UI.liveCtx = ctx;
    const ov = document.createElement('div');
    ov.className = 'liveov';
    ov.innerHTML = `<div class="live-card"><div class="live-sun"><i></i></div><div class="live-day" id="lvDay">День ${T.day(s)}</div><div class="live-sub" id="lvSub">${T.dateLabel(s)}</div>
      <div class="track live-track"><i id="lvBar" style="width:0%"></i></div><div class="live-money" id="lvMoney">${U.num(s.money + s.bank)} ₽</div>
      <button class="btn sec" data-a="liveStop">Остановить</button></div>`;
    document.body.appendChild(ov);
    const fast = !s.settings.motion;
    let i = 0;
    const step = () => {
      let stop = '';
      try { stop = Sys.auto.day(s, ctx); } catch (err) { console.error(err); stop = 'Ошибка автопилота: ' + err.message; }
      i++;
      const lv = (id) => document.getElementById(id);
      if (lv('lvDay')) { lv('lvDay').textContent = 'День ' + T.day(s); lv('lvSub').textContent = T.dateLabel(s); lv('lvBar').style.width = (i / days * 100) + '%'; lv('lvMoney').textContent = U.num(s.money + s.bank) + ' ₽'; }
      if (stop) ctx.stop = stop;
      if (stop || ctx.stopReq || i >= days) {
        const sum = Sys.auto.end(s, ctx);
        UI.liveCtx = null; ov.classList.add('out'); setTimeout(() => ov.remove(), 250);
        FX.skipDay = true;
        UI.after(true);
        Sh.autoSummary(sum);
        return;
      }
      setTimeout(step, fast ? 0 : Math.max(40, 380 / Math.sqrt(days)));
    };
    setTimeout(step, fast ? 0 : 200);
  };
  Sh.autoSummary = function (r) {
    const d = r.nw1 - r.nw0;
    const stat = k => { const a = Math.round(r.st0[k]), b = Math.round(r.st1[k]); return `<span class="${b >= a ? 'up' : 'down'}">${a}→${b}</span>`; };
    Sh.open(`<div class="big-ico">⏩</div><h3 style="justify-content:center">Прожито ${r.days} ${U.plural(r.days, 'день', 'дня', 'дней')}</h3>
      ${r.stop ? C.notice('⏸ ' + e(r.stop)) : ''}
      <div class="card gold">${C.hero2([['<span style="color:var(--green)">+' + U.num(r.income) + '</span>', 'Доход ₽'], ['<span style="color:var(--red)">−' + U.num(r.spent) + '</span>', 'Расход ₽'], ['<span style="color:' + (d >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (d >= 0 ? '+' : '') + U.num(d) + '</span>', 'Капитал ₽']])}</div>
      <div class="card">${C.kv('💼 Смен и подработок', r.shifts)}${r.studyH ? C.kv('🎓 Часов учёбы', r.studyH) : ''}${C.kv('❤️ Здоровье', stat('health'))}${C.kv('😊 Настроение', stat('mood'))}${C.kv('😣 Стресс', stat('stress'))}</div>
      ${r.warn.length ? `<div class="card warn">${r.warn.map(l => `<div class="desc">${e(l)}</div>`).join('')}</div>` : ''}
      ${r.events.length ? `<div class="card"><div class="title">События</div>${r.events.slice(-8).map(l => `<div class="desc" style="margin-top:5px">${e(l)}</div>`).join('')}</div>` : ''}
      ${r.lines.length ? `<div class="card"><div class="title">Что произошло</div>${r.lines.map(l => `<div class="desc" style="margin-top:5px">${e(l)}</div>`).join('')}</div>` : ''}
      <button class="btn wide" data-a="sheetClose" data-focus>Отлично</button>`);
    FX.vibe([20, 40, 20]);
  };

  // ─────────── Визуальные эффекты
  const FX = UI.FX = { prev: {}, money: null, total: null, level: null, day: null, skipDay: false };
  const motion = () => S().settings.motion && !(G.matchMedia && G.matchMedia('(prefers-reduced-motion: reduce)').matches);
  FX.vibe = p => { try { if (S().settings.vibro && navigator.vibrate) navigator.vibrate(p); } catch (x) { /* нет вибро */ } };
  FX.count = function (el, from, to, fmt, dur) {
    if (!el || from === to || !motion()) return;
    const t0 = performance.now(); dur = dur || 500;
    const tick = t => { const k = Math.min(1, (t - t0) / dur), v = from + (to - from) * (1 - Math.pow(1 - k, 3)); el.textContent = fmt(v); if (k < 1) requestAnimationFrame(tick); };
    el.textContent = fmt(from); requestAnimationFrame(tick);
  };
  FX.float = function (amount) {
    if (!motion() || !amount) return;
    const w = document.querySelector('.wallet'); if (!w) return;
    const r = w.getBoundingClientRect(), f = document.createElement('div');
    f.className = 'float-delta ' + (amount > 0 ? 'pos' : 'neg');
    f.textContent = (amount > 0 ? '+' : '−') + U.num(Math.abs(amount)) + ' ₽';
    f.style.left = (r.right - 10) + 'px'; f.style.top = (r.bottom - 6) + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 1300);
  };
  FX.burst = function (n) {
    if (!motion()) return;
    const box = document.createElement('div'); box.className = 'confetti';
    const cols = ['#f5b54a', '#ffd98a', '#71d8a3', '#8ebfff', '#ff7d7e', '#c3a3ff'];
    for (let i = 0; i < (n || 46); i++) { const p = document.createElement('i'); p.style.left = (Math.random() * 100) + '%'; p.style.background = cols[i % cols.length]; p.style.animationDelay = (Math.random() * 0.25) + 's'; p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px'); p.style.setProperty('--r', (Math.random() * 720) + 'deg'); box.appendChild(p); }
    document.body.appendChild(box); setTimeout(() => box.remove(), 1700);
  };
  FX.dayWipe = function (s) {
    if (!motion()) return;
    const o = document.createElement('div'); o.className = 'daywipe';
    o.innerHTML = `<div><b>День ${T.day(s)}</b><span>${T.dateLabel(s)} · ${D.weatherKinds[s.weather.kind].icon} ${s.weather.temp > 0 ? '+' : ''}${s.weather.temp}°</span></div>`;
    document.body.appendChild(o); setTimeout(() => o.remove(), 1400);
  };
  FX.post = function () {
    const s = S(); if (!s) return;
    // Деньги
    const wb = document.querySelector('.wallet b'), total = s.money + s.bank;
    if (FX.money != null && wb && wb.firstChild && FX.money !== s.money) FX.count(wb.firstChild, FX.money, s.money, v => U.num(v) + ' ');
    if (FX.total != null && Math.round(total) !== Math.round(FX.total) && !UI.liveCtx) { FX.float(total - FX.total); FX.vibe(total > FX.total ? 12 : 6); if (wb) { wb.classList.remove('pulse'); void wb.offsetWidth; wb.classList.add('pulse'); } }
    FX.money = s.money; FX.total = total;
    // Шкалы и числа
    document.querySelectorAll('[data-k]').forEach(el => {
      const k = el.dataset.k, target = el.style.width, prev = FX.prev[k];
      FX.prev[k] = target;
      if (prev != null && prev !== target && motion()) { el.style.transition = 'none'; el.style.width = prev; void el.offsetWidth; el.style.transition = ''; requestAnimationFrame(() => { el.style.width = target; }); }
    });
    document.querySelectorAll('[data-count]').forEach(el => {
      const k = 'c_' + el.dataset.count, v = +el.textContent, prev = FX.prev[k]; FX.prev[k] = v;
      if (prev != null && prev !== v) { FX.count(el, prev, v, x => String(Math.round(x)), 450); el.classList.add(v > prev ? 'up' : 'down'); }
    });
    // Уровень
    const L = Sys.quests.level(s);
    if (FX.level != null && L > FX.level) { FX.burst(); FX.vibe([30, 60, 30]); SN.say('🎉 Новый уровень ' + L + '! +1 очко таланта', 'good'); }
    FX.level = L;
    // Смена дня
    const d = T.day(s);
    if (FX.day != null && d > FX.day && !FX.skipDay && !UI.liveCtx) FX.dayWipe(s);
    FX.day = d; FX.skipDay = false;
  };
  const origRender = UI.render;
  UI.render = function () { origRender(); try { FX.post(); } catch (x) { console.error(x); } };

  // Волна от нажатия и лёгкая вибрация
  document.addEventListener('pointerdown', ev => {
    const b = ev.target.closest('.btn, .quick button, .tile, .choice, .nav button, .pin, .perk');
    if (!b || !motion()) return;
    const r = b.getBoundingClientRect(), w = document.createElement('span');
    w.className = 'ripple'; const sz = Math.max(r.width, r.height) * 1.6;
    w.style.width = w.style.height = sz + 'px'; w.style.left = (ev.clientX - r.left - sz / 2) + 'px'; w.style.top = (ev.clientY - r.top - sz / 2) + 'px';
    b.appendChild(w); setTimeout(() => w.remove(), 520);
  }, { passive: true });
  document.addEventListener('click', ev => { if (ev.target.closest('[data-a]')) FX.vibe(8); }, true);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
