<style>
/* С НУЛЯ — дизайн-система.
   Тёмный графит + золото. Касания ≥ 44px. Анимации 150–250 мс, отключаются настройкой и prefers-reduced-motion. */
:root {
  --bg: #101419; --bg2: #0b0f13; --panel: #1b222b; --panel2: #222c36; --panel3: #2a3540; --line: #36414c; --line2: #ffffff14;
  --ink: #eef1f3; --ink2: #c9d0d6; --mute: #9aa6b2; --dim: #7c8893;
  --gold: #f5b54a; --gold2: #ffd98a; --gold-ink: #241d12;
  --green: #71d8a3; --red: #ff7d7e; --blue: #8ebfff; --purple: #c3a3ff; --orange: #ffb86a; --cyan: #7bd7e8;
  --r-s: 10px; --r-m: 14px; --r-l: 20px;
  --tap: 44px; --dur: .2s;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --fs: 14px;
  color-scheme: dark;
}
html.big { --fs: 16px; }
html.nomotion *, html.nomotion *::before, html.nomotion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg2); }
body { margin: 0; color: var(--ink); background: var(--bg); font: var(--fs)/1.4 var(--font); min-height: 100dvh; overflow-x: hidden; overscroll-behavior-y: contain; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
h1, h2, h3 { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.shell { max-width: 480px; margin: 0 auto; min-height: 100dvh; position: relative; padding-bottom: calc(76px + env(safe-area-inset-bottom)); background: linear-gradient(170deg, #12171d, #0f1318 78%); box-shadow: 0 0 50px #0007; overflow-x: hidden; }
@media (min-width: 700px) { body { background: radial-gradient(ellipse at top, #2c3945, #0b0e11 60%); } .shell { border-inline: 1px solid var(--line2); } }

/* ── Верхняя панель */
.topbar { position: sticky; top: 0; z-index: 20; background: #11171cf0; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line2); padding: calc(10px + env(safe-area-inset-top)) 14px 9px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-weight: 900; font-size: 19px; letter-spacing: 1.5px; color: var(--gold); line-height: 1; }
.brand small { display: block; font-size: 9.5px; letter-spacing: 1.6px; color: #aeb3ba; font-weight: 800; margin-top: 3px; }
.wallet { text-align: right; font-variant-numeric: tabular-nums; }
.wallet b { font-size: 19px; font-weight: 850; }
.wallet b span { font-size: 13px; color: var(--gold); }
.wallet div { font-size: 11px; color: var(--mute); }
.topsub { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; }
.lvl { white-space: nowrap; color: var(--gold2); font-weight: 800; }
.xp { height: 6px; background: #3b424c; border-radius: 9px; flex: 1; overflow: hidden; }
.xp i { display: block; height: 100%; background: linear-gradient(90deg, #efad49, #ffcf70); border-radius: 9px; }
.clock { white-space: nowrap; color: var(--ink2); font-variant-numeric: tabular-nums; }

.main { padding: 14px 14px 0; }
.view { animation: rise var(--dur) ease both; }
@keyframes rise { from { transform: translateY(6px); opacity: .5; } to { transform: none; opacity: 1; } }

/* ── Сцена главного экрана */
.hero { position: relative; height: 312px; border-radius: var(--r-l); overflow: hidden; isolation: isolate; border: 1px solid #46505a; box-shadow: 0 12px 30px #0008; background: #262d33; }
.hero .bg { position: absolute; inset: 0; z-index: -3; background-size: cover; background-position: center 30%; }
.hero .tint { position: absolute; inset: 0; z-index: -2; }
.hero .wx { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.wx.rain { background: repeating-linear-gradient(105deg, transparent 0 9px, #b9d5ff33 9px 10px); background-size: 40px 40px; animation: rain .5s linear infinite; }
.wx.snow, .wx.storm { background-image: radial-gradient(#fff 1.3px, transparent 1.8px), radial-gradient(#fffb 1px, transparent 1.5px), radial-gradient(#fff8 .8px, transparent 1.2px); background-size: 37px 41px, 59px 53px, 23px 29px; background-position: 0 0, 13px 21px, 7px 3px; animation: snow 7s linear infinite; }
.wx.storm { animation-duration: 1.6s; opacity: .9; }
@keyframes rain { to { background-position: -16px 40px; } }
@keyframes snow { to { background-position: 37px 328px, -46px 551px, 30px 377px; } }
.scene-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; padding: 12px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; background: #0f1419c4; border: 1px solid #ffffff2a; border-radius: 99px; padding: 6px 10px; font-size: 11px; font-weight: 750; white-space: nowrap; }
.scene-copy { position: absolute; left: 12px; right: 12px; bottom: 12px; }
.eyebrow { font-size: 10.5px; letter-spacing: 1.2px; color: #ebc380; font-weight: 850; text-transform: uppercase; }
.scene-copy h1 { font-size: 22px; margin: 3px 0 4px; letter-spacing: -.3px; line-height: 1.15; text-shadow: 0 2px 8px #000a; }
.scene-copy p { margin: 0; color: #dfe3e6; font-size: 12px; text-shadow: 0 1px 6px #000c; }
.dayflag { display: flex; gap: 8px; align-items: center; background: #1a1f24d9; border: 1px solid #f5b54a55; border-radius: 12px; padding: 7px 10px; margin-top: 8px; font-size: 12px; color: #ffe2a8; }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.quick button { min-width: 0; min-height: 60px; padding: 8px 4px 7px; border: 1px solid #ffffff26; border-radius: 13px; background: #222b33f0; font-weight: 800; font-size: 12.5px; box-shadow: 0 3px 8px #0004; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.quick button small { font-size: 9.5px; font-weight: 600; color: var(--mute); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 3px; }
.quick button:first-child { background: linear-gradient(140deg, #f1ba63, #c8882d); color: var(--gold-ink); border-color: #ffd080; }
.quick button:first-child small { color: #4a3816; }
.quick .ico { font-size: 19px; line-height: 1.1; }
.avatar-chip { width: 44px; height: 44px; border-radius: 50%; background: #1d252c; border: 2px solid var(--gold); overflow: hidden; flex: none; }
.avatar-chip svg, .avatar-big svg { width: 100%; height: 100%; display: block; }
.skyline { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -3; }
.hero-figure { position: absolute; right: 12px; bottom: 132px; width: 92px; height: 120px; z-index: -1; filter: drop-shadow(0 6px 10px #0009); }

/* ── Общие блоки */
.heading { font-size: 15px; margin: 20px 2px 10px; font-weight: 870; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.heading .muted, .muted { color: var(--mute); font-weight: 500; font-size: 11.5px; }
.card { background: linear-gradient(145deg, #1f2831, #1a222a); border: 1px solid #34404a; border-radius: var(--r-m); padding: 12px; margin-bottom: 9px; box-shadow: 0 4px 10px #0002; }
.card.gold { background: linear-gradient(115deg, #302a20, #24221e); border-color: #6b542f; }
.card.warn { background: linear-gradient(115deg, #3a2224, #24191b); border-color: #7a3c40; }
.card.good { border-color: #2f6d50; }
.card.dim { opacity: .62; }
.row { display: flex; align-items: center; gap: 11px; }
.grow { flex: 1; min-width: 0; }
.thumb { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #3d4954, #202931); font-size: 23px; display: grid; place-items: center; flex: none; border: 1px solid #ffffff14; }
.title { font-size: 13.5px; font-weight: 800; line-height: 1.25; }
.desc { font-size: 11.5px; color: #a7b3bd; line-height: 1.35; margin-top: 2px; }
.meta { font-size: 12px; color: #8ed9a5; font-weight: 800; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.meta .c { color: #e9c483; } .meta .r { color: var(--red); } .meta .m { color: var(--mute); font-weight: 650; }
.why { font-size: 11px; color: #f0a2a2; margin-top: 4px; }
.tag { display: inline-block; padding: 3px 8px; border-radius: 30px; background: #36414b; font-size: 10.5px; font-weight: 750; color: #e7edf2; }
.tag.gold { background: #f6b9571d; color: #ffd287; border: 1px solid #f6b95740; }
.tag.good { color: #8cedbb; background: #1e60474d; }
.tag.bad { color: #ff999a; background: #762d304a; }
.tag.blue { color: #a9ccff; background: #2a466e55; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }

.btn { min-height: var(--tap); min-width: var(--tap); border-radius: 11px; border: 1px solid #c9953c; background: linear-gradient(#f1bb63, #dea044); color: var(--gold-ink); font-weight: 850; padding: 8px 14px; font-size: 13px; transition: transform var(--dur), filter var(--dur); }
.btn:active { transform: scale(.97); }
.btn.sec { background: #34414d; color: #f0f3f5; border-color: #465663; }
.btn.ghost { background: transparent; color: #efc37e; border-color: #735932; }
.btn.bad { background: #5a2a2d; color: #ffd1d1; border-color: #8b4246; }
.btn.sm { padding: 6px 11px; font-size: 12px; }
.btn.wide { width: 100%; }
.btn[aria-disabled="true"], .btn:disabled { opacity: .45; filter: grayscale(.4); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btns .btn { flex: 1 1 auto; }

.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.meter { border: 1px solid #343e48; background: #1b232c; border-radius: 12px; padding: 8px 9px 9px; min-width: 0; }
.meter .mr { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.meter .mr span { font-size: 15px; line-height: 1; }
.meter .mr b { font-size: 15px; font-variant-numeric: tabular-nums; }
.meter .ml { font-size: 10.5px; color: var(--mute); font-weight: 650; margin: 3px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter.low { border-color: #8b3f43; background: #2a1c1f; }
.track { background: #38414a; height: 6px; border-radius: 9px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 9px; transition: width .25s; }

.section-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin: 2px 0 12px; }
.section-head h2 { font-size: 22px; letter-spacing: -.5px; }
.section-head p { color: var(--mute); font-size: 11.5px; margin: 3px 0 0; }
.back { min-height: var(--tap); border: 0; background: none; color: #e8bb6e; font-weight: 800; padding: 0 4px; font-size: 13px; white-space: nowrap; }

.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px 12px; padding: 0 14px 3px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { min-height: var(--tap); border: 1px solid #404a55; background: #202933; color: #aebac5; border-radius: 11px; padding: 0 14px; white-space: nowrap; font-size: 12.5px; font-weight: 750; }
.tab.on { color: var(--gold-ink); border-color: #f6c575; background: #f3bd6b; }

.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.tile { min-height: 92px; text-align: left; padding: 13px 12px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #404952; border-radius: 14px; background: linear-gradient(155deg, #242f3a, #1a232c); font-weight: 780; gap: 6px; }
.tile .ti { font-size: 26px; }
.tile small { display: block; color: #9fadb9; font-size: 11px; font-weight: 500; margin-top: 2px; }
.tile .badge { align-self: flex-start; }

.stat3 { display: flex; gap: 6px; text-align: center; }
.stat3 > div { flex: 1; min-width: 0; }
.stat3 strong { display: block; font-size: 20px; color: #ffc56b; font-variant-numeric: tabular-nums; }
.stat3 span { font-size: 10.5px; color: #9eabb7; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line2); font-size: 13px; }
.kv:last-child { border-bottom: 0; }
.kv b { font-variant-numeric: tabular-nums; text-align: right; }
.prog { height: 5px; background: #38414a; border-radius: 9px; overflow: hidden; margin-top: 6px; }
.prog i { display: block; height: 100%; background: var(--gold); border-radius: 9px; }
.notice { background: #3a2f22; color: #ffda9d; border: 1px solid #7c643f; border-radius: 12px; padding: 10px 12px; font-size: 12px; line-height: 1.45; margin: 0 0 10px; }
.notice.blue { background: #1e2c3d; color: #bcd6ff; border-color: #36547a; }
.footnote { font-size: 11px; color: #85919c; text-align: center; padding: 12px 6px 18px; line-height: 1.45; }
.list-empty { text-align: center; color: var(--mute); padding: 18px; font-size: 12.5px; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 70px; margin-top: 8px; }
.bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; height: 100%; }
.bars i { display: block; border-radius: 3px 3px 0 0; min-height: 1px; }

/* ── Карта */
.map { position: relative; height: 300px; border-radius: 18px; overflow: hidden; border: 1px solid #46505b; background: #253033; }
.map svg.roads { position: absolute; inset: 0; width: 100%; height: 100%; }
.pin { position: absolute; transform: translate(-50%, -50%); border: 1px solid #fff5; background: #26333be8; border-radius: 14px; min-width: 48px; min-height: 48px; display: grid; place-items: center; font-size: 22px; box-shadow: 0 4px 14px #0007; padding: 2px 4px; }
.pin span { font-size: 9px; font-weight: 800; color: #e8edf0; display: block; line-height: 1; margin-top: 1px; white-space: nowrap; }
.pin.here { border-color: var(--gold); background: #4a3a1fe8; box-shadow: 0 0 0 4px #f5b54a33, 0 4px 14px #0007; }
.pin .ppl { position: absolute; top: -6px; right: -6px; font-size: 10px; background: #2b6a4e; border-radius: 9px; padding: 1px 4px; }

/* ── Нижняя навигация */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #12191ff7; border-top: 1px solid #3a434d; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 30; }
.nav button { min-height: 56px; border: 0; background: transparent; color: #8f9aa6; border-radius: 12px; font-size: 10.5px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
.nav button.on { color: #ffcf79; background: #403523; }
.nav .ni { font-size: 22px; line-height: 1; }
.nav .dot { position: absolute; top: 6px; right: 22%; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }

/* ── Тост */
.toast { position: fixed; z-index: 60; left: 50%; transform: translate(-50%, 10px); bottom: calc(84px + env(safe-area-inset-bottom)); max-width: 440px; width: calc(100% - 28px); background: #2f3a37; border: 1px solid #8fb594; box-shadow: 0 10px 40px #0009; border-radius: 13px; padding: 12px 14px; font-weight: 700; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity var(--dur), transform var(--dur); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: #3d2729; border-color: #b8696d; }
.toast.info { background: #26313d; border-color: #5d7ea5; }

/* ── Шторка (модальные окна) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: #000a; display: flex; align-items: flex-end; justify-content: center; animation: fade var(--dur) ease both; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 480px; max-height: 88dvh; overflow-y: auto; background: #182027; border: 1px solid #3c4752; border-bottom: 0; border-radius: 20px 20px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); animation: up var(--dur) ease both; overscroll-behavior: contain; }
@keyframes up { from { transform: translateY(40px); } }
.grab { width: 44px; height: 5px; border-radius: 9px; background: #4a5560; margin: 4px auto 12px; }
.sheet h3 { font-size: 18px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.sheet .big-ico { font-size: 40px; text-align: center; margin: 2px 0 6px; }
.sheet p { color: var(--ink2); font-size: 13.5px; line-height: 1.5; margin: 6px 0 10px; }
.choice { display: block; width: 100%; text-align: left; min-height: var(--tap); padding: 11px 13px; margin-top: 8px; border-radius: 12px; border: 1px solid #485461; background: #222c36; font-weight: 700; font-size: 13px; }
.choice:active { background: #2c3844; }
.choice small { display: block; font-weight: 500; color: #f0a2a2; margin-top: 2px; font-size: 11px; }
.choice[aria-disabled="true"] { opacity: .55; }
.bubble { background: #232e38; border: 1px solid #3a4652; border-radius: 4px 14px 14px 14px; padding: 11px 13px; font-size: 13.5px; line-height: 1.5; color: var(--ink); margin: 6px 0; }
.bubble.me { background: #3a3122; border-color: #6b542f; border-radius: 14px 4px 14px 14px; margin-left: 30px; }
.npc-head { display: flex; gap: 12px; align-items: center; }
.npc-head .thumb { width: 54px; height: 54px; font-size: 30px; }
.amount { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.amount .btn { padding: 6px 4px; font-size: 12px; }
.field { width: 100%; min-height: var(--tap); border-radius: 11px; border: 1px solid #485461; background: #10161b; color: var(--ink); padding: 8px 12px; font: inherit; }
.seg { display: flex; gap: 6px; margin: 6px 0 10px; }
.seg .btn { flex: 1; padding: 6px 4px; font-size: 12px; }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: var(--tap); }
.switch input { width: 48px; height: 44px; margin: 0; accent-color: var(--gold); flex: none; }

/* ── Мини-игра рыбалка */
.fish-bar { position: relative; height: 46px; border-radius: 12px; background: linear-gradient(90deg, #1b3646, #21475e, #1b3646); border: 1px solid #3a6680; overflow: hidden; margin: 14px 0; }
.fish-zone { position: absolute; top: 0; bottom: 0; background: #71d8a355; border-inline: 2px solid #71d8a3; }
.fish-mark { position: absolute; top: 4px; bottom: 4px; width: 6px; margin-left: -3px; background: var(--gold2); border-radius: 3px; box-shadow: 0 0 10px var(--gold); }
.fish-res { display: flex; gap: 8px; justify-content: center; font-size: 26px; min-height: 36px; }

/* ── Аватар-редактор */
.avatar-big { width: 120px; height: 150px; margin: 0 auto 8px; background: radial-gradient(circle at 50% 40%, #2b3843, #161d23); border-radius: 18px; border: 1px solid #47525c; overflow: hidden; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: var(--tap); height: var(--tap); border-radius: 50%; border: 2px solid #fff3; }
.sw.on { border-color: var(--gold); box-shadow: 0 0 0 3px #f5b54a44; }

/* ═════════════ 0.3 — обновлённый дизайн и анимации ═════════════ */
:root { --glass: linear-gradient(150deg, #222c37f2, #19212af2); --ring: 0 0 0 1px #ffffff0d inset; --shadow: 0 8px 24px #0006; --ease: cubic-bezier(.2, .8, .2, 1); }
body { background: radial-gradient(120% 60% at 50% -10%, #1d2732, #101419 60%); }
.shell { background: transparent; }
.topbar { background: linear-gradient(180deg, #121920f5, #11171cf0); box-shadow: 0 6px 20px #0005; }
.brand { background: linear-gradient(90deg, #ffd98a, #f5b54a 60%, #e09a2e); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wallet b { display: inline-block; transition: transform .2s var(--ease); }
.wallet b.pulse { animation: pulse .45s var(--ease); }
@keyframes pulse { 40% { transform: scale(1.12); color: var(--gold2); } }
.xp i { position: relative; overflow: hidden; }
.xp i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #fff8, transparent); transform: translateX(-100%); animation: shine 2.8s ease-in-out infinite; }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }

/* Карточки: стекло, мягкая тень, появление с задержкой */
.card { background: var(--glass); box-shadow: var(--shadow), var(--ring); border-color: #364350; transition: transform .2s var(--ease), border-color .2s; }
.card[role="button"]:active { transform: scale(.985); }
.card.gold { background: linear-gradient(130deg, #3a3020, #262220 60%, #1f2226); border-color: #7a6034; box-shadow: var(--shadow), 0 0 0 1px #f5b54a1a inset; }
.card.good { border-color: #2f6d50; background: linear-gradient(150deg, #1e2f2b, #19222a); }
.view > * { animation: rise .32s var(--ease) both; }
.view > *:nth-child(2) { animation-delay: .03s; } .view > *:nth-child(3) { animation-delay: .06s; } .view > *:nth-child(4) { animation-delay: .09s; }
.view > *:nth-child(5) { animation-delay: .12s; } .view > *:nth-child(6) { animation-delay: .15s; } .view > *:nth-child(7) { animation-delay: .18s; } .view > *:nth-child(n+8) { animation-delay: .2s; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.heading { position: relative; padding-left: 10px; }
.heading::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 3px; background: linear-gradient(var(--gold2), var(--gold)); }
.thumb { background: radial-gradient(circle at 30% 25%, #4a5866, #232d36); box-shadow: 0 3px 8px #0005, var(--ring); }
.thumb.glow { background: radial-gradient(circle at 30% 25%, #ffcf79, #b97a24); box-shadow: 0 0 18px #f5b54a55; }

/* Кнопки: блик и волна */
.btn, .quick button, .tile, .choice, .nav button, .pin, .perk { position: relative; overflow: hidden; }
.btn { box-shadow: 0 3px 10px #0004, inset 0 1px 0 #ffffff40; }
.btn.sec { box-shadow: 0 2px 8px #0003, inset 0 1px 0 #ffffff14; }
.btn:hover { filter: brightness(1.06); }
.ripple { position: absolute; border-radius: 50%; background: #ffffff38; transform: scale(0); animation: ripple .5s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
.tile { transition: transform .2s var(--ease), border-color .2s; box-shadow: var(--shadow), var(--ring); }
.tile:active { transform: scale(.97); }
.tile .ti { display: inline-block; transition: transform .3s var(--ease); }
.tile:hover .ti { transform: scale(1.15) rotate(-6deg); }
.choice.on { border-color: var(--gold); background: linear-gradient(130deg, #3a3020, #252a30); box-shadow: 0 0 0 1px #f5b54a33 inset; }
.choice small.ok { color: var(--mute); }
.col { display: flex; flex-direction: column; gap: 6px; flex: none; }

/* Нижняя навигация */
.nav { background: linear-gradient(180deg, #141b22f2, #0f1419fa); box-shadow: 0 -8px 24px #0006; }
.nav button { transition: color .2s, background .25s var(--ease); }
.nav button .ni { transition: transform .3s var(--ease); }
.nav button.on { background: linear-gradient(160deg, #4a3b22, #352b1c); box-shadow: inset 0 1px 0 #ffffff14; }
.nav button.on .ni { transform: translateY(-2px) scale(1.12); animation: hop .4s var(--ease); }
@keyframes hop { 40% { transform: translateY(-6px) scale(1.18); } }

/* Шкалы */
.meter { background: linear-gradient(160deg, #1f2832, #1a222b); box-shadow: var(--ring); transition: border-color .3s; }
.meter .mi { display: inline-block; }
.meter.low .mi { animation: wobble 1.6s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-6deg); } }
.track i { transition: width .7s var(--ease); position: relative; }
.meter b.up { color: var(--green); transition: color 1s; } .meter b.down { color: var(--red); transition: color 1s; }
.prog i { transition: width .7s var(--ease); background: linear-gradient(90deg, #e09a2e, #ffd98a); }

/* Сцена: читаемость текста и живая атмосфера */
.scene-copy::before { content: ''; position: absolute; left: -12px; right: -12px; top: -46px; bottom: -12px; z-index: -1; background: linear-gradient(180deg, transparent, #0a0e15b8 30%, #0a0e15ee 70%); }
.scene-copy h1 { text-shadow: 0 2px 12px #000, 0 0 2px #000; }
.eyebrow { text-shadow: 0 1px 6px #000; }
.hero .bg { animation: kenburns 24s ease-in-out infinite alternate; }
@keyframes kenburns { to { transform: scale(1.08) translate(-1.5%, 1%); } }
.hero-figure svg { transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scaleY(1.018) translateY(-1px); } }
.skyline .tw { animation: flicker 7s steps(1) infinite; }
@keyframes flicker { 0%, 100% { opacity: .9; } 30% { opacity: .15; } 55% { opacity: .9; } 80% { opacity: .35; } }
.stars { position: absolute; inset: 0 0 45% 0; z-index: -2; background-image: radial-gradient(#fff 1px, transparent 1.4px), radial-gradient(#fffa .8px, transparent 1.2px); background-size: 53px 41px, 31px 37px; background-position: 7px 9px, 19px 23px; animation: twinkle 4s ease-in-out infinite alternate; pointer-events: none; }
@keyframes twinkle { to { opacity: .45; } }
.clouds { position: absolute; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
.clouds i { position: absolute; width: 120px; height: 34px; border-radius: 40px; background: #ffffffa0; filter: blur(6px); animation: drift 38s linear infinite; }
.clouds i:nth-child(1) { top: 16%; left: -30%; } .clouds i:nth-child(2) { top: 30%; left: -60%; width: 170px; animation-duration: 52s; opacity: .7; } .clouds i:nth-child(3) { top: 8%; left: -90%; width: 90px; animation-duration: 44s; }
.clouds.warm i { background: #ffb08a80; }
@keyframes drift { to { transform: translateX(170vw); } }
@media (min-width: 480px) { @keyframes drift { to { transform: translateX(800px); } } }
.birds { position: absolute; top: 18%; left: -15%; width: 60px; z-index: -1; fill: none; stroke: #1f2730; stroke-width: 1.6; animation: fly 26s linear infinite; }
@keyframes fly { to { transform: translate(560px, -30px); } }
.quick button { transition: transform .15s var(--ease); }
.quick button:active { transform: scale(.95); }
.quick button:first-child { box-shadow: 0 6px 18px #f5b54a44, inset 0 1px 0 #fff6; }
.quick .ico { transition: transform .3s var(--ease); }
.quick button:hover .ico { transform: scale(1.18) rotate(-8deg); }

/* Панель автопилота и полоса денег */
.autopanel { background: linear-gradient(130deg, #24303d, #1b232c); border-color: #3e5163; margin-top: 10px; }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.seg3 .btn { padding: 8px 4px; }
.money-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }
.money-strip button { min-height: 58px; border-radius: 13px; border: 1px solid #3a4652; background: var(--glass); padding: 8px 6px; text-align: left; box-shadow: var(--ring); }
.money-strip b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.money-strip b.pos { color: var(--green); }
.money-strip span { font-size: 10px; color: var(--mute); }

/* KPI и банковская карта */
.kpis { display: flex; gap: 6px; text-align: center; }
.kpis .kpi { flex: 1; min-width: 0; }
.kpi strong { display: block; font-size: 18px; color: #ffc56b; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>/* js/core/util.js */
/* С НУЛЯ — утилиты, шина событий, детерминированный ГПСЧ */
(function (G) {
  'use strict';
  const SN = G.SN = G.SN || {};
  SN.VERSION = '0.3.0';
  SN.SAVE_VERSION = 3;
  SN.D = SN.D || {};      // данные
  SN.Sys = SN.Sys || {};  // игровые системы

  const U = SN.U = {};
  U.clamp = (x, a = 0, b = 100) => Math.max(a, Math.min(b, x));
  U.num = x => Math.round(x).toLocaleString('ru-RU');
  U.money = x => (x < 0 ? '−' : '') + Math.abs(Math.round(x)).toLocaleString('ru-RU') + ' ₽';
  U.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.pick = (s, arr) => arr[Math.floor(U.rand(s) * arr.length)];
  U.hrs = h => { const m = Math.round(h * 60); return m < 60 ? m + ' мин' : (m % 60 ? (m / 60).toFixed(1).replace('.', ',') : m / 60) + ' ч'; };
  U.plural = (n, a, b, c) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; };

  /* mulberry32 — состояние ГПСЧ хранится в сохранении, поэтому
     переходы дней и случайные события воспроизводимы после перезагрузки */
  U.rand = function (s) {
    s.rng = (s.rng + 0x6D2B79F5) | 0;
    let t = s.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  U.randRange = (s, a, b) => a + (b - a) * U.rand(s);
  U.chance = (s, p) => U.rand(s) < p;
  U.gauss = s => { let u = 0, v = 0; while (!u) u = U.rand(s); v = U.rand(s); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  /* FNV-1a для контроля целостности сохранений */
  U.hash = function (str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(16).padStart(8, '0');
  };

  /* Шина событий: системы не знают о DOM, интерфейс подписывается */
  const subs = {};
  SN.on = (ev, fn) => (subs[ev] = subs[ev] || []).push(fn);
  /* mute — автопилот: интерфейсные события копятся и отдаются сводкой */
  let muted = 0, mutedLog = [];
  const MUTABLE = { toast: 1, modal: 1, newday: 1, quest: 1, achievement: 1, minigame: 1 };
  SN.mute = on => { if (on) { muted++; return []; } muted = Math.max(0, muted - 1); const l = mutedLog; if (!muted) mutedLog = []; return l; };
  SN.emit = (ev, data) => { if (muted && MUTABLE[ev]) { if (ev !== 'toast') mutedLog.push({ ev, data }); return; } (subs[ev] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } }); };
  SN.perk = (s, id) => !!(s.perks && s.perks.indexOf(id) >= 0);
  SN.say = (msg, kind) => SN.emit('toast', { msg, kind: kind || 'info' });
  SN.fail = msg => { SN.say(msg, 'bad'); return { ok: false, msg }; };
  SN.okr = msg => ({ ok: true, msg });
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>/* js/data/npcs.js */
/* Жители города. У каждого — характер, цель, расписание, память о поступках игрока.
   Диалог устроен как «хаб»: реплика NPC + варианты; выбор меняет отношения, флаги и мир.
   choice: { t, show(s,n)→bool, lock(s,n)→'причина', run(s,n,api)→'ответ' | {text,end} } */
(function (G) {
  'use strict';
  const SN = G.SN, D = SN.D, U = SN.U;
  const wd = (s) => SN.T.dateOf(SN.T.day(s)).wd;
  const h = (s) => SN.T.hourF(s);
  const tier = n => n.rel >= 60 ? 2 : n.rel >= 25 ? 1 : 0;

  D.npcs = [
    {
      id: 'nina', name: 'Нина Петровна', icon: '👩‍🦳', role: 'Социальный работник', age: 54,
      bio: 'Двадцать лет в соццентре Старого района. Строгая, но никого не бросает. Мечтает открыть при центре мастерские для взрослых.',
      goal: 'Открыть мастерские при соццентре', likes: ['честность', 'порядок'],
      where: s => (wd(s) < 5 && h(s) >= 9 && h(s) < 18) ? 'old' : null,
      greet: ['Проходи, садись. Чай будешь? С чем пришёл?', 'А, это ты. Рассказывай, как продвигается.', 'Рада тебя видеть. Ты молодец, правда.'],
      choices: [
        { t: 'Мне нужна помощь. С чего начать?', show: (s, n) => !n.mem.intro,
          run: (s, n) => { n.mem.intro = true; s.flags.ninaMet = true; return 'Первым делом — документы. Без паспорта ни работы, ни жилья, ни банка. Я дам направление в МФЦ — пошлину за тебя оплатит центр. Пока ждёшь: обед у нас бесплатный с 12 до 15, душ и стирка — каждый день, медпункт по будням. Вещи по сезону выдаём в пункте помощи.'; } },
        { t: 'Можно направление на паспорт?', show: (s, n) => n.mem.intro && !s.flags.ninaReferral && !s.docs.passport,
          run: (s, n, api) => { s.flags.ninaReferral = true; api.rel(4); return 'Вот, держи бумагу. Иди в МФЦ в Центре — подашь заявление бесплатно, паспорт будет через пять дней. И не потеряй в этот раз!'; } },
        { t: 'Как найти работу без опыта?', show: (s, n) => n.mem.intro,
          run: (s, n) => s.docs.passport
            ? 'С паспортом уже можно на склад грузчиком или в центр занятости — там бесплатные курсы кассира. Ещё у нас курс компьютерной грамотности, без него в офис не возьмут.'
            : 'Пока без паспорта — сдача вторсырья, листовки, разгрузка в Промзоне. Там платят сразу. Только не соглашайся на «лёгкие заработки» — это всегда обман.' },
        { t: 'Расскажите про мастерские, о которых вы мечтаете', show: (s, n) => n.rel >= 30 && !n.mem.dream,
          run: (s, n, api) => { n.mem.dream = true; api.rel(5); return 'Хочу, чтобы люди здесь не только ели и мылись, а учились руками работать. Помещение есть, инструментов нет. Если когда-нибудь встанешь на ноги — вспомни про нас.'; } },
        { t: 'Пожертвовать центру на мастерские (10 000 ₽)', show: (s, n) => n.mem.dream && !n.mem.donated,
          lock: s => SN.Sys.econ.canPay(s, 10000) ? '' : 'Нужно 10 000 ₽',
          run: (s, n, api) => { SN.Sys.econ.pay(s, 10000, 'gift', 'Пожертвование соццентру'); n.mem.donated = true; api.rel(20); s.rep = U.clamp(s.rep + 12); s.flags.donated = true; return 'Нина Петровна долго молчит, потом обнимает тебя. «Знаешь, ради таких дней я тут и работаю». Через неделю в соцсетях района пишут о новой мастерской.'; } }
      ]
    },
    {
      id: 'seryoga', name: 'Серёга', icon: '🧔', role: 'Знакомый по улице, бывший сварщик', age: 41,
      bio: 'Сварщик шестого разряда, потерял работу и квартиру после развода. Не пьёт уже полгода. Хочет вернуться в профессию и увидеться с дочкой Алёной.',
      goal: 'Вернуться в профессию и помириться с дочерью', likes: ['надёжность', 'юмор'],
      where: s => h(s) >= 7 && h(s) < 21 ? (h(s) < 13 ? 'industrial' : 'old') : null,
      greet: ['Здорово! Как сам? Холодно сегодня, а?', 'О, братишка. Есть разговор — садись.', 'Кого я вижу! Ты прям в гору пошёл, рад за тебя.'],
      choices: [
        { t: 'Где сейчас платят нормально?', run: (s, n, api) => {
            if (n.rel >= 20 && !s.flags.tipLabor) { s.flags.tipLabor = true; api.rel(2); return 'Слушай, на стройке в Промзоне подсобников берут. Платят две тыщи за смену. Но покрепче надо быть — физуха хотя бы 15. Потаскай пока фуры, подкачаешься.'; }
            return U.pick(s, ['Фуры разгружать в Промзоне — почти тыщу за три часа. Тяжко, но честно.', 'На автомойке берут без вопросов. Руки мёрзнут, зато наличкой.', 'Листовки в Центре раздают, но там гроши. Лучше уж вторсырьё сдавать.']);
          } },
        { t: 'Как ты оказался на улице?', show: (s, n) => n.rel >= 20 && !n.mem.story,
          run: (s, n, api) => { n.mem.story = true; api.rel(6); return 'Развод, долги, потом завод закрыли. Квартира была женина. Я в запой ушёл — полгода не помню. Очнулся в ночлежке. Нина Петровна меня вытащила. Дочке сейчас двенадцать… Хочу ей показаться нормальным человеком, понимаешь?'; } },
        { t: 'Одолжить Серёге 1 000 ₽ на спецовку', show: (s, n) => n.mem.story && !n.mem.lent,
          lock: s => SN.Sys.econ.canPay(s, 1000) ? '' : 'Нужно 1 000 ₽',
          run: (s, n, api) => { SN.Sys.econ.pay(s, 1000, 'gift', 'В долг Серёге'); n.mem.lent = SN.T.day(s); api.rel(12); return 'Серёга смотрит на деньги, потом на тебя. «Верну. Слово даю». Через пару дней он устраивается на завод.'; } },
        { t: 'Ну что, как на заводе?', show: (s, n) => n.mem.lent && SN.T.day(s) - n.mem.lent >= 5 && !n.mem.repaid,
          run: (s, n, api) => { n.mem.repaid = true; SN.Sys.econ.earn(s, 1500, 'gift', 'Серёга вернул долг'); api.rel(10); s.flags.seryogaFactory = true; return 'Работаю! Варю трубы, мастер хвалит. Держи полторы — тысячу долга и пятьсот сверху, не спорь. И знаешь… я Алёне позвонил. В субботу идём в кино.'; } },
        { t: 'Есть что перекусить? Совсем на мели', show: (s) => s.money < 100 && s.st.food < 40,
          lock: (s, n) => n.mem.fedDay === SN.T.day(s) ? 'Сегодня уже выручал' : (n.rel < 10 ? 'Пока мало знакомы' : ''),
          run: (s, n) => { n.mem.fedDay = SN.T.day(s); SN.Sys.stats.apply(s, { food: 25 }); return 'Серёга молча делит пополам батон и банку тушёнки. «Не благодари. Сегодня ты, завтра я».'; } }
      ]
    },
    {
      id: 'valera', name: 'Валера', icon: '👨‍🔧', role: 'Механик из гаражей', age: 47,
      bio: 'Чинит всё, что ездит, в гаражах Промзоны. Ворчливый, но справедливый. Мечтает легализоваться и открыть настоящую мастерскую.',
      goal: 'Открыть официальную мастерскую', likes: ['руки из правильного места', 'пунктуальность'],
      where: s => (wd(s) < 6 && h(s) >= 8 && h(s) < 19) ? 'industrial' : null,
      greet: ['Чего надо? А, ты… Подай ключ на тринадцать, раз пришёл.', 'Здоров. Работы полно — руки нужны.', 'О, мой лучший подмастерье пожаловал!'],
      choices: [
        { t: 'Можно помочь в гараже? Хочу научиться', run: (s, n, api) => {
            if (s.st.energy < 15) return { text: 'Ты на ногах еле стоишь. Иди поешь, потом приходи.' };
            api.time(120); s.st.energy = U.clamp(s.st.energy - 10); SN.Sys.stats.gain(s, { craft: n.rel >= 30 ? 2.5 : 1.5 }); api.rel(3);
            if (n.rel >= 20) { SN.Sys.econ.earn(s, 400, 'work', 'Валера: за помощь'); return 'Два часа возились с подвеской «Нивы». «Держи четыреста, заслужил. Руки у тебя растут откуда надо»'; }
            return 'Два часа подаёшь ключи и держишь фонарик. Валера показывает, как снимать суппорт. Ремесло растёт.';
          } },
        { t: 'Зачем тебе своя мастерская?', show: (s, n) => n.rel >= 30 && !n.mem.dream,
          run: (s, n, api) => { n.mem.dream = true; api.rel(5); return 'Надоело прятаться от проверок. Хочу вывеску, кассу, нормальных клиентов. Но я в бумагах — ноль. ИП, налоги… Вот если бы кто с головой взялся, я бы в долю пошёл.'; } },
        { t: 'Давай откроем мастерскую вместе', show: (s, n) => n.mem.dream && !n.mem.partner,
          lock: s => s.docs.ip ? '' : 'Нужно зарегистрировать ИП',
          run: (s, n, api) => { n.mem.partner = true; s.flags.valeraPartner = true; api.rel(15); return 'Валера вытирает руки и протягивает ладонь. «По рукам. Я приведу клиентов — мастерская у тебя откроется с хорошей репутацией. И оборудование достану со скидкой». (Мастерская ремонта: −30% к цене, стартовая репутация 60)'; } },

<script>/* js/data/events.js */
/* Случайные и сезонные события с выбором. when(s) — условие, w — вес, choices — варианты с последствиями.
   Каждый вариант честно сообщает результат; нет «ловушек» без возможности восстановиться. */
(function (G) {
  'use strict';
  const SN = G.SN, D = SN.D, U = SN.U;
  const E = () => SN.Sys.econ, St = () => SN.Sys.stats;
  const T = { advance: (...a) => SN.T.advance(...a), day: s => SN.T.day(s) };

  D.events = [
    { id: 'wallet', icon: '👛', title: 'Найденный кошелёк', w: 3, when: s => true,

      choices: [
        { t: 'Найти хозяйку по пропуску и вернуть', run: s => { T.advance(s, 90, {}); s.rep = U.clamp(s.rep + 8); St().apply(s, { mood: 10 }); s.flags.honest = (s.flags.honest || 0) + 1;
          if (U.chance(s, 0.6)) { E().earn(s, 1000, 'gift', 'Благодарность за кошелёк'); return 'Ирина чуть не расплакалась и настояла на тысяче в благодарность. По району пошёл слух о честном человеке. Репутация +8.'; }
          return 'Ирина долго благодарит. Денег вы не взяли, но на душе тепло. Репутация +8.'; } },
        { t: 'Сдать в отделение полиции', run: s => { T.advance(s, 60, { indoor: true }); s.rep = U.clamp(s.rep + 4); return 'Дежурный записал ваши данные. Репутация +4.'; } },
        { t: 'Забрать деньги, кошелёк выбросить', run: s => { E().earn(s, 3000, 'other', 'Чужой кошелёк'); s.rep = U.clamp(s.rep - 6); St().apply(s, { stress: 12 }); s.flags.tookWallet = true; return '+3 000 ₽. Но мысль о чужом пропуске не даёт покоя. Стресс +12, репутация −6.'; } }
      ] },
    { id: 'scam', icon: '🎣', title: '«Лёгкий заработок»', w: 3, when: s => s.money + s.bank > 1500,
      text: 'Незнакомец предлагает «работу курьером»: 15 000 ₽ за день, нужно только оплатить «страховку» 2 000 ₽ и ничего не спрашивать.',
      choices: [
        { t: 'Отказаться — это мошенничество', run: s => { St().gain(s, { finance: 1 }); s.flags.scamAvoided = (s.flags.scamAvoided || 0) + 1; return 'Правильно. Такие «курьеры» либо теряют деньги, либо становятся соучастниками преступлений. Финансы +1.'; } },
        { t: 'Согласиться и заплатить 2 000 ₽', lock: s => E().canPay(s, 2000) ? '' : 'Нет 2 000 ₽',
          run: s => { E().pay(s, 2000, 'other', '«Страховка»'); St().apply(s, { mood: -15, stress: 15 }); return 'Номер больше не отвечает. 2 000 ₽ потеряны. Тяжёлый, но важный урок.'; } }
      ] },
    { id: 'prices', icon: '📈', title: 'Цены выросли', w: 2, when: s => s.prices === 1,
      text: 'Поставщики подняли цены — продукты и услуги в городе подорожали на 8% на ближайшие 7 дней.',
      choices: [{ t: 'Понятно, буду экономить', run: s => { s.prices = 1.08; s.priceDays = 7; return 'Ищите бесплатные обеды и готовьте дома — так дешевле.'; } }] },
    { id: 'sale', icon: '🏷️', title: 'Распродажа одежды', w: 2, when: s => true,
      text: 'В торговом центре распродажа: только сегодня одежда −30%, вещи −25%.',
      choices: [{ t: 'Отлично, загляну', run: s => { s.flags.discountDay = T.day(s); return 'Скидка действует до полуночи (раздел «Персонаж» и «Имущество»).'; } }] },
    { id: 'interview', icon: '📞', title: 'Приглашение на собеседование', w: 3, when: s => s.docs.passport && !s.job,
      text: 'Звонит рекрутер: вас рекомендовали знакомые. Следующее собеседование пройдёт с заметным преимуществом.',
      choices: [{ t: 'Спасибо, подготовлюсь', run: s => { s.flags.interviewBonus = true; return 'Шанс на следующем собеседовании +15%.'; } }] },
    { id: 'friendhelp', icon: '🤝', title: 'Помощь знакомого', w: 2, when: s => SN.Sys.social.get(s, 'seryoga').rel >= 30 && s.money < 500,
      text: 'Серёга находит вас: «Держи, мне на складе премию дали. Отдашь, когда сможешь».',
      choices: [
        { t: 'Взять 800 ₽ взаймы', run: s => { E().earn(s, 800, 'gift', 'Серёга выручил'); s.flags.oweSeryoga = 800; SN.Sys.social.get(s, 'seryoga').rel += 3; return 'Друзья познаются в беде.'; } },
        { t: 'Отказаться: «Справлюсь сам»', run: s => { St().apply(s, { mood: 3 }); return 'Серёга хлопает по плечу: «Уважаю».'; } }

    { id: 'goodgig', icon: '⭐', title: 'Срочная подработка', w: 3, when: s => s.st.energy > 40 && SN.T.hour(s) < 16,
      text: 'Знакомый прораб: нужно срочно разгрузить стройматериалы. 6 часов, 3 200 ₽ наличными сразу.',
      choices: [
        { t: 'Согласиться (6 ч)', lock: s => s.st.energy >= 35 ? '' : 'Мало энергии',
          run: s => { s.st.energy = U.clamp(s.st.energy - 30); T.advance(s, 360, {}); E().earn(s, 3200, 'work', 'Срочная разгрузка'); St().gain(s, { physical: 2 }); s.c.gigs++; return '+3 200 ₽. Спина ноет, но кошелёк рад.'; } },
        { t: 'Отказаться', run: () => 'Прораб найдёт кого-нибудь другого.' }

    { id: 'phonebroke', icon: '📵', title: 'Телефон сломался', w: 2, when: s => s.items.includes('phone') && !s.flags.phoneBroken,
      text: 'Телефон упал в лужу и не включается. Без него не работают курьерские приложения и звонки.',
      choices: [
        { t: 'Сдать в ремонт (1 300 ₽)', lock: s => E().canPay(s, 1300) ? '' : 'Нет 1 300 ₽', run: s => { E().pay(s, 1300, 'items', 'Ремонт телефона'); return 'Мастер починил за час.'; } },
        { t: 'Попросить Валеру посмотреть', run: s => { s.flags.phoneBroken = true; return 'Загляните к Валере в Промзону (нужны отношения 25). Пока телефон не работает.'; } },
        { t: 'Пока походить без телефона', run: s => { s.flags.phoneBroken = true; return 'Телефон не работает. Отремонтируйте у Валеры или купите новый.'; } }

    { id: 'bikestolen', icon: '🚲', title: 'Пропал велосипед', w: 1, when: s => s.items.includes('bike') && s.housing === 'street',
      text: 'Утром велосипеда на месте нет. Замок перекушен.',
      choices: [
        { t: 'Заявить в полицию (2 ч)', run: s => { T.advance(s, 120, { indoor: true }); if (U.chance(s, 0.35)) return 'Через день велосипед нашли во дворе по соседству!'; s.items = s.items.filter(i => i !== 'bike'); return 'Заявление приняли, но шансов мало. Велосипед потерян.'; } },
        { t: 'Смириться', run: s => { s.items = s.items.filter(i => i !== 'bike'); St().apply(s, { mood: -10 }); return 'Жильё с замком решило бы проблему.'; } }
      ] },
    { id: 'police', icon: '👮', title: 'Проверка документов', w: 2, when: s => !s.docs.passport && SN.T.day(s) > 2,
      text: 'Патруль просит предъявить документы. Паспорта у вас нет.',
      choices: [{ t: 'Объяснить ситуацию', run: s => { T.advance(s, 90, { indoor: true }); s.flags.ninaMet = true;
        return s.flags.ninaReferral || s.docsPending.passport ? 'Показали направление из соццентра — отпустили через полтора часа.' : 'Полтора часа в отделении. Дежурный дал адрес соцработника: Нина Петровна, соццентр Старого района — она помогает восстановить паспорт.'; } }] },
    { id: 'shelterfight', icon: '🥊', title: 'Конфликт в ночлежке', w: 2, when: s => (s.flags.shelterNights || 0) > 0 && s.housing === 'street',
      text: 'Ночью двое отнимают у пожилого соседа куртку.',
      choices: [
        { t: 'Вмешаться', run: s => { if (U.chance(s, 0.5 + s.sk.physical / 200)) { s.rep = U.clamp(s.rep + 6); return 'Хулиганы отступили. Старик благодарит. Репутация +6.'; } St().apply(s, { health: -12, mood: -5 }); s.rep = U.clamp(s.rep + 4); return 'Получили пару ударов, но куртку отстояли. Здоровье −12, репутация +4.'; } },
        { t: 'Позвать охрану', run: s => { s.rep = U.clamp(s.rep + 2); return 'Охранник выставил хулиганов. Безопасный и разумный выбор.'; } },
        { t: 'Отвернуться', run: s => { St().apply(s, { stress: 8 }); return 'Утром старик молча смотрит в пол. Неприятно.'; } }
      ] },
    { id: 'dog', icon: '🐕', title: 'Бездомный пёс', w: 1, when: s => !s.flags.dog && SN.T.day(s) > 3,
      text: 'Рыжая дворняга уже третий день ходит за вами и спит рядом, когда вы на улице.',
      choices: [
        { t: 'Приютить и назвать Рыжиком', run: s => { s.flags.dog = true; St().apply(s, { mood: 15, stress: -10 }); return 'Теперь вы не один. Рыжик греет ночами (+тепло во сне на улице) и поднимает настроение. Корм — 50 ₽ в день.'; } },
        { t: 'Покормить, но не забирать', lock: s => E().canPay(s, 60) ? '' : 'Нет 60 ₽', run: s => { E().pay(s, 60, 'food', 'Корм для собаки'); St().apply(s, { mood: 5 }); return 'Пёс благодарно виляет хвостом.'; } },
        { t: 'Отогнать', run: () => 'Пёс уходит, оглядываясь.' }
      ] },
    { id: 'inspection', icon: '📋', title: 'Проверка бизнеса', w: 2, when: s => s.biz.length > 0,
      text: 'Санитарная проверка нашла нарушения на одной из ваших точек.',
      choices: [
        { t: 'Устранить нарушения (4 000 ₽)', lock: s => E().canPay(s, 4000) ? '' : 'Нет 4 000 ₽', run: s => { E().pay(s, 4000, 'business', 'Устранение нарушений'); s.biz.forEach(b => b.rep = U.clamp(b.rep + 3)); return 'Всё исправлено. Клиенты ценят чистоту: репутация точек +3.'; } },
        { t: 'Оспорить (шанс по навыку «Финансы»)', run: s => { if (U.chance(s, 0.3 + s.sk.finance / 150)) return 'Юридически грамотная жалоба — штраф отменён!'; E().pay(s, Math.min(E().available(s), 8000), 'business', 'Штраф'); s.biz.forEach(b => b.rep = U.clamp(b.rep - 5)); return 'Оспорить не удалось: штраф 8 000 ₽, репутация точек −5.'; } }
      ] },
    { id: 'supplier', icon: '🚚', title: 'Выгодный поставщик', w: 2, when: s => s.biz.length > 0 && !s.flags.supplierDeal,
      text: 'Оптовик предлагает предоплату 6 000 ₽ за скидку: ваши точки получат +5 к репутации за свежий товар.',
      choices: [
        { t: 'Заключить договор', lock: s => E().canPay(s, 6000) ? '' : 'Нет 6 000 ₽', run: s => { E().pay(s, 6000, 'business', 'Договор с поставщиком'); s.flags.supplierDeal = true; s.biz.forEach(b => b.rep = U.clamp(b.rep + 5)); return 'Договор подписан. Репутация точек +5.'; } },
        { t: 'Отказаться', run: () => 'Работаете со старым поставщиком.' }
      ] },
    { id: 'cold', icon: '🥶', title: 'Резкое похолодание', w: 2, when: s => s.weather && s.weather.temp < 3 && s.housing === 'street',
      text: 'Ночью обещают сильный мороз. На улице спать опасно.',
      choices: [{ t: 'Понятно: ночлежка с 19:00 или хостел', run: s => { s.flags.coldWarned = T.day(s); return 'Ночлежка в Старом районе бесплатна. Пункт помощи выдаёт тёплые вещи.'; } }] },
    { id: 'volunteer', icon: '🍲', title: 'Волонтёры раздают обеды', w: 2, when: s => s.housing === 'street' && SN.T.weekend(s),
      text: 'Волонтёры привезли горячую еду. Среди них — девушка в синей куртке: Катя, студентка-медик.',
      choices: [
        { t: 'Поесть и познакомиться', run: s => { St().apply(s, { food: 35, warmth: 8 }); const n = SN.Sys.social.get(s, 'katya'); if (!n.met) { n.met = true; n.rel = 8; } else n.rel = U.clamp(n.rel + 3); return 'Горячий плов и короткий разговор. Катя: «Приходи по субботам, мы всегда тут»'; } },
        { t: 'Помочь раздавать (2 ч)', run: s => { T.advance(s, 120, {}); St().apply(s, { food: 30, mood: 12 }); s.rep = U.clamp(s.rep + 4); const n = SN.Sys.social.get(s, 'katya'); n.met = true; n.rel = U.clamp(n.rel + 8); return 'Два часа вы помогаете волонтёрам. Катя явно впечатлена. Репутация +4.'; } }
      ] },
    { id: 'rainstorm', icon: '⛈️', title: 'Ливень', w: 2, when: s => s.weather && s.weather.kind === 'rain',
      text: 'Ливень стеной. Одежда промокает за минуту.',
      choices: [
        { t: 'Переждать под навесом (1 ч)', run: s => { T.advance(s, 60, { indoor: true }); return 'Ливень стих. Вы сухи.'; } },
        { t: 'Идти дальше', run: s => { St().apply(s, { warmth: -15, hygiene: -5 }); if (U.chance(s, 0.25)) St().getIll(s, 'cold'); return 'Промокли до нитки. Тепло −15.'; } }
      ] },
    { id: 'oldfriend', icon: '📱', title: 'Звонок старого друга', w: 1, when: s => s.items.includes('phone') && !s.flags.oldFriend && SN.T.day(s) > 10,
      text: 'Пишет одноклассник Дима: «Слышал, ты в городе. Нужен человек на склад к нам, могу замолвить слово».',
      choices: [{ t: 'Поблагодарить', run: s => { s.flags.oldFriend = true; s.flags.interviewBonus = true; s.rep = U.clamp(s.rep + 2); return 'Рекомендация знакомого: шанс на следующем собеседовании +15%.'; } }] },
    { id: 'heat', icon: '🥵', title: 'Жара', w: 2, when: s => s.weather && s.weather.kind === 'heat',
      text: 'Под тридцать градусов. Тяжело работать на улице.',
      choices: [{ t: 'Пить воду и беречь силы', lock: s => E().canPay(s, 60) ? '' : 'Нет 60 ₽', run: s => { E().pay(s, 60, 'food', 'Вода'); return 'Бутылка воды спасает день.'; } },
        { t: 'Терпеть', run: s => { St().apply(s, { energy: -10, mood: -5 }); return 'Энергия −10.'; } }] }
  ];

  /* Фиксированные сезонные события по календарю */
  D.seasonal = [
    { id: 'fair', when: (s, o) => o.d >= 12 && o.d <= 14, icon: '🎪', title: 'Городская ярмарка', text: 'В Центре ярмарка: работа продавцом на ярмарке (5 ч, 1 700 ₽), гулянья и скидки.', flag: 'fair' },
    { id: 'newyear', when: (s, o) => o.m === 11 && o.d === 31, icon: '🎄', title: 'Новый год', text: 'Город светится гирляндами. Соццентр устраивает праздничный ужин, а волонтёры раздают подарки.', effect: s => { St().apply(s, { mood: 20, food: 20 }); } },
    { id: 'cityday', when: (s, o) => o.m === 8 && o.d === 10, icon: '🎆', title: 'День города', text: 'Концерты на набережной бесплатны, весь город гуляет.', effect: s => { St().apply(s, { mood: 15 }); } }
  ];
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/data/quests.js */
/* Задания (сюжетные линии) и достижения.
   Задание становится активным, когда выполнены все задания из after. done(s) проверяется после каждого действия. */
(function (G) {
  'use strict';
  const SN = G.SN, D = SN.D;
  const npc = (s, id) => s.npc[id] || { rel: 0, mem: {} };
  const bizType = (s, id) => s.biz.some(b => b.id === id);

  D.questLines = {
    docs: ['🪪', 'Документы'], money: ['💼', 'Работа и деньги'], home: ['🏠', 'Крыша над головой'],
    study: ['🎓', 'Учёба'], biz: ['🏪', 'Своё дело'], people: ['👥', 'Люди'], fin: ['💳', 'Финансы'], life: ['🌱', 'Жизнь']
  };

  D.quests = [
    // ── Документы
    { id: 'q_nina', line: 'docs', title: 'Соцработник', desc: 'Познакомьтесь с Ниной Петровной в соццентре Старого района (будни, 9–18).',
      done: s => !!npc(s, 'nina').mem.intro, reward: { xp: 40, rep: 2 } },
    { id: 'q_passport', line: 'docs', after: ['q_nina'], title: 'Восстановить паспорт', desc: 'Получите направление у Нины Петровны, подайте заявление в МФЦ (Центр) и дождитесь 5 дней.',
      done: s => s.docs.passport, prog: s => s.docsPending.passport ? 'Готов на день ' + s.docsPending.passport : (s.flags.ninaReferral ? 'Направление есть — в МФЦ' : 'Нужно направление'), reward: { xp: 120, rep: 5 } },
    { id: 'q_oms', line: 'docs', after: ['q_passport'], title: 'Полис ОМС', desc: 'Оформите полис в МФЦ — бесплатная поликлиника.', done: s => s.docs.oms, reward: { xp: 50 } },
    { id: 'q_medbook', line: 'docs', after: ['q_passport'], title: 'Медкнижка', desc: 'Оформите медкнижку в Больничном квартале (2 700 ₽). Нужна для кафе, магазина и медицины.', done: s => s.docs.medbook, reward: { xp: 80 } },

    // ── Работа и деньги
    { id: 'q_firstgig', line: 'money', title: 'Первая подработка', desc: 'Выполните любую подработку.', done: s => s.c.gigs >= 1, reward: { xp: 30 } },
    { id: 'q_earn5k', line: 'money', after: ['q_firstgig'], title: 'Первые 5 000 ₽', desc: 'Заработайте суммарно 5 000 ₽.', done: s => s.c.earned >= 5000, prog: s => SN.U.num(Math.min(s.c.earned, 5000)) + ' / 5 000 ₽', reward: { xp: 60, money: 300 } },
    { id: 'q_job', line: 'money', after: ['q_passport'], title: 'Постоянная работа', desc: 'Пройдите собеседование и устройтесь на вакансию.', done: s => !!s.job || s.c.jobs > 0, reward: { xp: 150, rep: 5 } },
    { id: 'q_promo', line: 'money', after: ['q_job'], title: 'Первое повышение', desc: 'Получите повышение на работе.', done: s => s.job && s.job.rank >= 1, reward: { xp: 200, rep: 5 } },
    { id: 'q_skilled', line: 'money', after: ['q_job'], title: 'Квалифицированный труд', desc: 'Устройтесь на работу, где требуется специальное обучение.', done: s => s.job && (SN.D.jobById[s.job.id].req.certs || []).length > 0, reward: { xp: 200, rep: 6 } },

    // ── Жильё
    { id: 'q_shelter', line: 'home', title: 'Тёплая ночь', desc: 'Переночуйте в ночлежке Старого района (заселение с 19:00).', done: s => (s.flags.shelterNights || 0) >= 1, reward: { xp: 30 } },
    { id: 'q_hostel', line: 'home', after: ['q_shelter'], title: 'Своя койка', desc: 'Снимите койко-место в хостеле (4 200 ₽ в неделю).', done: s => s.housing !== 'street', reward: { xp: 100, rep: 3 } },
    { id: 'q_room', line: 'home', after: ['q_hostel'], title: 'Своя дверь', desc: 'Снимите комнату или квартиру.', done: s => ['room', 'flat', 'studio', 'house'].includes(s.housing), reward: { xp: 150, rep: 4 } },
    { id: 'q_own', line: 'home', after: ['q_room'], title: 'Своё жильё', desc: 'Купите квартиру-студию или дом.', done: s => ['studio', 'house'].includes(s.housing), reward: { xp: 600, rep: 10 } },

    // ── Учёба
    { id: 'q_self', line: 'study', title: 'Голова — тоже инструмент', desc: 'Позанимайтесь самообразованием в библиотеке.', done: s => s.c.studyH >= 2, reward: { xp: 30 } },
    { id: 'q_cert', line: 'study', after: ['q_self'], title: 'Первый документ об обучении', desc: 'Пройдите любой курс до конца.', done: s => s.certs.length >= 1, reward: { xp: 100, rep: 3 } },
    { id: 'q_school', line: 'study', after: ['q_cert'], title: 'Аттестат', desc: 'Окончите вечернюю школу.', done: s => s.certs.includes('school'), reward: { xp: 250, rep: 5 } },
    { id: 'q_diploma', line: 'study', after: ['q_school'], title: 'Диплом', desc: 'Получите диплом колледжа или вуза.', done: s => ['accounting', 'medcollege', 'university', 'meduni'].some(c => s.certs.includes(c)), reward: { xp: 500, rep: 8 } },

    // ── Своё дело
    { id: 'q_ip', line: 'biz', after: ['q_passport'], title: 'Индивидуальный предприниматель', desc: 'Зарегистрируйте ИП в Деловом районе.', done: s => s.docs.ip, reward: { xp: 80 } },
    { id: 'q_biz1', line: 'biz', after: ['q_ip'], title: 'Первая точка', desc: 'Откройте любой бизнес.', done: s => s.biz.length >= 1, reward: { xp: 200, rep: 5 } },
    { id: 'q_bizweek', line: 'biz', after: ['q_biz1'], title: 'Неделя в плюсе', desc: 'Наберите 7 прибыльных дней бизнеса.', done: s => s.c.bizProfitDays >= 7, prog: s => Math.min(7, s.c.bizProfitDays) + ' / 7 дней', reward: { xp: 250, rep: 5 } },
    { id: 'q_biz2', line: 'biz', after: ['q_bizweek'], title: 'Сеть', desc: 'Владейте тремя бизнесами одновременно.', done: s => s.biz.length >= 3, reward: { xp: 600, rep: 10 } },

    // ── Люди
    { id: 'q_seryoga', line: 'people', title: 'Плечо друга', desc: 'Подружитесь с Серёгой (отношения 40).', done: s => npc(s, 'seryoga').rel >= 40, prog: s => Math.round(npc(s, 'seryoga').rel) + ' / 40', reward: { xp: 60 } },
    { id: 'q_seryoga2', line: 'people', after: ['q_seryoga'], title: 'Сварщик шестого разряда', desc: 'Помогите Серёге вернуться в профессию.', done: s => !!s.flags.seryogaFactory, reward: { xp: 150, rep: 5 } },
    { id: 'q_mihalych', line: 'people', title: 'Письмо сыну', desc: 'Сблизьтесь с Михалычем на набережной и помогите ему помириться с сыном.', done: s => !!s.flags.mihalychReunited, reward: { xp: 200, rep: 6 } },
    { id: 'q_valera', line: 'people', title: 'Партнёр по гаражу', desc: 'Станьте партнёром Валеры (нужно ИП и доверие).', done: s => !!s.flags.valeraPartner, reward: { xp: 200, rep: 4 } },
    { id: 'q_date', line: 'people', title: 'Свидание', desc: 'Пригласите кого-нибудь на свидание и получите согласие.', done: s => Object.values(s.npc).some(n => n.status), reward: { xp: 100 } },
    { id: 'q_together', line: 'people', after: ['q_date'], title: 'Вместе', desc: 'Съезжайтесь с партнёром.', done: s => Object.values(s.npc).some(n => n.livingTogether), reward: { xp: 300, rep: 5 } },
    { id: 'q_wedding', line: 'people', after: ['q_together'], title: 'Семья', desc: 'Сыграйте свадьбу.', done: s => Object.values(s.npc).some(n => n.status === 'married'), reward: { xp: 600, rep: 10 } },

    // ── Финансы
    { id: 'q_account', line: 'fin', after: ['q_passport'], title: 'Банковский счёт', desc: 'Откройте счёт в банке (Деловой район). Деньги на счёте не украдут.', done: s => s.account, reward: { xp: 60 } },
    { id: 'q_cushion', line: 'fin', after: ['q_account'], title: 'Подушка безопасности', desc: 'Накопите 30 000 ₽ на счёте и вкладе.', done: s => s.bank + s.fin.deposit >= 30000, prog: s => SN.U.num(Math.min(30000, s.bank + s.fin.deposit)) + ' / 30 000 ₽', reward: { xp: 150, rep: 3 } },
    { id: 'q_invest', line: 'fin', after: ['q_cushion'], title: 'Инвестор', desc: 'Вложите деньги в индексный фонд.', done: s => (s.fin.funds.index || 0) > 0, reward: { xp: 80 } },

  // ── Задания и достижения
