name: Publish DroidVM OS from zip release

on:
  push:
    branches: [ droidvm ]
    paths: [ '.github/workflows/os-quick.yml' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза с droidvm-os-arm64.zip'
        required: true
        default: 'droidvm-os-2026.10.30-3'

env:
  TAG: ${{ github.event.inputs.tag || 'droidvm-os-2026.10.30-3' }}

permissions:
  contents: write

jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - name: Разложить zip на отдельные файлы
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /mnt/w && sudo chown $USER /mnt/w && cd /mnt/w
          gh release download -R ${{ github.repository }} "$TAG" -p droidvm-os-arm64.zip
          unzip -q droidvm-os-arm64.zip -d pkg && rm droidvm-os-arm64.zip
          mv pkg/vda.qcow2 droidvm-os-vda.qcow2
          mv pkg/vdb.qcow2 droidvm-os-vdb.qcow2
          V="$TAG"; V="${V#droidvm-os-}"
          python3 - "$V" <<'PY'
          import json, os, sys
          m = json.load(open('pkg/droidvm-os.json'))
          m['version'] = sys.argv[1]
          m['disks'] = ['droidvm-os-vda.qcow2', 'droidvm-os-vdb.qcow2']
          m['files'] = [{'name': n, 'size': os.path.getsize(n)} for n in m['disks']]
          json.dump(m, open('droidvm-os.json', 'w'), ensure_ascii=False, indent=1)
          print(m)
          PY

      - name: Выложить в droidvm-os-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd /mnt/w && ls -la
          gh release view droidvm-os-latest -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create droidvm-os-latest -R ${{ github.repository }} --title "DroidVM OS (последняя версия)" \
              --notes "Всегда последняя сборка DroidVM OS. Отсюда её скачивает приложение."
          gh release upload droidvm-os-latest -R ${{ github.repository }} --clobber \
            droidvm-os-vda.qcow2 droidvm-os-vdb.qcow2 droidvm-os.json || { echo "::error::загрузка не удалась"; exit 1; }
          gh release view droidvm-os-latest -R ${{ github.repository }} --json assets -q '.assets[] | "\(.name) \(.size)"' | while read l; do echo "::notice::$l"; done
