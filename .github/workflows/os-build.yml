name: Build DroidVM OS

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Тег релиза LineageOS for QEMU (пусто = последний)'
        required: false
        default: ''
  push:
    branches: [ droidvm ]
    paths: [ 'os/**', '.github/workflows/os-build.yml' ]

permissions:
  contents: write

jobs:
  os:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Инструменты и место на диске
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils gdisk zip unzip erofs-utils e2fsprogs llvm python3-pyelftools mtools qemu-system-arm qemu-efi-aarch64 imagemagick >/dev/null
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/w && sudo chown $USER /mnt/w
          df -h / /mnt

      - name: Собрать образ
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ github.event.inputs.base_tag }}
          WORK: /mnt/w/work
          OUT: /mnt/w/out
        run: |
          export VERSION="$(date +%Y.%m.%d)-${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          [ -n "$BASE_TAG" ] || unset BASE_TAG
          set -o pipefail
          bash os/build-os.sh 2>&1 | tee /mnt/w/os-build.log

      - name: Журнал сборки в ветку droidvm-logs
        if: always()
        run: |
          cd /mnt/w
          rm -rf logs && git clone -q --depth 1 -b droidvm-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs 2>/dev/null || \
            (git init -q logs && cd logs && git checkout -q --orphan droidvm-logs && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}")
          cd logs
          cp ../os-build.log os-build.log 2>/dev/null || echo "нет журнала" > os-build.log
          rm -rf preboot && mkdir -p preboot
          cp ../out/preboot/serial.log preboot/ 2>/dev/null || true
          cp ../out/preboot/shots/*.png preboot/ 2>/dev/null || true
          echo "run ${{ github.run_id }} status ${{ job.status }}" > os-build.status
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "os-build log ${{ github.run_id }}" || true
          git push -q origin HEAD:droidvm-logs

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: droidvm-os-${{ env.VERSION }}
          name: DroidVM OS ${{ env.VERSION }}
          body: |
            Прошивка для DroidVM: LineageOS для QEMU (ARM64) + Magisk (root) + функции DroidVM OS.
            Образ уже прошёл первую загрузку на сервере — у вас система стартует быстро.
            Установка: в приложении DroidVM → «Установить DroidVM OS» (нужна версия приложения 1.1.10+),
            или вручную: ВМ ARM64/UEFI с дисками droidvm-os-vda.qcow2 и droidvm-os-vdb.qcow2 (virtio), экран 720x1280.
          files: |
            /mnt/w/out/droidvm-os-vda.qcow2
            /mnt/w/out/droidvm-os-vdb.qcow2
            /mnt/w/out/droidvm-os.json
            /mnt/w/out/droidvm_boot_arm64.img

      - name: Постоянная ссылка droidvm-os-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd /mnt/w/out
          gh release view droidvm-os-latest -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create droidvm-os-latest -R ${{ github.repository }} --title "DroidVM OS (последняя версия)" \
              --notes "Всегда последняя сборка DroidVM OS. Отсюда её скачивает приложение."
          gh release upload droidvm-os-latest -R ${{ github.repository }} --clobber \
            droidvm-os-vda.qcow2 droidvm-os-vdb.qcow2 droidvm-os.json || { echo "::error::загрузка не удалась"; exit 1; }
          gh release edit droidvm-os-latest -R ${{ github.repository }} --notes "Всегда последняя сборка DroidVM OS (сейчас ${{ env.VERSION }}). Отсюда её скачивает приложение."
