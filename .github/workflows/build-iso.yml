name: Build NOVA OS ISO (experimental)

# How to use from a phone: GitHub app/website → Actions → "Build NOVA OS ISO"
# → Run workflow. Results appear as downloadable artifacts of the run.
on:
  workflow_dispatch:
    inputs:
      build_iso:
        description: 'Build the ISO (60–120 min)'
        type: boolean
        default: true
      boot_test:
        description: 'Boot-test the ISO in QEMU (BIOS + UEFI, screenshots)'
        type: boolean
        default: true
      vendor_themes:
        description: 'Maintainers: re-download third-party themes from GitHub into branch vendor/themes'
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: nova-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor-themes:
    name: Vendor third-party themes (GitHub → branch vendor/themes)
    if: github.event_name == 'workflow_dispatch' && inputs.vendor_themes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download and stage themes
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
          bash tools/vendor-themes.sh "$PWD/third_party"
      - name: Commit to branch vendor/themes for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B vendor/themes
          git add third_party
          git commit -q -m "Vendor third-party themes (see third_party/INVENTORY.txt)"
          git push -f origin vendor/themes

  validate:
    name: Validate sources (static checks + unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-psutil python3-pil nodejs
      - name: Static checks and unit tests
        run: |
          set -o pipefail
          bash tools/validate-project.sh 2>&1 | tee validate.log
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E '^(FAIL|ERROR)|Error|AssertionError|Traceback|not found|Missing|Bad ' validate.log | head -20 \
            | while IFS= read -r line; do echo "::error title=validate::${line}"; done
          tail -n 30 validate.log | sed 's/^/::warning title=validate-tail::/'

  ui-smoke:
    name: UI smoke (all NOVA windows, 4 screen sizes, light + dark + NEON; NEON QML)
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install PyQt6 and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 fonts-noto-core fonts-noto-color-emoji
          sudo apt-get install -y --no-install-recommends fonts-inter || echo 'fonts-inter unavailable on runner (Noto used)'
          python3 -m pip install --user --break-system-packages PyQt6 psutil pillow
      - name: Render every NOVA window offscreen
        run: |
          set +e
          python3 image/config/includes.chroot/usr/local/bin/nova-selftest --ui-smoke output/ui-smoke --themes light,dark,neon,aurora,sakura,ocean > output-ui.txt
          code=$?
          set -e
          python3 tools/ui_smoke_summary.py output/ui-smoke/ui-report.json >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Render NEON//SYS live wallpaper scenes and boot splash (QML)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python3 tools/neon_qml_smoke.py output/neon-qml
      - name: Publish PR results to branch ci/pr-ui (same-repository pull requests)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output/pr-ui
          python3 tools/ui_contact_sheet.py output/ui-smoke output/pr-ui || true
          cp -r output/neon-qml output/pr-ui/ 2>/dev/null || true
          mkdir -p output/pr-ui/styles-app
          for f in output/ui-smoke/*1920x1080*/nova-styles.png; do [ -f "$f" ] && cp "$f" "output/pr-ui/styles-app/$(basename "$(dirname "$f")").png"; done || true
          cp output-ui.txt output/pr-ui/ 2>/dev/null || true
          bash tools/ci_publish.sh pr-ui output/pr-ui
      - name: Publish contact sheets to branch ci/ui-smoke
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/ui_contact_sheet.py output/ui-smoke output/ui-sheets || true
          cp -r output/neon-qml output/ui-sheets/ 2>/dev/null || true
          mkdir -p output/ui-sheets/styles-app
          for f in output/ui-smoke/*1920x1080*/nova-styles.png; do [ -f "$f" ] && cp "$f" "output/ui-sheets/styles-app/$(basename "$(dirname "$f")").png"; done || true
          cp output-ui.txt output/ui-sheets/ 2>/dev/null || true
          bash tools/ci_publish.sh ui-smoke output/ui-sheets
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-UI-smoke-screenshots
          path: output/ui-smoke
          if-no-files-found: warn
          retention-days: 14

  build-iso:
    name: Build ISO in Debian 13 container
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Read VERSION
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Free runner disk space
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker system prune -af || true
          df -h .
      - name: Build Debian 13 ISO in privileged disposable container
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            debian:trixie \
            bash -c 'set -Eeuo pipefail; bash tools/install-build-deps.sh; bash tools/build-iso.sh'
      - name: Summary
        if: always()
        run: |
          {
            echo "## NOVA OS ${{ steps.version.outputs.version }} — ISO build"
            if [ -f output/verify-report.txt ]; then echo '```'; cat output/verify-report.txt; echo '```'; fi
            if [ -f output/SHA256SUMS ]; then echo "SHA-256: \`$(cat output/SHA256SUMS)\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish build reports to branch ci/build
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo mkdir -p output/ci-build
          sudo chown "$(id -u)" output/ci-build
          for f in output/verify-report.txt output/SHA256SUMS; do [ -f "$f" ] && cp "$f" output/ci-build/; done
          [ -f output/build-manifest.txt ] && head -c 3000000 output/build-manifest.txt > output/ci-build/build-manifest.txt
          if [ -f output/build.log ]; then
            tail -n 400 output/build.log > output/ci-build/build-log-tail.txt
            grep -nE '^(E:|W:|P: |ERROR|Error)|Unable to locate|has no installation candidate|unmet dependencies|failed' output/build.log \
              | head -n 300 > output/ci-build/build-log-errors.txt || true
          fi
          df -h . > output/ci-build/disk.txt
          ls -l output > output/ci-build/output-listing.txt
          bash tools/ci_publish.sh build output/ci-build
      - name: Upload ISO and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-OS-${{ steps.version.outputs.version }}-ISO
          path: |
            output/NOVA-OS-${{ steps.version.outputs.version }}-amd64.iso
            output/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-OS-build-reports
          path: |
            output/build.log
            output/build-manifest.txt
            output/verify-report.txt
          if-no-files-found: ignore
          retention-days: 14

  boot-test:
    name: Boot test in QEMU (${{ matrix.firmware }})
    needs: build-iso
    if: github.event_name != 'workflow_dispatch' || inputs.boot_test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo 'No KVM: QEMU will use slow TCG emulation'
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf python3-pil
      - uses: actions/download-artifact@v4
        with:
          name: NOVA-OS-${{ needs.build-iso.outputs.version }}-ISO
          path: output
      - name: Verify checksum
        run: cd output && sha256sum --check SHA256SUMS
      - name: Boot, log in, self-test, screenshots
        run: |
          python3 tools/nova_qemu_smoke.py \
            --iso output/NOVA-OS-${{ needs.build-iso.outputs.version }}-amd64.iso \
            --firmware ${{ matrix.firmware }} --out output/boot-test-${{ matrix.firmware }} --resolutions --styles
      - name: Summary
        if: always()
        run: |
          {
            echo "## Boot test: ${{ matrix.firmware }}"
            echo '```json'
            cat output/boot-test-${{ matrix.firmware }}/result.json 2>/dev/null || echo '{"verdict":"no result"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish boot results to branch ci/boot-${{ matrix.firmware }}
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d=output/boot-test-${{ matrix.firmware }}
          mkdir -p output/ci-boot
          cp $d/*.png $d/*.json $d/*.txt output/ci-boot/ 2>/dev/null || true
          [ -f $d/serial.log ] && tail -c 200000 $d/serial.log > output/ci-boot/serial-tail.log || true
          bash tools/ci_publish.sh boot-${{ matrix.firmware }} output/ci-boot
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-OS-boot-test-${{ matrix.firmware }}
          path: |
            output/boot-test-${{ matrix.firmware }}/*.png
            output/boot-test-${{ matrix.firmware }}/*.json
            output/boot-test-${{ matrix.firmware }}/*.txt
            output/boot-test-${{ matrix.firmware }}/*.log
          if-no-files-found: warn
          retention-days: 14
