name: Build APK

on:
  push:
    branches: [ main, master, droidvm ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      with_x86_64:
        description: 'Добавить QEMU и для x86_64-устройств (Chromebook, эмуляторы)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Собрать APK (QEMU из Termux + Gradle)
        env:
          ABIS: ${{ github.event.inputs.with_x86_64 == 'true' && '--abi arm64-v8a --abi x86_64' || '--abi arm64-v8a' }}
        run: bash ci/build.sh

      - uses: actions/upload-artifact@v5
        with:
          name: DroidVM-apk
          path: dist/DroidVM.apk

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DroidVM.apk
