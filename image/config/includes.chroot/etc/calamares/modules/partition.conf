# NOVA 0.4: cautious initial partition selection; Calamares may still offer erase.
# User must explicitly choose partitioning method, preferably alongside Windows.
# This file does not itself disable any destructive options.
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 300MiB
  minimumSize: 32MiB
initialPartitioningChoice: none
initialSwapChoice: none
defaultFileSystemType: "ext4"
userSwapChoices:
  - none
  - small
  - file
